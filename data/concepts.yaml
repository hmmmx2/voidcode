  # headline area had no backbone: ranking had nothing to rank against, and course
  # assembly had no prerequisite order to follow. These seven categories map onto
  # the five areas the revised plan names (Python for ML/DL, LLM, VLM, CUDA and
  # kernels, ML systems design).
  - id: ml_foundations
    name: Python and Tensors for ML
  - id: deep_learning
    name: Deep Learning Fundamentals
  - id: transformers
    name: Transformer Architecture
  - id: training_systems
    name: Training at Scale
  - id: gpu_kernels
    name: GPU Programming and Kernels
  - id: vision_language
    name: Vision and Multimodal
  - id: inference_systems
    name: Inference and Serving

