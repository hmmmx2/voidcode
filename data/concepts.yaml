# VoidCode AI — Programming Concept Taxonomy
#
# Spec §4.2. 80 concepts. This file is the single source of truth for the taxonomy;
# spec §9 also lists a copy under features/, which would be a drift hazard — see
# docs/OPEN_QUESTIONS.md Q-005. Do not duplicate it.
#
# Used by:
#   - Phase 2 feature pipeline  (per-learner per-concept mastery vectors)
#   - Phase 3 candidate generation (prerequisite-graph walk) and ranking features
#   - Phase 3 course assembly (module ordering follows the prerequisite DAG)
#
# `prerequisites` forms a DAG. features/taxonomy.py asserts it is acyclic and that
# every referenced id exists; that assertion is a test, not a comment.
#
# `tag_mappings` projects Codeforces' 38 official problem tags onto this taxonomy.
# A single coarse tag such as "dp" spans a wide difficulty range, so each rule is
# additionally gated on the problem's Codeforces rating (800–3500). This is a
# deliberate modelling choice: rating bands act as a proxy for sub-concept
# specificity, because the tag alone cannot distinguish a 1D dp warm-up from a
# bitmask dp. Documented in docs/RANKING_DESIGN.md.

version: 1
source_tag_vocabulary: codeforces/problemset.problems (38 tags, fetched 2026-07-26)
max_concepts_per_problem: 4

categories:
  - id: foundations
    name: Language and Program Foundations
  - id: data_structures
    name: Data Structures
  - id: techniques
    name: Algorithmic Techniques
  - id: recursion_dp
    name: Recursion and Dynamic Programming
  - id: graphs
    name: Graphs and Trees
  - id: math
    name: Mathematics
  - id: strings
    name: Strings
  - id: geometry
    name: Geometry

  # ── ML / DL / systems, added for V1 ─────────────────────────────────────────
