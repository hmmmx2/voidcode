# ─────────────────────────────────────────────────────────────────────────────
# Codeforces tag -> concept projection.
#
# Rules are evaluated in order; the first rule whose `max_rating` is >= the
# problem's rating wins. Problems with no rating (unrated / gym) fall through to
# `unrated_concepts`. All 38 official tags are covered; `*special` is a marker
# rather than a concept and maps to nothing.
# ─────────────────────────────────────────────────────────────────────────────
tag_mappings:
  implementation:
    - {max_rating: 1200, concepts: [implementation_simulation, arrays_and_indexing]}
    - {max_rating: 1700, concepts: [implementation_simulation, string_manipulation]}
    - {max_rating: 9999, concepts: [implementation_simulation]}
  math:
    - {max_rating: 1200, concepts: [arithmetic_and_modulo]}
    - {max_rating: 1800, concepts: [number_theory_gcd, combinatorics]}
    - {max_rating: 9999, concepts: [combinatorics, modular_exponentiation]}
  greedy:
    - {max_rating: 1400, concepts: [greedy_exchange_argument, sorting_basics]}
