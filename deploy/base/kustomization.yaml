apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voidcode

resources:
  - namespace.yaml
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - ingress.yaml
  - network-policy.yaml

# Non-secret settings only. Everything here ends up readable by anyone with get on
# ConfigMaps, so the split is not cosmetic: APP_ENV=production is what makes
# assert_production_config() refuse to boot on a missing secret, and TRUSTED_PROXY_HOPS
# must match the real number of proxies in front of the ingress or the rate limiter
# reads an address the client chose.
#
# TRUSTED_PROXY_HOPS MATTERS MORE NOW THAN IT DID. The API is reachable from the
# internet on its own host (see ingress.yaml), so every sign-in attempt and every
# password-reset request arrives through nginx and the limiter's idea of "the client"
# is whatever this number says. One hop is ingress-nginx alone. Put Cloudflare or
# another L7 in front and it becomes 2 — set it wrong high and a single attacker
# chooses their own key by sending a header; set it wrong low and every caller shares
# the proxy's address and one person's mistyped password locks out everyone.
configMapGenerator:
  - name: voidcode-api-config
    literals:
      - APP_ENV=production
      - TRUSTED_PROXY_HOPS=1
      - EMAIL_PROVIDER=resend
      - JUDGE0_BASE_URL=http://judge0-server.voidcode-sandbox:2358
      # APP_BASE_URL is the public site's origin: Stripe returns buyers to
      # {APP_BASE_URL}/purchase/success/ and the API refuses to start in production
      # unless it is https://.
      - APP_BASE_URL=https://voidcode.example
      # ALLOWED_ORIGINS and INTERNAL_AUTH_ENFORCE are gone. Nothing browser-based calls
      # this API any more — the desktop app talks to it with a bearer token and the site
      # is static — so CORS has no origin to allow, and there is no unsigned identity
      # header left to enforce against. See apps/api/src/identity.py.

# NO secretGenerator, on purpose.
#
# Generating Secrets from literals here would put every value in git, which is the
# one thing this repo has been careful about — .gitignore's `.env*` and the template
# tests exist for it. Create them out of band:
#
#   kubectl -n voidcode create secret generic voidcode-api-secrets \
#     --from-env-file=apps/api/.env
# There is no voidcode-web-secrets any more: the web tier is static pages with no
# session, no signing key and no API calls. See web-deployment.yaml.
