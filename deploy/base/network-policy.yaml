# Default-deny egress for the API tier.
#
# The sandbox already blocks network from inside submissions — `sandbox/adversarial.py`
# measured DNS and raw-IP egress both failing. This is the layer above: it bounds what
# the API ITSELF can reach, so a compromised dependency or an SSRF in a handler cannot
# call out to arbitrary hosts.
#
# Egress policy is the one people skip because ingress feels like the security
# boundary. Ingress stops people getting in; egress stops data getting out, and
# exfiltration is the half that matters after a compromise.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voidcode-api-egress
spec:
  podSelector:
    matchLabels: { app: voidcode-api }
  policyTypes: [Egress]
  egress:
    # DNS. Without this rule every other rule fails, because nothing resolves — the
    # classic first mistake with a default-deny egress policy.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { "k8s-app": kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # In-cluster dependencies, by label rather than by CIDR.
    - to:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [postgres, redis] }
    - to:
        - namespaceSelector:
            matchLabels: { "kubernetes.io/metadata.name": voidcode-sandbox }
      ports:
        - { protocol: TCP, port: 2358 }
    # Resend's API, over TLS only. Named as a rule rather than left to a blanket
    # allow-all, so adding an outbound integration is a deliberate edit here.
    - ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voidcode-api-ingress
spec:
  podSelector:
    matchLabels: { app: voidcode-api }
  policyTypes: [Ingress]
  ingress:
    # THE INGRESS CONTROLLER AND THE METRICS SCRAPER. Nothing else in the cluster has a
    # reason to reach the API, and /metrics is unauthenticated — this is the control
    # that keeps it unreachable rather than merely unadvertised.
    #
    # It used to admit `app: voidcode-web`, because the website's server-side proxy was
    # the only caller. That proxy is gone and so is the label on anything that calls the
    # API: the desktop app arrives from the internet, through the ingress, so the
    # controller's namespace is what has to be allowed. Leaving the old selector in
    # place would have left the API unreachable by anything at all — the policy would
    # still look deliberate while nothing could talk to it.
    #
    # The namespace label, not a pod label: ingress-nginx renames and relabels its pods
    # between chart versions, and a policy keyed on a pod label silently stops matching
    # after an upgrade. `kubernetes.io/metadata.name` is set by the API server on every
    # namespace and cannot drift.
    #
    # PORT 8000 ONLY, for both sources. The ingress reaches `/v1` on it (the only path
    # routed — see ingress.yaml) and the scraper reaches `/metrics` on the same port;
    # narrowing further would need a second policy per path, which NetworkPolicy cannot
    # express. Path-level protection for `/metrics` is the ingress's job, and it does it
    # by not routing it.
    - from:
        - namespaceSelector:
            matchLabels: { "kubernetes.io/metadata.name": ingress-nginx }
        - namespaceSelector:
            matchLabels: { "kubernetes.io/metadata.name": monitoring }
      ports:
        - { protocol: TCP, port: 8000 }
