apiVersion: apps/v1
kind: Deployment
metadata:
  name: voidcode-web
  labels: { app: voidcode-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: voidcode-web }
  template:
    metadata:
      labels: { app: voidcode-web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000            # the `node` user in node:22-alpine
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: voidcode-web:latest
          ports:
            - { name: http, containerPort: 3000 }
          # NO ENVIRONMENT AND NO SECRETS. This tier is four static pages: the landing
          # page with the download on it, the two legal documents, and the two pages
          # Stripe returns a buyer to. It signs nothing, holds no session and makes no
          # request to the API — the only address it contacts is api.github.com, from the
          # visitor's own browser, to list the latest release.
          #
          # It used to carry INTERNAL_API_SECRET (its proxy signed X-User-Id with it),
          # AUTH_SECRET (NextAuth), API_INTERNAL_URL and AUTH_TRUST_HOST. All four went
          # with the logged-in UI; a secret mounted into a tier that cannot use it is a
          # blast radius with no benefit.
          #
          # NEXT_PUBLIC_RELEASES_REPO is deliberately absent too: like every
          # NEXT_PUBLIC_* value it is inlined at build time, so setting it here would do
          # nothing. See the Dockerfile's ARG.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Next.js writes its image-optimisation cache under .next/cache at runtime,
            # so a read-only rootfs needs this or the first optimised image 500s.
            - { name: cache, mountPath: /app/apps/web/.next/cache }
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            # A real route, not `/`. `/` redirects for a signed-in visitor and the
            # middleware runs on it; `/login` renders unconditionally, so a failure
            # here means the server is genuinely not serving.
            httpGet: { path: /login, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - { name: cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: voidcode-web
spec:
  selector: { app: voidcode-web }
  ports:
    - { name: http, port: 3000, targetPort: http }
