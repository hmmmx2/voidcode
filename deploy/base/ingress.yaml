apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voidcode
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSE. The chat completions stream holds a connection open and sends incrementally;
    # the default proxy buffering collects the whole response before forwarding, so the
    # tutor appears to hang for a full generation and then dumps its answer at once.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # Defence in depth behind ratelimit.py, which is per-identity. This one is per-IP
    # at the edge and catches a flood before it reaches Python at all.
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    # Both hosts, one certificate. cert-manager issues a SAN certificate covering the
    # list, so adding a host here is the whole change — forgetting it serves the
    # default backend's certificate and every desktop client refuses the connection
    # before it sends a request.
    - hosts: [voidcode.example, api.voidcode.example]
      secretName: voidcode-tls
  rules:
    # ── The website is not routed from here any more ──────────────────────────
    #
    # A rule sending `voidcode.example/` to a `voidcode-web` Service stood here. The website is its
    # own repository, deployed on Vercel, and `web-deployment.yaml` is deleted — so this rule would
    # route the product's public host to a Service that does not exist, which is a 503 on the page
    # that hands out the installer.
    #
    # The apex host therefore has NO rule in this cluster, deliberately: it is served by Vercel and
    # its DNS points there. `apps/api/tests/test_deploy_manifests.py` asserts no manifest names
    # `voidcode-web` again, because kustomize will happily build an ingress pointing at nothing.

    # ── The API, on its own host, and ONLY under /v1 ──────────────────────────
    #
    # THIS HOST IS NEW, AND IT IS WHAT MAKES THE DESKTOP APP USABLE AT ALL. Nothing
    # was routed to the API before: browser traffic reached it through /api/proxy on
    # the Next.js server, which signed the identity. That proxy is gone with the
    # website's logged-in UI, and a desktop application has no server of ours to route
    # through — it presents a bearer token from the machine it runs on. So `/v1` has to
    # be reachable from the internet.
    #
    # ONE PREFIX, NOT `/`. Everything else this process serves is either unauthenticated
    # or an internal detail, and each would be published by a `/` rule:
    #
    #   /metrics          Prometheus, no authentication. Request counts, queue depth,
    #                     wallet activity. Scraped in-cluster from the monitoring
    #                     namespace; see network-policy.yaml.
    #   /health           backend URL, model name and GPU memory — a map of the serving
    #                     stack for anyone who asks.
    #   /docs, /openapi.json, /redoc
    #                     FastAPI's generated explorer. Harmless in isolation, an
    #                     invitation in public.
    #
    # `pathType: Prefix` on `/v1` matches `/v1` and everything under it, and nothing
    # else — nginx will not fall through to another rule, so an unmatched path on this
    # host gets the default backend's 404 rather than reaching Python.
    #
    # `tests/test_deploy_manifests.py` asserts exactly this: every path routed to the
    # API is the `/v1` prefix, and none of the four above appears anywhere.
    - host: api.voidcode.example
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: voidcode-api
                port: { name: http }
