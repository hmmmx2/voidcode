# Alembic Configuration — VoidCode AI

[alembic]
# Path to migration environment
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Sync connection URL (Alembic CLI uses psycopg2, not asyncpg)
# Override via SQLALCHEMY_URL env var or DATABASE_URL_SYNC
sqlalchemy.url = postgresql://alwin:alwin_dev@localhost:5433/alwin_tutor

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
