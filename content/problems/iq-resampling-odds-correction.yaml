  template_code: "class Solution(object):\n    def correct_probs(self, probs, pi_true, pi_train):\n  \
    \      \"\"\"\n        :type probs: List[float]  -- model outputs from the resampled world\n     \
    \   :type pi_true: float      -- positive rate in the real population\n        :type pi_train: float\
    \     -- positive rate after resampling\n        :rtype: List[float]       -- corrected probabilities\n\
    \        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    probs = json.loads(_in[0])

    pi_true = float(_in[1])

    pi_train = float(_in[2])

    _r = Solution().correct_probs(probs, pi_true, pi_train)

    print([round(v, 6) for v in _r])

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def correct_probs(self, probs, pi_true, pi_train):\n\
  \        r = (pi_true / (1.0 - pi_true)) / (pi_train / (1.0 - pi_train))\n        out = []\n       \
  \ for p in probs:\n            if p <= 0.0:\n                out.append(0.0)\n            elif p >=\
  \ 1.0:\n                out.append(1.0)\n            else:\n                odds = (p / (1.0 - p)) *\
  \ r\n                out.append(odds / (1.0 + odds))\n        return out\n"
