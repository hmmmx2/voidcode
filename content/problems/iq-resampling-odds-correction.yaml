slug: iq-resampling-odds-correction
title: Undo resampling with an odds correction
difficulty: hard
categories:
- ML
concepts:
- tensors_and_shapes
description: 'Implement `correct_probs(probs, pi_true, pi_train)`.


  Resampling reweights the classes but leaves `p(x|y)` untouched. Written as Bayes in both worlds the
  likelihood ratio is identical and cancels, leaving a constant multiplier **on the odds**:


  ```

  r         = [pi_true / (1 - pi_true)] / [pi_train / (1 - pi_train)]

  odds_true = [p / (1 - p)] * r

  p_true    = odds_true / (1 + odds_true)

  ```


  Return the corrected probability for every entry of `probs`, each rounded to 6 decimal places.


  **Endpoints.** `p == 1.0` sends the odds to infinity -- return `1.0` without dividing by zero. `p ==
  0.0` returns `0.0`. Neither may raise.


  There is no equivalent operation on the probabilities themselves: the map is linear in odds and nonlinear
  in `p`, which is why a confident 0.9 from a 50/50 training set is really about 0.083 at a 1% base rate.
  Note what the correction does *not* change -- it is strictly monotone, so the ranking, and therefore
  any rank metric, is identical before and after. That is exactly why resampling looks harmless while
  you evaluate with a ranking metric and breaks everything the moment you threshold or multiply the score
  by a cost.


  Standard library only -- no numpy, no sklearn.'
inferred_concepts: true
review_needed: true
order_index: 7
examples:
- input: probs = [0.9], pi_true = 0.01, pi_train = 0.5
  output: '[0.083333]'
  explanation: r = (0.01/0.99) / (0.5/0.5) = 1/99. The training odds of 9 become 9/99 = 1/11, so p_true
    = (1/11)/(12/11) = 1/12 = 0.083333. The model's confident 0.9 is really about 8%.
- input: probs = [0.1, 0.5, 0.99], pi_true = 0.01, pi_train = 0.5
  output: '[0.001121, 0.01, 0.5]'
  explanation: An output of 0.5 on a balanced training set carries no information, so it maps exactly
    onto the true base rate 0.01. It takes 0.99 from the balanced model to reach even odds in the real
    population, which shows how far the whole scale is compressed.
constraints:
- 1 <= len(probs) <= 10^5
- 0 <= probs[i] <= 1
- 0 < pi_true < 1 and 0 < pi_train < 1
- p == 0 returns 0.0 and p == 1 returns 1.0; neither may raise.
- Round each returned value to 6 decimal places.
- Standard library only -- no numpy, no sklearn.
