hints:
- 'Write down what a single batch over all the examples computes: the sum of every per-example gradient,
  divided by the number of examples.'
- A microbatch's mean times its count recovers its SUM. That is the quantity that is safe to add across
  microbatches; means are not.
- Test yourself with counts [8, 2]. If dividing by 2 gives you the same answer as dividing by 10 examples,
  your microbatches were equal-sized and the case was not testing anything.
