slug: grad-accum-ragged-batch
title: Make accumulation match the large batch when the last microbatch is short
difficulty: medium
categories:
- DL
concepts:
- gradient_accumulation
- loss_functions
description: 'You are accumulating gradients over k microbatches to simulate one large batch. Each microbatch
  reports its MEAN per-example gradient and how many examples it held.


  Return the accumulated gradient that exactly equals what a single batch over all the examples would
  have produced, rounded to 6 decimal places.


  The trap: summing the microbatch means and dividing by k is correct only when every microbatch is the
  same size. Real dataloaders produce a short final microbatch, and dividing by k then over-weights the
  examples in it — a 2-example tail counts as much as a 32-example microbatch. Nothing crashes; accumulated
  training just quietly stops matching the large-batch run it is supposed to reproduce.'
inferred_concepts: false
review_needed: false
