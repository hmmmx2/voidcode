code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def accumulate(self, means, counts):\n        \"\"\"\n\
    \        :type means: List[float]   per-microbatch MEAN gradient\n        :type counts: List[int]\
    \    examples in each microbatch\n        :rtype: float              gradient equal to a single batch\
    \ over every example\n        \"\"\"\n"
  driver_code: 'import sys

    _tok = sys.stdin.read().split()

    _k = int(_tok[0])

    _means = [float(x) for x in _tok[1:1 + _k]]

    _counts = [int(x) for x in _tok[1 + _k:1 + 2 * _k]]

    print(Solution().accumulate(_means, _counts))

    '
reference_solution: "class Solution(object):\n    def accumulate(self, means, counts):\n        # Weight\
  \ each microbatch by the examples it actually held. Summing means and dividing by k\n        # is the\
  \ same thing ONLY when every count is equal, which is the case that hides the bug.\n        total =\
  \ 0.0\n        for mean, count in zip(means, counts):\n            total += mean * count\n        return\
  \ round(total / sum(counts), 6)\n"
