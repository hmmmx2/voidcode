slug: context-window-truncation
title: Fit a conversation into the context budget
difficulty: medium
categories:
- LLM
- Systems
concepts:
- kv_cache
- tokenization
description: 'Input: `budget`, then the token count of each message in order, **oldest first**.


  Keep the most recent messages that fit within `budget`, dropping from the oldest end. Return `kept tokens_used`
  separated by a space.


  The newest message is always kept even if it alone exceeds the budget — it is what the learner just
  asked, and dropping it means answering a different question. Report the real token count in that case
  rather than the budget, because the caller needs to know the overflow happened.'
order_index: 49
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def fit(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().fit(_p))

    '
reference_solution: "class Solution(object):\n    def fit(self, tokens):\n        budget = int(tokens[0])\n\
  \        msgs = [int(x) for x in tokens[1:]]\n        if not msgs:\n            return '0 0'\n     \
  \   kept = 1\n        used = msgs[-1]\n        for i in range(len(msgs) - 2, -1, -1):\n            if\
  \ used + msgs[i] > budget:\n                break\n            used += msgs[i]\n            kept +=\
  \ 1\n        return str(kept) + ' ' + str(used)\n"
