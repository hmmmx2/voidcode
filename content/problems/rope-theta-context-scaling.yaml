    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().theta(_p))

    '
reference_solution: "class Solution(object):\n    def theta(self, tokens):\n        base = float(tokens[0]);\
  \ tr = float(tokens[1]); tg = float(tokens[2])\n        if tr <= 0 or tg <= tr:\n            return\
  \ '1.0 ' + str(round(base, 1))\n        s = tg / tr\n        return str(round(s, 2)) + ' ' + str(round(base\
  \ * s, 1))\n"
