slug: rope-theta-context-scaling
title: Scale RoPE theta for a longer context
difficulty: hard
categories:
- LLM
concepts:
- positional_encoding
description: "Input: `base_theta trained_len target_len`.\n\nNTK-aware scaling raises the RoPE base so\
  \ the lowest-frequency band still completes a full rotation across the longer context:\n\n    scale\
  \     = target_len / trained_len\n    new_theta = base_theta * scale ** (dim / (dim - 2))\n\nwith `dim\
  \ / (dim - 2)` approximated as 1.0 here, so `new_theta = base_theta * scale`.\n\nReturn `scale new_theta`,\
  \ the scale rounded to 2 decimals and theta to 1. When `target_len <= trained_len` return the base theta\
  \ unchanged with a scale of 1.0 — shrinking the context does not call for rescaling, and applying it\
  \ anyway degrades a model that was working."
order_index: 81
