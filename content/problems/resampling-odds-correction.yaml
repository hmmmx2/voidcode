description: You trained on a resampled set whose positive rate is pi_train but you need probabilities
  for a population whose rate is pi_true. Write the correction that maps every model output back. It is
  a constant multiplier on the odds, not on the probability, and the endpoints 0 and 1 must not divide
  by zero.
