    '
reference_solution: "class Solution(object):\n    def fertility(self, tokens):\n        w = float(tokens[0]);\
  \ t = float(tokens[1])\n        if w == 0:\n            return '0.0 0.0'\n        f = t / w\n      \
  \  return str(round(f, 3)) + ' ' + str(round((f - 1) * 100, 1))\n"
