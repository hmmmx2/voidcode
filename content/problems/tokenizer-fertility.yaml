slug: tokenizer-fertility
title: Tokens per word, and why cost is not counted in words
difficulty: easy
categories:
- LLM
concepts:
- tokenization
description: 'Input: `n_words n_tokens`.


  Fertility is tokens divided by words. Return it rounded to 3 decimal places, then the percentage overhead
  against a hypothetical one-token-per-word tokenizer, rounded to 1 decimal place, as `fertility overhead_pct`.


  Fertility varies sharply by language and domain: code, non-Latin scripts and rare proper nouns all fragment
  more. Since context limits and cost are denominated in TOKENS, a budget estimated in words is wrong
  by exactly this factor.


  Return `0.0 0.0` when `n_words` is 0.'
order_index: 54
