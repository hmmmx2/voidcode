abstract: 'Attention was thought to be compute-bound and quadratic in memory. This paper shows it is neither:
  the bottleneck is reading and writing the n-by-n score matrix to HBM, and tiling the computation so
  that matrix never materialises makes attention linear in memory and several times faster — while computing
  exactly the same function. Not an approximation. Long context became practical because of this.'
