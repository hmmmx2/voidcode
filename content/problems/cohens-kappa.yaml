slug: cohens-kappa
title: Agreement above chance, for rubric graders
difficulty: hard
categories:
- ML
concepts:
- classification_metrics
- probability_expectation
description: "Input: `a b c d`, the four cells of a 2x2 agreement table between two graders: both yes,\
  \ A-yes-B-no, A-no-B-yes, both no.\n\nReturn Cohen's kappa rounded to 4 decimal places.\n\n    p_o =\
  \ (a + d) / n\n    p_e = ((a+b)(a+c) + (c+d)(b+d)) / n^2\n    kappa = (p_o - p_e) / (1 - p_e)\n\nRaw\
  \ agreement is misleading when one label dominates: two graders who both say \"pass\" 95% of the time\
  \ agree 90% of the time by chance alone. Return `1.0` when `p_e` is exactly 1, which happens when both\
  \ graders used only one label and agreed completely — there is no disagreement possible to measure."
order_index: 73
