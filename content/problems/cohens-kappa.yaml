    '
reference_solution: "class Solution(object):\n    def kappa(self, tokens):\n        a, b, c, d = (int(x)\
  \ for x in tokens[:4])\n        n = a + b + c + d\n        if n == 0:\n            return 0.0\n    \
  \    po = (a + d) / n\n        pe = ((a + b) * (a + c) + (c + d) * (b + d)) / (n * n)\n        if pe\
  \ == 1:\n            return 1.0\n        return round((po - pe) / (1 - pe), 4)\n"
