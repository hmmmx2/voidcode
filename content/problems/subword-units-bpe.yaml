abstract: Translation systems had a fixed vocabulary and replaced everything outside it with a single
  UNK token, which meant rare and unseen words were simply lost. This paper borrows a 1994 data-compression
  algorithm, byte-pair encoding, and repurposes it to build a subword vocabulary — so any word can be
  spelled out of pieces the model already knows. Every modern tokeniser is a descendant.
