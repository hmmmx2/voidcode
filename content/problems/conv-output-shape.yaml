slug: conv-output-shape
title: What shape comes out of this convolution?
difficulty: medium
categories:
- DL
concepts:
- convolutions
- tensors_and_shapes
description: "Return the output spatial size of a convolution.\n\nWrite `conv_out(in_size, kernel, stride,\
  \ padding, dilation)`:\n\n    effective_kernel = dilation * (kernel - 1) + 1\n    out = floor((in_size\
  \ + 2*padding - effective_kernel) / stride) + 1\n\nReturn 0 if the result would be negative.\n\n**Why\
  \ dilation enters as `d*(k-1)+1` and not `d*k`.** A dilated kernel inserts `d-1` gaps *between*\ntaps,\
  \ not after the last one — a 3-tap kernel at dilation 2 spans positions 0, 2, 4, which is 5,\nnot 6.\
  \ Getting this wrong is off-by-one in a direction that only shows up at the edges, so the\nmodel trains\
  \ and the last row of every feature map is quietly wrong.\n\n**Why the floor is the part that bites.**\
  \ With stride > 1 the division discards a remainder, which\nmeans input pixels at the end are silently\
  \ ignored — a stride-2 conv over 7 pixels with kernel 1\nreads positions 0, 2, 4, 6 and a stride-2 over\
  \ 8 also produces 4 outputs, reading 0, 2, 4, 6 and\ndropping the last. Two different inputs, same output\
  \ shape, one of them losing data. This is why\n'same' padding is defined in terms of the output size\
  \ rather than a padding amount: the padding\nneeded depends on the remainder."
