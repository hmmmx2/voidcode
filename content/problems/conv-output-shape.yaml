reference_solution: "class Solution(object):\n    def conv_out(self, in_size, kernel, stride, padding,\
  \ dilation):\n        eff = dilation * (kernel - 1) + 1\n        out = (in_size + 2 * padding - eff)\
  \ // stride + 1\n        return max(out, 0)\n"
