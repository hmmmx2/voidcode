reference_solution: "class Solution(object):\n    def speedup(self, tokens):\n        f = float(tokens[0]);\
  \ i = float(tokens[1])\n        by = float(tokens[2]); bw = float(tokens[3])\n        if f <= 0 or by\
  \ <= 0 or bw <= 0:\n            return '0.0 0.0 0.0'\n        comp = i / f\n        mem = 2.0\n    \
  \    return ' '.join([str(round(comp, 2)), str(round(mem, 2)),\n                         str(round(min(comp,\
  \ mem), 2))])\n"
