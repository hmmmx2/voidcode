slug: int8-vs-fp16-speedup
title: What int8 buys, and what it does not
difficulty: medium
categories:
- CUDA
concepts:
- quantization_basics
- roofline_analysis
description: 'Input: `fp16_tops int8_tops bytes_moved_fp16 bandwidth_gbs`.


  Return the compute speedup, the memory-time ratio, and the achievable overall speedup as the MINIMUM
  of the two, as `compute_x memory_x overall_x`, each rounded to 2 decimal places.


  int8 halves the bytes moved relative to fp16, so the memory term is always exactly 2.00. The compute
  term is whatever the hardware offers, commonly 2x.


  Taking the minimum is the point: a kernel that is memory-bound gains nothing from faster int8 arithmetic,
  and quoting the compute ratio as the expected speedup is how int8 gets oversold. Return zeros for non-positive
  inputs.'
order_index: 86
