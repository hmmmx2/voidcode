- memory_accounting
description: 'Input: `n_params_billions`.


  Standard mixed-precision Adam holds: bf16 weights (2 bytes), an fp32 master copy (4), bf16 gradients
  (2), and two fp32 optimizer moments (4 each). Return the total in GB rounded to 2 decimal places, then
  each component in the same order, space separated: `total weights master grads m1 m2`.


  Use 1 GB = 1e9 bytes. The headline number is 16 bytes per parameter, and the point of breaking it out
  is that the OPTIMIZER holds more than the model does — which is why ZeRO shards optimizer state first.'
order_index: 61
