- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def memory(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().memory(_p))

    '
reference_solution: "class Solution(object):\n    def memory(self, tokens):\n        n = float(tokens[0])\
  \ * 1e9\n        parts = [2, 4, 2, 4, 4]\n        gb = [p * n / 1e9 for p in parts]\n        total =\
  \ sum(gb)\n        return ' '.join([str(round(total, 2))] + [str(round(x, 2)) for x in gb])\n"
