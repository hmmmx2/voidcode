slug: iq-occupancy-from-resources
title: Compute occupancy from the binding resource
difficulty: medium
categories:
- CUDA
concepts:
- occupancy
description: "Implement:\n\n```python\nclass Solution(object):\n    def occupancy(self, threads_per_block,\
  \ regs_per_thread, smem_per_block,\n                  max_threads_per_sm, max_blocks_per_sm, regs_per_sm,\
  \ smem_per_sm):\n        ...\n```\n\nWork out how many blocks are simultaneously resident on one SM.\
  \ Each resource imposes its own ceiling:\n\n```\nby registers  : regs_per_sm // (threads_per_block *\
  \ regs_per_thread)\nby shared mem : smem_per_sm // smem_per_block\nby threads    : max_threads_per_sm\
  \ // threads_per_block\nby hard cap   : max_blocks_per_sm\n```\n\n`blocks` is the minimum over every\
  \ applicable ceiling, using floor division throughout. If `smem_per_block` is 0 the kernel allocates\
  \ no shared memory and that ceiling does not apply -- skip it rather than dividing by zero.\n\nReturn\
  \ `[blocks, active_warps, occupancy]` where\n\n```\nactive_warps = blocks * (threads_per_block // 32)\n\
  occupancy    = active_warps / (max_threads_per_sm // 32)\n```\n\n`blocks` and `active_warps` are integers;\
  \ `occupancy` is a float rounded to 6 decimal places. `threads_per_block` is always a multiple of 32.\n\
  \n**A block that does not fit means zero.** If one block alone needs more registers or more shared memory\
  \ than the SM has, that ceiling is 0, so `blocks` is 0 and occupancy is 0.0 -- the launch would fail.\
  \ Do not clamp it up to 1.\n\nThe point of computing all four is that you learn *which* resource binds,\
  \ which is the only thing that tells you what to change. Halving the shared memory of a shared-memory-bound\
  \ kernel does not double occupancy; it just hands the limit to whichever resource was next in line.\n\
  \nStandard library only -- no numpy, no torch."
inferred_concepts: true
review_needed: true
order_index: 33
examples:
- input: threads_per_block = 256, regs_per_thread = 64, smem_per_block = 32768, max_threads_per_sm = 2048,
    max_blocks_per_sm = 32, regs_per_sm = 65536, smem_per_sm = 102400
  output: '[3, 24, 0.375]'
  explanation: 'Registers allow 4 blocks, threads allow 8, the cap allows 32, but 100 KiB of shared memory
    over 32 KiB per block allows only 3. Three blocks of 8 warps is 24 of the 64 warp slots: 37.5%.'
- input: same SM, but smem_per_block = 16384
  output: '[4, 32, 0.5]'
  explanation: Shared memory now allows 6 blocks, so registers become the binding resource at 4. Halving
    shared memory raised occupancy from 37.5% to 50%, not to 75% -- the limit moved rather than disappearing.
constraints:
- threads_per_block is a positive multiple of 32, up to 1024
- regs_per_thread >= 1
- smem_per_block >= 0 (0 means no shared memory ceiling applies)
- max_blocks_per_sm >= 1
- max_threads_per_sm is a multiple of 32
- Use floor division for every ceiling; blocks may be 0.
- Round occupancy to 6 decimal places.
- Standard library only -- no numpy, no torch.
