reference_solution: "class Solution(object):\n    def occupancy(self, threads_per_block, regs_per_thread,\
  \ smem_per_block,\n                  max_threads_per_sm, max_blocks_per_sm, regs_per_sm, smem_per_sm):\n\
  \        limits = [max_blocks_per_sm, max_threads_per_sm // threads_per_block]\n        regs_per_block\
  \ = threads_per_block * regs_per_thread\n        if regs_per_block > 0:\n            limits.append(regs_per_sm\
  \ // regs_per_block)\n        if smem_per_block > 0:\n            limits.append(smem_per_sm // smem_per_block)\n\
  \        blocks = min(limits)\n        if blocks < 0:\n            blocks = 0\n        warps_per_block\
  \ = threads_per_block // 32\n        active_warps = blocks * warps_per_block\n        max_warps = max_threads_per_sm\
  \ // 32\n        return [blocks, active_warps, float(active_warps) / float(max_warps)]\n"
