slug: optimizer-moment-dtype-trap
title: Why did the bf16 run use less memory than it should have?
difficulty: hard
categories:
- Systems
concepts:
- mixed_precision
- memory_accounting
description: "A parallelism benchmark reports peak memory per device for five strategies. Two of them\
  \ were run\nwith the model in BF16 and `torch.optim.AdamW`; the other three used FP32 master weights\
  \ with\nBF16 compute. The BF16-native rows used dramatically less memory and the table concluded that\n\
  their parallelism strategy was more efficient.\n\n**The conclusion was wrong, and the ranking reversed\
  \ once it was fixed.**\n\nWrite `moment_bytes(param_dtype, optimizer)` returning the bytes per parameter\
  \ of *optimizer\nstate* that PyTorch will actually allocate.\n\n- `torch.optim.AdamW` allocates `exp_avg`\
  \ and `exp_avg_sq` **in the parameter's dtype**. A BF16\n  model therefore gets BF16 moments — 4 bytes/param,\
  \ not the 8 an FP32 assumption predicts.\n- `Adafactor` factors the second moment and keeps it in FP32\
  \ regardless of parameter dtype.\n\n`param_dtype` is `\"bf16\"`, `\"fp16\"` or `\"fp32\"`; `optimizer`\
  \ is `\"adamw\"` or `\"adafactor\"`.\n\n**Why this matters more than a memory number.** If one arm of\
  \ a comparison silently holds its\nmoments at half precision, the table is measuring *precision*, not\
  \ parallelism — and it will\nrank the numerically weaker configuration first. The fix is to record the\
  \ moment dtype alongside\nevery row so a reader can see the comparison is like-for-like, rather than\
  \ taking it on trust.\n"
