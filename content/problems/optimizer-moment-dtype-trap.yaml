reference_solution: "class Solution(object):\n    WIDTH = {\"bf16\": 2, \"fp16\": 2, \"fp32\": 4}\n\n\
  \    def moment_bytes(self, param_dtype, optimizer):\n        if optimizer == \"adafactor\":\n     \
  \       return 4\n        return 2 * self.WIDTH[param_dtype]\n"
