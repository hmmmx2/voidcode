reference_solution: "import math\n\nclass Solution(object):\n    def n(self, tokens):\n        p0 = float(tokens[0]);\
  \ mde = float(tokens[1])\n        p1 = p0 + mde\n        if mde <= 0 or p1 <= 0 or p1 >= 1 or p0 <=\
  \ 0 or p0 >= 1:\n            return '-1 -1'\n        za, zb = 1.96, 0.8416\n        var = p0 * (1 -\
  \ p0) + p1 * (1 - p1)\n        per = math.ceil((za + zb) ** 2 * var / (mde ** 2))\n        return str(per)\
  \ + ' ' + str(per * 2)\n"
