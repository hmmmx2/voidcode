slug: sample-size-for-proportion
title: How many learners to detect the effect you care about
difficulty: hard
categories:
- ML
concepts:
- probability_expectation
description: "Input: `baseline mde` for 80% power at alpha 0.05, using z_alpha/2 = 1.96 and z_beta = 0.8416.\n\
  \n    n_per_arm = ceil( (z_a + z_b)^2 * (p0(1-p0) + p1(1-p1)) / mde^2 )\n\nwhere `p1 = baseline + mde`.\
  \ Return `n_per_arm total` for two arms.\n\n`mde` is ABSOLUTE: 0.05 on a baseline of 0.30 means detecting\
  \ 0.35. Absolute and relative effects are confused constantly and differ by a factor of several in n.\
  \ Return `-1 -1` when `p1` falls outside (0,1) or `mde <= 0`.\n\nThe number this produces is usually\
  \ the answer to \"can we run this experiment at all\"."
order_index: 74
