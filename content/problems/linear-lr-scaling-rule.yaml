reference_solution: "class Solution(object):\n    def scale(self, tokens):\n        lr = float(tokens[0]);\
  \ b0 = float(tokens[1])\n        b1 = float(tokens[2]); we = float(tokens[3])\n        if b0 == 0:\n\
  \            return '0.0 0'\n        factor = b1 / b0\n        need = 1 if (factor > 2 and we == 0)\
  \ else 0\n        return str(round(lr * factor, 6)) + ' ' + str(need)\n"
