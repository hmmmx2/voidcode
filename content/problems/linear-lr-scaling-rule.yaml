slug: linear-lr-scaling-rule
title: Scale the learning rate with the batch size
difficulty: medium
categories:
- DL
concepts:
- lr_scheduling
- optimizers_sgd
description: 'Input: `base_lr base_batch new_batch warmup_epochs`.


  The linear scaling rule multiplies the learning rate by the same factor as the batch size: `new_lr =
  base_lr * new_batch / base_batch`. Return `new_lr needs_warmup`, with the rate rounded to 6 decimal
  places and `needs_warmup` as `1` or `0`.


  Warmup is needed when the scaling factor exceeds 2 — the regime where the rule starts to break because
  early updates are large relative to how well the gradient is estimated. Report `0` for warmup when `warmup_epochs`
  is already greater than 0, since it is then already handled.


  The rule is an empirical finding with a known breakdown at very large batches, not a law.'
