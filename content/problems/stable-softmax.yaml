  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    logits = json.loads(_in[0])

    print([round(v, 6) for v in Solution().softmax(logits)])

    '
source_kind: problem
reference_solution: "import math\nclass Solution(object):\n    def softmax(self, logits):\n        m =\
  \ max(logits)\n        exps = [math.exp(v - m) for v in logits]\n        total = sum(exps)\n       \
  \ return [e / total for e in exps]\n"
