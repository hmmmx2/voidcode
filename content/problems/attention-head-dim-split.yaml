- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def split(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().split(_p))

    '
reference_solution: "class Solution(object):\n    def split(self, tokens):\n        d = int(tokens[0]);\
  \ h = int(tokens[1])\n        if d <= 0 or h <= 0 or d % h != 0:\n            return '-1 -1'\n     \
  \   return str(d // h) + ' ' + str(3 * d * d)\n"
