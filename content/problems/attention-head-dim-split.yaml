slug: attention-head-dim-split
title: Split d_model across heads, and reject what will not divide
difficulty: easy
categories:
- LLM
concepts:
- multi_head_attention
description: 'Input: `d_model n_heads`.


  Return `head_dim total_qkv_params` where `head_dim = d_model / n_heads` and the QKV projections cost
  `3 * d_model * d_model` parameters (biases ignored).


  Return `-1 -1` when `n_heads` does not divide `d_model` exactly, or when either is non-positive. That
  case is worth failing loudly on: a silently floored head dimension leaves part of the residual stream
  unattended, and the model still trains — just worse, for a reason nothing reports.'
order_index: 58
