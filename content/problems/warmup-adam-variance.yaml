description: Write a function returning how many gradient samples Adam's bias-corrected second moment
  effectively averages at step t, the weight it puts on the newest gradient, and the resulting relative
  spread of the estimate. The trap is that bias correction fixes the mean and does nothing to the variance,
  which is what actually forces warmup.
