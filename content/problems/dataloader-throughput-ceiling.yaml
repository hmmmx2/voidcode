    \ num_workers):\n        \"\"\"\n        :rtype: bool\n        \"\"\"\n"
  driver_code: 'import sys

    _p = [float(x) for x in sys.stdin.read().split()]

    print(Solution().is_input_bound(_p[0], _p[1], _p[2], _p[3]))

    '
reference_solution: "class Solution(object):\n    def is_input_bound(self, gpu_step_ms, batch_size, per_sample_ms,\
  \ num_workers):\n        loader_ms = (batch_size * per_sample_ms) / max(num_workers, 1)\n        return\
  \ loader_ms > gpu_step_ms\n"
