slug: dataloader-throughput-ceiling
title: Is your dataloader starving the GPU?
difficulty: medium
categories:
- DL
concepts:
- dataloading
- vectorization
description: 'Return whether the dataloader is the bottleneck.


  Write `is_input_bound(gpu_step_ms, batch_size, per_sample_ms, num_workers)`. The loader produces a

  batch in `batch_size * per_sample_ms / num_workers` milliseconds, assuming workers scale linearly.

  Return `True` if that exceeds the GPU step time.


  **Why this is worth computing rather than eyeballing a utilisation graph.** An input-bound run

  looks exactly like a slow model: the step time is high, the loss curve is fine, and `nvidia-smi`

  shows low utilisation — which people read as "the model is small" rather than "the GPU is waiting".

  Buying a faster card changes nothing, because the card was never the constraint.


  **Where the linear-workers assumption breaks, and it breaks in both directions.** Workers are

  separate processes, so each carries a copy of the dataset object and its own CUDA context if it

  touches the GPU; past a point they contend for CPU and memory bandwidth and the speedup flattens.

  But prefetching hides latency the model above does not account for — a loader that produces a batch

  in exactly one step time is not actually starving the GPU if it produced the next one while the

  current step ran. Treat this as a screening test that says "look here", not a verdict.'
