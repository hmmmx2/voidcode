description: 'Write `rope_dot(q, k, m, n, base)`: apply rotary position embedding to `q` at position `m`
  and to `k` at position `n`, then return their dot product. The trap is the pairing and the frequency
  schedule -- get either wrong and the result stops depending only on `m - n`, which the hidden cases
  check by shifting both positions by the same amount.'
