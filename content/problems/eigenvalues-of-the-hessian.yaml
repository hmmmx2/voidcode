description: Write `gd_analysis(eigs, eta, eps)` for gradient descent on a quadratic whose Hessian has
  the given eigenvalues. Return the worst-case contraction per step at the supplied `eta`, the step size
  at which convergence fails, the optimal step size, and how many optimal steps reach error `eps`. The
  trap is that the sharpest direction sets the ceiling while the flattest sets the rate, so one bound
  is a max and the other is a min, and equal eigenvalues make the step count a special case.
