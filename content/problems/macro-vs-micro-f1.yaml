slug: macro-vs-micro-f1
title: Macro and micro F1 disagree. Say which and why.
difficulty: hard
categories:
- ML
concepts:
- classification_metrics
description: 'Input: `n_classes`, then `tp fp fn` for each class.


  Micro-F1 pools the counts across classes and computes one F1. Macro-F1 computes F1 per class and takes
  an unweighted mean. Return `micro macro` each rounded to 4 decimal places.


  They diverge under class imbalance, and the direction tells you something: macro below micro means the
  rare classes are being handled worse than the common ones, which pooling hides. A class with `tp = 0`
  contributes an F1 of 0 to the macro mean — it is not skipped, because ignoring the classes you fail
  on is how a model looks good at them.'
order_index: 65
