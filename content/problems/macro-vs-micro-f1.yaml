    '
reference_solution: "class Solution(object):\n    def f1s(self, tokens):\n        n = int(tokens[0])\n\
  \        v = [int(x) for x in tokens[1:1 + 3 * n]]\n        def f1(tp, fp, fn):\n            if tp ==\
  \ 0:\n                return 0.0\n            p = tp / (tp + fp); r = tp / (tp + fn)\n            return\
  \ 0.0 if p + r == 0 else 2 * p * r / (p + r)\n        TP = sum(v[3 * i] for i in range(n))\n       \
  \ FP = sum(v[3 * i + 1] for i in range(n))\n        FN = sum(v[3 * i + 2] for i in range(n))\n     \
  \   micro = f1(TP, FP, FN)\n        macro = sum(f1(v[3 * i], v[3 * i + 1], v[3 * i + 2])\n         \
  \           for i in range(n)) / n if n else 0.0\n        return str(round(micro, 4)) + ' ' + str(round(macro,\
  \ 4))\n"
