reference_solution: "class Solution(object):\n    def kv_bytes(self, layers, seq_len, n_heads, n_kv_heads,\
  \ head_dim, dtype_bytes):\n        return 2 * layers * seq_len * n_kv_heads * head_dim * dtype_bytes\n"
