slug: kv-cache-vs-gqa-memory
title: How much KV cache does GQA actually save?
difficulty: medium
categories:
- LLM
concepts:
- attention_variants
- kv_cache
description: "Return the KV cache size in bytes for one sequence.\n\nWrite `kv_bytes(layers, seq_len,\
  \ n_heads, n_kv_heads, head_dim, dtype_bytes)`.\n\nThe cache holds K and V per layer, for every position\
  \ so far. Its size is\n\n    2 * layers * seq_len * n_kv_heads * head_dim * dtype_bytes\n\n**Note what\
  \ is absent: `n_heads`.** It is given, and it is a distractor. The cache scales with\nthe number of\
  \ *key/value* heads, not query heads — which is the entire point of grouped-query\nattention. Qwen2.5-7B\
  \ has 28 query heads and 4 KV heads, so its cache is **7x smaller** than\nmulti-head attention would\
  \ give, at the same quality for most tasks.\n\n**Why this is the number that decides your serving batch\
  \ size.** At 32k context the cache dwarfs\nthe weights: a 7B in bf16 is ~15 GB of parameters, and one\
  \ 32k sequence at 28 layers, 4 KV heads\nand head_dim 128 is another ~1.8 GB — so forty concurrent sequences\
  \ cost more than the model does.\nThat is why PagedAttention exists, and why \"how many users fit on\
  \ this card\" is a KV-cache question\nrather than a parameter-count one."
