reference_solution: "import math\n\nclass Solution(object):\n    def classify(self, tokens):\n       \
  \ d = int(tokens[0]); n = int(tokens[1])\n        vals = [float(x) for x in tokens[2:]]\n        img\
  \ = vals[:d]\n        def cos(a, b):\n            na = math.sqrt(sum(x * x for x in a))\n          \
  \  nb = math.sqrt(sum(x * x for x in b))\n            if na == 0 or nb == 0:\n                return\
  \ 0.0\n            return sum(x * y for x, y in zip(a, b)) / (na * nb)\n        best_i = 0; best_s =\
  \ None\n        for c in range(n):\n            txt = vals[d + c * d: d + (c + 1) * d]\n           \
  \ s = cos(img, txt)\n            if best_s is None or s > best_s:\n                best_s = s; best_i\
  \ = c\n        return str(best_i) + ' ' + str(round(best_s, 4))\n"
