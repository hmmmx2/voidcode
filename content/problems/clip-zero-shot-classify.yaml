- projection_layers
description: 'Input: `d n_classes`, then the `d` components of the image embedding, then `n_classes` text
  embeddings of `d` components each.


  Return the 0-based index of the class with the highest COSINE similarity, and that similarity rounded
  to 4 decimal places, as `index similarity`. On a tie return the lowest index.


  Cosine, not dot product. CLIP''s training objective normalises both embeddings, so an unnormalised dot
  product ranks by vector magnitude as well as direction — and magnitude carries no class information.
  A zero-norm vector scores 0 against everything.'
