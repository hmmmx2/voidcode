grading: rubric
description: 'Describe how you would attach a pretrained vision encoder to a pretrained language model,
  and

  justify each decision.


  Cover: what the projection layer is and why it is needed at all; what is frozen and what trains,

  in what order; how image tokens enter the sequence; and what happens to the KV cache and the

  context budget once they do.


  **Why this is rubric-graded.** There is no single correct architecture. LLaVA''s two-layer MLP,

  Flamingo''s cross-attention resampler and Qwen-VL''s learned queries are all defensible, and they

  trade differently. An answer is judged on whether the reasoning holds together, not on matching

  one of them.


  **The detail most answers miss.** Image tokens are *expensive in context*. A 336x336 image at

  patch 14 is 576 tokens before any text — so a page of screenshots can consume more context than

  the conversation, and every one of those tokens also occupies KV cache for the rest of the

  session. That is the constraint driving resamplers and learned queries: they exist to compress

  576 patch embeddings into 32 or 64 tokens, and the quality cost of that compression is the real

  design question.


  **The detail with a security consequence.** An image is the largest prompt-injection surface a

  tutor has. Text a learner types is visible to them; an instruction painted in pale grey on a

  screenshot is not, and a model that reads it will follow it. Any answer that treats image content

  as trusted input is incomplete regardless of how good the architecture is.'
hints:
- Start from why the embedding spaces do not already match — the encoder was trained against a different
  objective.
- 'Freezing order matters: what breaks if you unfreeze the language model first?'
- Count the tokens. 336x336 at patch 14 is 576 before any text.
