rubric:
- criterion: Explains the projection as a learned map between two independently-trained embedding spaces,
    not merely as a shape fix.
  weight: 0.2
- criterion: 'Staged training: projection first with both towers frozen, then selective unfreezing, with
    a reason — typically that an untrained projection sends noise into a working language model and damages
    it.'
  weight: 0.2
- criterion: 'Token budget: quantifies image tokens and connects them to context length and KV cache growth,
    rather than treating images as free.'
  weight: 0.25
- criterion: Names a compression strategy (resampler, learned queries, pooling) and states what is lost,
    rather than presenting it as free.
  weight: 0.2
- criterion: Treats image-derived content as untrusted input, with a concrete mitigation.
  weight: 0.15
