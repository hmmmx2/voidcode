slug: f-beta-score
title: F-beta, and which error it forgives
difficulty: medium
categories:
- ML
concepts:
- classification_metrics
description: "Input: `beta tp fp fn`.\n\n    precision = tp / (tp + fp)\n    recall    = tp / (tp + fn)\n\
  \    F_beta    = (1 + beta^2) * P * R / (beta^2 * P + R)\n\nReturn F_beta rounded to 4 decimal places,\
  \ and `0.0` whenever the denominator is 0 or `tp` is 0 — a classifier that found nothing has no F score,\
  \ and returning 0 is more honest than a division error.\n\n`beta > 1` weights recall, `beta < 1` weights\
  \ precision. For a tutor that flags a learner's bug, decide which you would rather have before you pick\
  \ beta."
order_index: 51
