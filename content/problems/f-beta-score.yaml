reference_solution: "class Solution(object):\n    def fbeta(self, tokens):\n        b = float(tokens[0]);\
  \ tp = int(tokens[1])\n        fp = int(tokens[2]); fn = int(tokens[3])\n        if tp == 0:\n     \
  \       return 0.0\n        p = tp / (tp + fp)\n        r = tp / (tp + fn)\n        denom = b * b *\
  \ p + r\n        if denom == 0:\n            return 0.0\n        return round((1 + b * b) * p * r /\
  \ denom, 4)\n"
