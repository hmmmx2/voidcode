slug: iq-kl-divergence-asymmetry
title: Compute both directions of KL with the zero cases right
difficulty: medium
categories:
- ML
- LLM
concepts:
- loss_functions
description: '`p` and `q` are lists of the same length, each summing to 1, with non-negative entries.
  Return `[forward, reverse]` where


  ```

  forward = KL(p || q) = sum_i p_i * ln(p_i / q_i)

  reverse = KL(q || p) = sum_i q_i * ln(q_i / p_i)

  ```


  using the natural logarithm (nats).


  **The zero conventions are the whole question.** For a general `KL(a || b)`, where `a` is the distribution
  supplying the weight:


  - `a_i == 0` contributes exactly 0, whatever `b_i` is — `0 * ln 0 = 0` in the limit. So `a_i == 0, b_i
  > 0` is free, and `a_i == 0, b_i == 0` is free too.

  - `a_i > 0` with `b_i == 0` sends the whole sum to `+inf`.


  Return `float("inf")` for a divergent direction; the driver prints it as `inf`. The two directions are
  computed independently, so one may be finite while the other is infinite — that asymmetry is the point,
  and it is why one direction refuses to let the model drop a mode while the other charges nothing for
  it.


  Round finite values to 6 decimal places.


  Standard library only -- no numpy, no scipy.'
inferred_concepts: true
review_needed: true
order_index: 16
examples:
- input: p = [1.0, 0.0], q = [0.5, 0.5]
  output: '[0.693147, inf]'
  explanation: 'Forward: only index 0 carries weight, giving 1*ln(1/0.5) = ln 2; index 1 has p_i = 0 so
    it contributes nothing. Reverse: q puts weight 0.5 on an outcome p rules out, so that term is +inf.
    Spreading q over p''s support is cheap; leaving q''s support uncovered is not.'
- input: p = [0.9, 0.1], q = [0.5, 0.5]
  output: '[0.368064, 0.510826]'
  explanation: Both directions are finite and unequal. KL is not symmetric and is not a distance.
- input: p = [0.6, 0.4, 0.0], q = [0.5, 0.5, 0.0]
  output: '[0.020136, 0.020411]'
  explanation: A zero at the same index in both distributions is free in both directions. Returning inf
    whenever any entry is zero fails here.
constraints:
- 1 <= len(p) == len(q) <= 10^4
- p and q each sum to 1 with non-negative entries.
- Use the natural logarithm.
- Return float("inf") for a divergent direction.
- Round finite values to 6 decimal places.
- Standard library only -- no numpy, no scipy.
