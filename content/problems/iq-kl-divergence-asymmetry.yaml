code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "import math\n\nclass Solution(object):\n    def kl_pair(self, p, q):\n        \"\"\"\
    \n        :type p: List[float]\n        :type q: List[float]\n        :rtype: List[float]  -- [KL(p||q),\
    \ KL(q||p)], inf where divergent\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    p = json.loads(_in[0])

    q = json.loads(_in[1])

    _r = Solution().kl_pair(p, q)

    print([round(float(x), 6) + 0.0 for x in _r])

    '
source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def kl_pair(self, p, q):\n        return\
  \ [self._kl(p, q), self._kl(q, p)]\n\n    def _kl(self, a, b):\n        total = 0.0\n        for ai,\
  \ bi in zip(a, b):\n            if ai == 0.0:\n                continue\n            if bi == 0.0:\n\
  \                return float(\"inf\")\n            total += ai * math.log(ai / bi)\n        return\
  \ total\n"
