slug: iq-arithmetic-intensity-roofline
title: Place a kernel on the roofline
difficulty: medium
categories:
- CUDA
concepts:
- roofline_analysis
description: "Implement:\n\n```python\nclass Solution(object):\n    def roofline(self, flops, bytes_moved,\
  \ peak_flops, peak_bw):\n        ...\n```\n\n`flops` is the arithmetic the kernel performs, `bytes_moved`\
  \ is the traffic it moves to and from HBM, `peak_flops` is the device's peak arithmetic throughput in\
  \ FLOP/s, and `peak_bw` is its peak memory bandwidth in bytes/s.\n\nReturn `[intensity, utilization,\
  \ bound]`:\n\n- `intensity = flops / bytes_moved`, in FLOP per byte.\n- `ridge = peak_flops / peak_bw`\
  \ -- the intensity at which the two roofs meet.\n- `attainable = min(peak_flops, peak_bw * intensity)`\
  \ -- the sloped bandwidth roof below the ridge, the flat compute roof above it.\n- `utilization = attainable\
  \ / peak_flops`, a value in `(0, 1]`.\n- `bound` is the string `\"memory\"` when `intensity < ridge`,\
  \ and `\"compute\"` otherwise. **Exactly at the ridge point, return `\"compute\"`.**\n\nRound `intensity`\
  \ and `utilization` to 6 decimal places. `bound` is a plain string.\n\n**The clamp is the question.**\
  \ Drop the `min` and a kernel sitting far above the ridge reports a utilization above 1.0, because nothing\
  \ stops `peak_bw * intensity` from exceeding the number of arithmetic units the chip has. Classification\
  \ is the other half: it tells you whether shaving bytes or shaving instructions is the only lever worth\
  \ pulling.\n\nStandard library only -- no numpy, no torch."
inferred_concepts: true
review_needed: true
order_index: 30
examples:
- input: flops = 137438953472, bytes_moved = 100663296, peak_flops = 312e12, peak_bw = 1.55e12
  output: '[1365.333333, 1.0, "compute"]'
  explanation: A 4096-cubed matmul in bf16 does 2N^3 FLOPs and moves 3N^2 * 2 bytes, so intensity is N/3
    = 1365.33 FLOP/byte against a ridge of 312/1.55 = 201.29. Far above it, so the compute roof binds
    and utilization clamps to 1.0.
- input: flops = 1000000, bytes_moved = 12000000, peak_flops = 312e12, peak_bw = 1.55e12
  output: '[0.083333, 0.000414, "memory"]'
  explanation: 'An fp32 element-wise add reads two words and writes one for every single FLOP: 12 bytes
    each. At 1/12 FLOP/byte the kernel reaches four ten-thousandths of peak arithmetic, so making the
    arithmetic faster buys nothing and only moving fewer bytes helps.'
constraints:
- flops >= 1 and bytes_moved >= 1
- peak_flops > 0 and peak_bw > 0
- Inputs may arrive in scientific notation (e.g. 312e12).
- Exactly at the ridge point the answer is "compute".
- utilization is clamped at 1.0.
- Round intensity and utilization to 6 decimal places.
- Standard library only -- no numpy, no torch.
