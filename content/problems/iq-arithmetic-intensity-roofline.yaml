source_kind: interview_problem
reference_solution: "class Solution(object):\n    def roofline(self, flops, bytes_moved, peak_flops, peak_bw):\n\
  \        intensity = float(flops) / float(bytes_moved)\n        ridge = float(peak_flops) / float(peak_bw)\n\
  \        attainable = min(float(peak_flops), float(peak_bw) * intensity)\n        utilization = attainable\
  \ / float(peak_flops)\n        bound = \"memory\" if intensity < ridge else \"compute\"\n        return\
  \ [intensity, utilization, bound]\n"
