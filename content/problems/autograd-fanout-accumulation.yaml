slug: autograd-fanout-accumulation
title: Backpropagate through a node used twice
difficulty: medium
categories:
- DL
concepts:
- autograd
- backpropagation
description: 'You are given a small computation graph as a list of nodes in topological order. Each node
  is either an input or an operation over earlier nodes. Return the gradient of the final node with respect
  to every input, in node order, each rounded to 4 decimal places.


  Supported ops: add(a, b), mul(a, b), square(a).


  The whole problem is what happens when a node feeds more than one consumer. Its gradient is the SUM
  of the contributions from every consumer — not the last one written, and not the first. A graph where
  nothing branches passes with the bug present, which is exactly why this survives in real code: it does
  not crash, it silently halves a gradient and the model trains slightly worse.'
