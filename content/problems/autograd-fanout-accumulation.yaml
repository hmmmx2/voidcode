hints:
- Run the graph forwards first and keep every intermediate value — the product rule needs the other operand's
  value, which only exists after the forward pass.
- Seed the last node's gradient to 1.0 and walk backwards. Every operation ADDS into its inputs' gradients;
  it never assigns.
- Check yourself on y = x + x. If you get 1 rather than 2 you are overwriting where you should accumulate,
  and no graph without branching will ever show it.
