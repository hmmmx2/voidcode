    '
reference_solution: "class Solution(object):\n    def best(self, tokens):\n        alpha = float(tokens[0])\n\
  \        rest = tokens[1:]\n        best_i = 0; best_s = None\n        for i in range(len(rest) // 2):\n\
  \            lp = float(rest[2 * i]); ln = float(rest[2 * i + 1])\n            s = lp / (ln ** alpha)\
  \ if ln > 0 else lp\n            if best_s is None or s > best_s:\n                best_s = s; best_i\
  \ = i\n        return best_i\n"
