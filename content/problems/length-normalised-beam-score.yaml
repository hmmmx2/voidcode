slug: length-normalised-beam-score
title: Pick the best beam under length normalisation
difficulty: medium
categories:
- LLM
concepts:
- sampling_decoding
description: 'Input: `alpha`, then pairs of `cumulative_logprob length` for each candidate beam.


  Raw cumulative log-probability always favours SHORT sequences, because every extra token adds a negative
  number. Length normalisation divides by `length ** alpha` to compensate. Return the 0-based index of
  the highest-scoring beam; on a tie return the lowest index.


  With `alpha = 0` this reduces to raw log-probability, and comparing the two is the point: a decoder
  that truncates early is usually not badly trained, it is scoring without normalisation.'
order_index: 48
