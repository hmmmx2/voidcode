description: Write `streaming_lse(tiles)` that walks a list of score tiles in order carrying only a running
  maximum `m` and a running sum `s`, and returns `[m, s, m + log(s)]`. When a tile arrives holding a larger
  score than anything seen so far, `s` was accumulated against the old maximum and must be corrected by
  a single multiplicative factor before the new tile is folded in -- naming that factor is the question.
