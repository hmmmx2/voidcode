reference_solution: "class Solution(object):\n    def mfu(self, tokens):\n        n = float(tokens[0])\
  \ * 1e9\n        tps = float(tokens[1]); peak = float(tokens[2])\n        achieved = 6 * n * tps / 1e12\n\
  \        pct = 0.0 if peak <= 0 else round(achieved / peak * 100, 1)\n        return str(round(achieved,\
  \ 2)) + ' ' + str(pct)\n"
