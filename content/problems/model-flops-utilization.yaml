hints:
- 6 * N * tokens/sec, with N in raw parameters, gives FLOPs per second.
- Divide by 1e12 for TFLOPs before comparing to peak.
- Above 100% means a mistake -- usually counting 2N instead of 6N, or the wrong peak.
