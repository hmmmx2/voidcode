description: "Input: `n_params_billions tokens_per_sec peak_tflops`.\n\nTraining costs about `6N` FLOPs\
  \ per token. MFU is achieved FLOPs over the hardware's peak:\n\n    achieved = 6 * N * tokens_per_sec\n\
  \    MFU      = achieved / peak\n\nReturn `achieved_tflops mfu_pct`, rounded to 2 and 1 decimal places.\n\
  \nMFU is the honest efficiency number because it is denominated in USEFUL work: a kernel can saturate\
  \ the GPU doing padding or recomputation and still show low MFU. Well-tuned large-scale training reaches\
  \ 40-55%, so a figure above 100% means the arithmetic is wrong, not that you beat the hardware."
