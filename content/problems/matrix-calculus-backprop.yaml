description: Write `linear_backward(X, W, dY)` for `Y = X @ W + b`, with `X` of shape (N, D) and `W` of
  shape (D, M), returning `[dX, dW, db]`. Shape analysis pins both transposes down uniquely — but `db`
  accumulates over the batch as a sum rather than a mean, and `dW` needs the saved `X`, which is the reason
  every forward activation has to stay resident until its backward pass runs.
