slug: expected-calibration-error
title: Compute expected calibration error
difficulty: hard
categories:
- ML
concepts:
- classification_metrics
- probability_expectation
description: 'A model that says 70% should be right about 70% of the time. ECE measures how far it is
  from that.


  Input: `n`, then `n` pairs of `predicted outcome`, where predicted is in [0,1] and outcome is 0 or 1.


  Bucket the predictions into 10 equal-width bins over [0,1] — a prediction of exactly 1.0 belongs in
  the last bin. For each non-empty bin take `|mean(outcome) - mean(predicted)|`, weight it by the share
  of samples in that bin, and sum. Round to 4 decimal places.


  Equal-WIDTH bins, not equal-count. Equal-count bins hide the tails, and the tails are usually where
  a model is worst.'
order_index: 43
