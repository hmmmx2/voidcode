reference_solution: "class Solution(object):\n    def ece(self, tokens):\n        n = int(tokens[0])\n\
  \        vals = [float(x) for x in tokens[1:1 + 2 * n]]\n        pairs = [(vals[2 * i], vals[2 * i +\
  \ 1]) for i in range(n)]\n        if n == 0:\n            return 0.0\n        bins = {}\n        for\
  \ p, y in pairs:\n            b = min(int(p * 10), 9)\n            bins.setdefault(b, []).append((p,\
  \ y))\n        total = 0.0\n        for members in bins.values():\n            mp = sum(p for p, _ in\
  \ members) / len(members)\n            my = sum(y for _, y in members) / len(members)\n            total\
  \ += (len(members) / n) * abs(my - mp)\n        return round(total, 4)\n"
