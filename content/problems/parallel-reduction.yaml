slug: parallel-reduction
title: Parallel Reduction
difficulty: medium
categories:
- CUDA
- ML
concepts:
- reduction_kernels
description: 'Sum an array the way a GPU does.


  A CPU sums with a loop: `n` sequential additions. A GPU cannot -- thousands of threads must work at
  once -- so it uses a **tree reduction**. Every step, each thread in the lower half adds the element
  `stride` positions above it, then the active range halves. After about `log2(n)` steps the total sits
  at index 0.


  Return the state of the active range **after each step**, so the halving is visible.


  The interesting case is a length that is not a power of two. The stride rounds **up** (`(n + 1) // 2`),
  and a thread whose partner index `i + stride` falls past the end of the active range simply does nothing
  -- it must not read out of bounds, and it must not drop its own value.'
inferred_concepts: true
review_needed: true
order_index: 9
examples:
- input: data = [1, 2, 3, 4, 5, 6, 7, 8]
  output: '[[6, 8, 10, 12], [16, 20], [36]]'
  explanation: stride 4, then 2, then 1. Three steps for eight elements, and 36 is the total.
- input: data = [1, 2, 3, 4, 5]
  output: '[[5, 7, 3], [8, 7], [15]]'
  explanation: 'stride 3: index 2 has no partner at index 5, so its 3 is carried forward untouched.'
- input: data = [3, 1, 4, 1, 5, 9]
  output: '[[4, 6, 13], [17, 6], [23]]'
  explanation: stride 3 pairs (0,3), (1,4), (2,5); then stride 2 leaves index 1 unpaired.
constraints:
- 1 <= len(data) <= 4096
- -10^6 <= data[i] <= 10^6
- 'Each step halves the active range, rounding up: stride = (n + 1) // 2.'
- A thread whose partner index falls outside the active range does nothing.
- A single-element input needs no steps -- return an empty list.
- Standard library only -- no numpy, no torch.
hints:
- Work on a copy of the array and shrink an 'active range' n each step. Elements past n are spent -- they
  have already been added into the lower half.
- For a stride s, thread i adds arr[i + s] into arr[i], for i in range(s). Guard i + s against the CURRENT
  n, not the original length -- that guard is the whole non-power-of-two case.
- After the pass the new n is s, and the next stride is (s + 1) // 2. Stop once the stride reaches 1 and
  you have done that final pass. Append arr[:n] after each step.
