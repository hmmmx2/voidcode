source_kind: problem
reference_solution: "class Solution(object):\n    def reduce(self, data):\n        arr = list(data)\n\
  \        n = len(arr)\n        steps = []\n        stride = (n + 1) // 2\n        while stride >= 1\
  \ and n > 1:\n            for i in range(stride):\n                if i + stride < n:\n            \
  \        arr[i] += arr[i + stride]\n            n = stride\n            steps.append(arr[:n])\n    \
  \        if stride == 1:\n                break\n            stride = (stride + 1) // 2\n        return\
  \ steps\n"
