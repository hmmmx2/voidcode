slug: huber-loss
title: Huber loss and the point where it switches
difficulty: medium
categories:
- DL
concepts:
- loss_functions
description: "Input: `delta`, then pairs of `prediction target`.\n\nHuber loss is quadratic for small\
  \ errors and linear for large ones:\n\n    |e| <= delta   ->  0.5 * e^2\n    |e| >  delta   ->  delta\
  \ * (|e| - 0.5 * delta)\n\nReturn the MEAN over all pairs, rounded to 4 decimal places.\n\nThe second\
  \ branch is not an arbitrary formula — it is the line that makes the loss continuous AND differentiable\
  \ at `|e| = delta`. Substituting `|e| = delta` into both branches gives the same value, which is worth\
  \ checking as you write it."
order_index: 50
