reference_solution: "class Solution(object):\n    def huber(self, tokens):\n        d = float(tokens[0])\n\
  \        rest = [float(x) for x in tokens[1:]]\n        n = len(rest) // 2\n        if n == 0:\n   \
  \         return 0.0\n        total = 0.0\n        for i in range(n):\n            e = abs(rest[2 *\
  \ i] - rest[2 * i + 1])\n            total += 0.5 * e * e if e <= d else d * (e - 0.5 * d)\n       \
  \ return round(total / n, 4)\n"
