source_kind: interview_problem
reference_solution: "import math\n\n\nclass Solution(object):\n    def modality_gap(self, image_emb, text_emb):\n\
  \        def unit(v):\n            m = math.sqrt(sum(x * x for x in v))\n            if m == 0.0:\n\
  \                return [0.0] * len(v)\n            return [x / m for x in v]\n\n        I = [unit(v)\
  \ for v in image_emb]\n        T = [unit(v) for v in text_emb]\n        d = len(I[0])\n        ci =\
  \ [sum(v[k] for v in I) / float(len(I)) for k in range(d)]\n        ct = [sum(v[k] for v in T) / float(len(T))\
  \ for k in range(d)]\n        gap = math.sqrt(sum((ci[k] - ct[k]) ** 2 for k in range(d)))\n\n     \
  \   def within(X):\n            n = len(X)\n            if n < 2:\n                return 0.0\n    \
  \        tot = 0.0\n            cnt = 0\n            for a in range(n):\n                for b in range(a\
  \ + 1, n):\n                    tot += sum(p * q for p, q in zip(X[a], X[b]))\n                    cnt\
  \ += 1\n            return tot / cnt\n\n        cross = sum(sum(p * q for p, q in zip(a, b)) for a in\
  \ I for b in T)\n        cross = cross / float(len(I) * len(T))\n        return [gap, within(I), within(T),\
  \ cross]\n"
