slug: iq-modality-gap-invariance
title: Measure the offset between two encoders' embedding clouds
difficulty: medium
categories:
- VLM
concepts:
- embeddings
- projection_layers
description: 'A trained dual encoder places its image embeddings and its text embeddings in two narrow,
  separated cones on the unit sphere. The contrastive objective never penalises that separation, so it
  is there at step 0 and still there at convergence. Ranking across the two clouds still works, which
  is why retrieval is unaffected; treating a similarity as an absolute score does not.


  Write `modality_gap(image_emb, text_emb)` returning

  `[gap, mean_within_image, mean_within_text, mean_cross]`.


  1. L2-normalise every input vector: `u = v / sqrt(sum(x*x))`. The inputs are **not** unit vectors. A
  zero vector normalises to all zeros.

  2. `gap` is the Euclidean distance between the two centroids, where a centroid is the plain arithmetic
  mean of that modality''s unit vectors. **Do not re-normalise the centroid** -- its shortened length
  is exactly the signal that the cone is wide, and rescaling it to length 1 throws that away.

  3. `mean_within_image` is the mean cosine over all unordered pairs `(a, b)` with `a < b` drawn from
  the image set. Self-pairs are excluded; each one would contribute a 1.0 and inflate the mean. `mean_within_text`
  is the same over the text set.

  4. `mean_cross` is the mean cosine over all `len(image_emb) * len(text_emb)` image-text pairs, matched
  pairs included.


  If a modality holds fewer than 2 vectors, its within-modality mean is `0.0`.


  All four values are floats; the driver rounds each to 6 decimals.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 28
examples:
- input: image_emb = [[1.0, 0.0], [0.0, 1.0]], text_emb = [[-1.0, 0.0], [0.0, -1.0]]
  output: '[1.414214, 0.0, 0.0, -0.5]'
  explanation: The centroids are [0.5, 0.5] and [-0.5, -0.5]; their difference [1, 1] has length sqrt(2)
    = 1.414214. Each modality holds one pair and it is orthogonal, so both within means are 0. The four
    cross cosines are -1, 0, 0, -1, averaging -0.5 -- nowhere near the within-modality scale.
- input: image_emb = [[3.0, 4.0], [6.0, 8.0]], text_emb = [[0.0, 2.0]]
  output: '[0.632456, 1.0, 0.0, 0.8]'
  explanation: Both image vectors normalise to [0.6, 0.8], so they are the same direction and the within-image
    mean is 1.0. A single text vector means the within-text mean is 0.0 by definition, and both cross
    cosines are 0.8.
constraints:
- 1 <= len(image_emb), len(text_emb) <= 200
- All vectors share one dimension D, 1 <= D <= 64
- Normalise every vector first; the inputs are not unit length.
- The centroid is the mean of the unit vectors and is NOT re-normalised.
- Within-modality means exclude self-pairs; fewer than 2 vectors gives 0.0.
- Round each of the four values to 6 decimal places.
- Standard library only -- no numpy, no torch.
