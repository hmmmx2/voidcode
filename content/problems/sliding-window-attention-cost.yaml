    '
reference_solution: "class Solution(object):\n    def cost(self, tokens):\n        n = int(tokens[0]);\
  \ w = int(tokens[1])\n        if n <= 0:\n            return '0 0 0.0'\n        full = n * (n + 1) //\
  \ 2\n        win = sum(min(i + 1, w) for i in range(n))\n        pct = round((full - win) / full * 100,\
  \ 1)\n        return str(full) + ' ' + str(win) + ' ' + str(pct)\n"
