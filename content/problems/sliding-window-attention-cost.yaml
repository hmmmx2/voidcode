slug: sliding-window-attention-cost
title: What sliding-window attention actually saves
difficulty: medium
categories:
- LLM
concepts:
- attention_variants
- flash_attention
description: 'Input: `seq_len window`.


  Full causal attention scores `n(n+1)/2` pairs. A causal sliding window of size `w` scores at most `w`
  previous positions per query, so position i scores `min(i + 1, w)` pairs.


  Return `full windowed saved_pct`, the first two as integers and the percentage saved rounded to 1 decimal
  place.


  A window at least as large as the sequence saves nothing, and the arithmetic should show exactly 0.0
  rather than a small negative number.'
order_index: 59
