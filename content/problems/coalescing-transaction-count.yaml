slug: coalescing-transaction-count
title: Count the sectors a warp actually fetches
difficulty: medium
categories:
- CUDA
concepts:
- memory_coalescing
- warp_divergence
description: 'Write `memory_traffic(addresses, elem_bytes, sector_bytes)` taking one starting byte address
  per lane and returning how many distinct memory sectors the warp touches, how many bytes that costs,
  and what fraction of them the warp asked for. The trap is the straddle: a lane whose element is not
  sector-aligned drags in two sectors, not one.'
inferred_concepts: true
review_needed: true
domain: cuda
kind: code
