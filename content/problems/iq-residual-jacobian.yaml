slug: iq-residual-jacobian
title: Decompose a residual stack's gradient by path length
difficulty: medium
categories:
- DL
concepts:
- backpropagation
description: "A stack of `L` residual blocks computes `x -> x + F_l(x)` at each layer. Treat each block's\
  \ Jacobian `dF_l/dx` as a scalar `j_l`, so the end-to-end derivative is\n\n```\nprod_{l=1..L} (1 + j_l)\n\
  ```\n\nExpanding that product gives one term per **subset** of layers — a term that passes through the\
  \ blocks in the subset and skips the rest via the identity route. Group the terms by subset size:\n\n\
  ```\nspectrum[k] = sum over all subsets S of size k of  prod_{l in S} j_l\n```\n\nWrite\n\n```\nclass\
  \ Solution(object):\n    def path_spectrum(self, jacobians):\n        # -> [spectrum[0], spectrum[1],\
  \ ..., spectrum[L]]\n```\n\nreturning a list of length `L + 1`.\n\n**What the two ends mean.** `spectrum[0]`\
  \ is always exactly `1.0` — the empty subset, the route from the loss all the way back through zero\
  \ Jacobians. That term is why the gradient cannot vanish uniformly no matter what the deep terms do.\
  \ `spectrum[L]` is the product of every Jacobian, which is precisely what a plain stack `y = F(x)` would\
  \ give you and nothing else. Everything between is the ensemble of shallower paths. The whole list sums\
  \ to `prod(1 + j_l)`.\n\n**Do not enumerate the subsets.** There are `2^L` of them and `L` reaches 25\
  \ in the tests. One pass over the layers, carrying the whole spectrum, is `O(L^2)`: after absorbing\
  \ a new layer `j`, the size-`k` sums pick up `spectrum[k-1] * j`. Update the entries from the high index\
  \ down, or a single layer will be counted more than once.\n\n**Edge case.** An empty list returns `[1.0]`\
  \ — no blocks, derivative is the identity.\n\nThe driver rounds every entry to 6 decimal places.\n\n\
  Standard library only -- no numpy, no torch."
inferred_concepts: true
review_needed: true
order_index: 11
examples:
- input: jacobians = [0.9, 0.9]
  output: '[1.0, 1.8, 0.81]'
  explanation: One empty path (1.0), two single-block paths (0.9 each), one path through both (0.81).
    They sum to 3.61 = 1.9^2 = prod(1 + j).
- input: jacobians = [0.0]
  output: '[1.0, 0.0]'
  explanation: Zero-initialising F's last layer makes j = 0, so every path through the block contributes
    nothing and the block is exactly the identity at step 0.
constraints:
- 0 <= L <= 25
- -10.0 <= jacobians[i] <= 10.0
- Return a list of length L + 1; spectrum[0] is 1.0.
- Do not enumerate the 2^L subsets -- that will time out.
- Round every entry to 6 decimal places.
- Standard library only -- no numpy, no torch.
