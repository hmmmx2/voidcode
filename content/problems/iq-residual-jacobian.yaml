source_kind: interview_problem
reference_solution: "class Solution(object):\n    def path_spectrum(self, jacobians):\n        n = len(jacobians)\n\
  \        # spectrum[k] = sum over subsets of size k of the product of their j's.\n        spectrum =\
  \ [1.0] + [0.0] * n\n        filled = 0\n        for j in jacobians:\n            filled += 1\n    \
  \        # High index downward, so this layer is absorbed at most once.\n            for k in range(filled,\
  \ 0, -1):\n                spectrum[k] = spectrum[k] + spectrum[k - 1] * j\n        return spectrum\n"
