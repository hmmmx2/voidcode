reference_solution: "class Solution(object):\n    def mrr(self, tokens):\n        n = int(tokens[0])\n\
  \        ranks = [int(x) for x in tokens[1:1 + n]]\n        if n == 0:\n            return 0.0\n   \
  \     total = sum(0.0 if r <= 0 else 1.0 / r for r in ranks)\n        return round(total / n, 4)\n"
