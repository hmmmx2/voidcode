slug: mean-reciprocal-rank
title: MRR, and what it ignores
difficulty: medium
categories:
- ML
concepts:
- classification_metrics
description: 'Input: `n_queries`, then for each query the 1-based rank of its first relevant result, or
  `0` when nothing relevant was returned.


  Return MRR rounded to 4 decimal places: the mean of `1/rank`, counting a query with no relevant result
  as 0.


  MRR only sees the FIRST relevant result. A ranker that puts one good item at position 1 and nothing
  else useful scores a perfect 1.0, identically to one that fills the whole page with good items. That
  is the right metric when a learner needs one answer and the wrong one when they need a set — which is
  why this project reports NDCG instead.'
