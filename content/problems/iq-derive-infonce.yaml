reference_solution: "import math\n\n\nclass Solution(object):\n    def clip_loss(self, image_emb, text_emb,\
  \ tau):\n        n = len(image_emb)\n\n        def unit(v):\n            m = math.sqrt(sum(x * x for\
  \ x in v))\n            if m == 0.0:\n                return [0.0] * len(v)\n            return [x /\
  \ m for x in v]\n\n        I = [unit(v) for v in image_emb]\n        T = [unit(v) for v in text_emb]\n\
  \        S = [[sum(a * b for a, b in zip(I[i], T[j])) / tau for j in range(n)]\n             for i in\
  \ range(n)]\n\n        def nll(row, k):\n            hi = max(row)\n            lse = hi + math.log(sum(math.exp(x\
  \ - hi) for x in row))\n            return lse - row[k]\n\n        i2t = sum(nll(S[i], i) for i in range(n))\
  \ / n\n        t2i = sum(nll([S[i][j] for i in range(n)], j) for j in range(n)) / n\n        return\
  \ (i2t + t2i) / 2.0\n"
