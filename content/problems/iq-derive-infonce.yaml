slug: iq-derive-infonce
title: Symmetric contrastive loss for an image-text batch
difficulty: medium
categories:
- VLM
concepts:
- loss_functions
description: "Write `clip_loss(image_emb, text_emb, tau)`.\n\n`image_emb[i]` and `text_emb[i]` are the\
  \ i-th matched pair, given as plain lists of floats of equal length. They are **not** unit vectors.\n\
  \n1. L2-normalise every vector: `u = v / sqrt(sum(x*x))`.\n2. Build the N x N score matrix `S[i][j]\
  \ = dot(u_img[i], u_txt[j]) / tau`. The N diagonal entries are the true pairs; every off-diagonal entry\
  \ is a negative drawn from the same batch, so the batch *is* the negative set.\n3. Score each row --\
  \ image i choosing among N captions:\n\n   `row_i = -log( exp(S[i][i]) / sum_j exp(S[i][j]) )`\n\n4.\
  \ Score each column -- caption j choosing among N images:\n\n   `col_j = -log( exp(S[j][j]) / sum_i\
  \ exp(S[i][j]) )`\n\n5. Return `(mean of row_i + mean of col_j) / 2`.\n\nBoth directions are needed.\
  \ Normalising along rows constrains nothing along columns, so a one-directional objective trains image-to-text\
  \ retrieval and leaves text-to-image free.\n\n**Edge cases.** `N = 1` returns exactly `0.0` -- there\
  \ is nothing to discriminate against, and the loss at chance is `log N`. A zero vector normalises to\
  \ all zeros.\n\nReturn a float; the driver rounds it to 6 decimals.\n\nStandard library only -- no numpy,\
  \ no torch."
inferred_concepts: true
