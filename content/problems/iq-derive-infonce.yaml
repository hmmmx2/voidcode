examples:
- input: image_emb = [[1.0, 0.0], [0.0, 1.0]], text_emb = [[1.0, 0.0], [0.0, 1.0]], tau = 1.0
  output: '0.313262'
  explanation: Both sets are already unit vectors, so S = [[1, 0], [0, 1]]. Every row and every column
    contributes log(1 + e^-1) = 0.3132617.
- input: image_emb = [[1.0, 0.0], [0.0, 1.0]], text_emb = [[1.0, 0.0], [0.0, 1.0]], tau = 0.5
  output: '0.126928'
  explanation: A smaller tau sharpens the same scores to [[2, 0], [0, 2]] and the loss falls to log(1
    + e^-2). Multiplying by tau instead would raise it.
constraints:
- 1 <= N <= 200, and len(image_emb) == len(text_emb) == N
- All vectors share one dimension D, 1 <= D <= 64
- 0 < tau <= 100
- Normalise before scoring -- the inputs are not unit vectors.
- Score rows and columns and average the two means.
- N = 1 returns exactly 0.0.
- Round to 6 decimal places.
- Standard library only -- no numpy, no torch.
