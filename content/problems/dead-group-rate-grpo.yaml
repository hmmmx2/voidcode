hints:
- Spread is max minus min. A group is dead when that is within tol, not when it equals zero exactly.
- Both all-zero and all-one groups are dead; do not special-case zero.
- Floating point rewards from partial credit will not compare equal, which is why tol exists.
hint_ladder:
  level_0: Spread is max minus min. A group is dead when that is within tol, not when it equals zero exactly.
  level_1: Both all-zero and all-one groups are dead; do not special-case zero.
  level_2: Floating point rewards from partial credit will not compare equal, which is why tol exists.
