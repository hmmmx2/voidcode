order_index: 15
reference_solution: "class Solution(object):\n    def dead_group_rate(self, rewards, tol=1e-8):\n    \
  \    if not rewards:\n            return 0.0\n        dead = sum(1 for g in rewards if max(g) - min(g)\
  \ <= tol)\n        return dead / len(rewards)\n"
