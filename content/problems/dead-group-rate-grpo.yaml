slug: dead-group-rate-grpo
title: Count the GRPO groups that carry no gradient
difficulty: medium
categories:
- LLM
concepts:
- rlhf_grpo
- loss_functions
description: 'GRPO computes advantages *within* a group: reward minus the group mean, divided by the group

  standard deviation. There is no value network — the group is the baseline.


  That has a consequence worth being able to state in an interview. **If every completion in a

  group scores identically, the advantage is exactly zero and the group contributes no gradient**,

  no matter how many completions you sampled. These are dead groups, and they are the dominant

  failure mode of verifiable-reward RL.


  Write `dead_group_rate(rewards, tol=1e-8)` where `rewards` is a list of groups, each a list of

  per-completion rewards. Return the fraction of groups whose spread (max minus min) is within

  `tol`.


  **Count both directions.** A group where everything failed and a group where everything passed

  are both dead. It is tempting to only count all-fail, because that is the intuitive failure — but

  on an easy corpus the all-pass case dominates, and a rate that only sees one of them will read

  as healthy while the run learns nothing.


  Read this beside the reward curve, never alone: a reward rising while the dead-group rate climbs

  toward 1 means an ever-shrinking handful of prompts is doing all the training.

  '
