slug: few-shot-prompt-budget
title: How many examples fit before the answer does not?
difficulty: easy
categories:
- LLM
concepts:
- tokenization
- kv_cache
description: 'Input: `context_limit system_tokens question_tokens reserve_for_answer example_tokens`.


  Return the maximum number of identical few-shot examples that fit, and the tokens left unused, as `n_examples
  slack`.


  The reserve is not optional. A prompt that fills the context leaves no room to generate, and the failure
  is a truncated answer rather than an error — which looks like a bad model rather than a budgeting mistake.


  Return `0 slack` when even zero examples overflow, and never a negative count.'
order_index: 66
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def budget(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().budget(_p))

    '
reference_solution: "class Solution(object):\n    def budget(self, tokens):\n        limit = int(tokens[0]);\
  \ sys_t = int(tokens[1])\n        q = int(tokens[2]); res = int(tokens[3]); ex = int(tokens[4])\n  \
  \      avail = limit - sys_t - q - res\n        if avail < 0:\n            return '0 ' + str(avail)\n\
  \        n = 0 if ex <= 0 else avail // ex\n        return str(int(n)) + ' ' + str(int(avail - n * ex))\n"
