source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def flop_crossover(self, d_model, ffn_ratio,\
  \ seq_len):\n        d = float(d_model)\n        n = float(seq_len)\n        n_star = int(math.ceil((2.0\
  \ + ffn_ratio) * d))\n        quad = 4.0 * n * n * d\n        lin = (8.0 + 4.0 * ffn_ratio) * n * d\
  \ * d\n        return [n_star, quad, lin, quad / lin]\n"
