slug: iq-attention-vs-ffn-crossover
title: Find the length where attention FLOPs overtake everything else
difficulty: medium
categories:
- LLM
- CUDA
concepts:
- attention_scaled_dot
- feedforward_blocks
description: 'For a single transformer layer with model dimension `d`, sequence length `n`, and a feed-forward
  hidden size of `ffn_ratio * d`, count forward-pass FLOPs and locate the point where the quadratic term
  takes over.


  `flop_crossover(self, d_model, ffn_ratio, seq_len) -> list`


  Return `[n_star, quad_flops, lin_flops, ratio]`.


  **FLOP model.** A matmul producing an `A x B` output with inner dimension `C` costs `2*A*B*C`. Writing
  `d = d_model`, `r = ffn_ratio`, `n = seq_len`:


  | term | shape | FLOPs |

  | --- | --- | --- |

  | scores `Q K^T` | `n x n`, inner `d` | `2*n*n*d` |

  | value matmul | `n x d`, inner `n` | `2*n*n*d` |

  | Q, K, V, O projections | four of `n x d`, inner `d` | `8*n*d*d` |

  | feed-forward, two matrices | `d -> r*d -> d` | `4*r*n*d*d` |


  So `quad = 4*n*n*d` and `lin = (8 + 4*r) * n * d * d`. Ignore softmax, normalisation, biases and activations:
  they are `O(n*d)` and do not move the crossover.


  **Crossover.** `n_star` is the smallest integer `n` satisfying `quad >= lin`. Solve `4*n*n*d >= (8 +
  4*r)*n*d*d` for `n` and take the ceiling. It is a multiple of `d` and does **not** depend on `seq_len`.


  **Ratio.** `ratio = quad / lin` evaluated at `seq_len`, above 1 exactly when the sequence is past the
  crossover.


  The point of the exercise is that "attention is quadratic" says nothing about where the quadratic term
  actually bites -- the constants decide, and the answer scales with `d`, not with some fixed token count.


  `quad_flops` and `lin_flops` are exact FLOP counts and the driver prints them as integers; `ratio` is
  rounded to 6 decimals. `ffn_ratio` may be fractional.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 22
examples:
- input: d_model = 1024, ffn_ratio = 4.0, seq_len = 6144
  output: '[6144, 154618822656, 154618822656, 1.0]'
  explanation: 6144 = 6 * 1024 is exactly the crossover, so both terms are 154618822656 FLOPs and the
    ratio is exactly 1.
- input: d_model = 4096, ffn_ratio = 4.0, seq_len = 131072
  output: '[24576, 281474976710656, 52776558133248, 5.333333]'
  explanation: At d = 4096 the crossover is 24576 tokens, not a few hundred. A 128k sequence is 5.33x
    past it -- and note the ratio is just seq_len / n_star.
constraints:
- 64 <= d_model <= 65536
- 0 < ffn_ratio <= 16 (may be fractional)
- 1 <= seq_len <= 10^7
- n_star must not depend on seq_len.
- ratio rounded to 6 decimal places.
- Standard library only -- no numpy, no torch.
