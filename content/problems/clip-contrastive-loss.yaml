slug: clip-contrastive-loss
title: Symmetric contrastive loss over an image-text similarity matrix
difficulty: medium
categories:
- VLM
concepts:
- contrastive_pretraining
- loss_functions
- numerical_stability
description: 'Given an n x n matrix of image-text similarities and a temperature, return the symmetric
  InfoNCE loss used to pretrain CLIP, rounded to 4 decimal places. The diagonal holds the matched pairs.
  Two things decide whether this is right: the loss is computed in BOTH directions - image-to-text down
  the rows and text-to-image down the columns - and averaged, because a matrix that ranks the right caption
  first does not necessarily rank the right image first. And the temperature divides the similarities
  before the softmax, so at the 0.07 CLIP actually uses you are exponentiating values fourteen times larger
  than they look.'
