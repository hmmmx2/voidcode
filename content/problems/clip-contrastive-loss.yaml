hints:
- The positive pair for row i is column i. Every other entry in that row is a negative.
- 'Do it twice: once across each row, once down each column, then average. One direction is only half
  the objective, and it is the half that scores well on a matrix that has collapsed.'
- Divide by the temperature before the softmax, and subtract the row maximum before exponentiating - at
  a temperature of 0.07 a raw exp overflows.
