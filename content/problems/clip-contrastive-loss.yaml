  template_code: "class Solution(object):\n    def clip_loss(self, sims, temperature):\n        \"\"\"\
    \n        :type sims: List[List[float]]   n x n image-text similarity matrix\n        :type temperature:\
    \ float\n        :rtype: float                   symmetric InfoNCE loss, rounded to 4dp\n        \"\
    \"\"\n"
  driver_code: 'import sys

    _tok = sys.stdin.read().split()

    _n = int(_tok[0])

    _vals = [float(x) for x in _tok[1:1 + _n * _n]]

    _sims = [_vals[i * _n:(i + 1) * _n] for i in range(_n)]

    _temp = float(_tok[1 + _n * _n])

    print(Solution().clip_loss(_sims, _temp))

    '
reference_solution: "import math\n\n\nclass Solution(object):\n    def clip_loss(self, sims, temperature):\n\
  \        n = len(sims)\n        logits = [[s / temperature for s in row] for row in sims]\n\n      \
  \  def cross_entropy(rows):\n            # Subtract the row max before exponentiating. At the temperatures\
  \ CLIP actually uses\n            # (0.07 => a 14x multiplier) a raw exp overflows long before the maths\
  \ is wrong.\n            total = 0.0\n            for i, row in enumerate(rows):\n                top\
  \ = max(row)\n                lse = top + math.log(sum(math.exp(v - top) for v in row))\n          \
  \      total += lse - row[i]\n            return total / len(rows)\n\n        # Both directions. The\
  \ diagonal is the positive pair in each.\n        columns = [[logits[r][c] for r in range(n)] for c\
  \ in range(n)]\n        return round((cross_entropy(logits) + cross_entropy(columns)) / 2, 4)\n"
