- At what token count does the n² term overtake the nd² terms here?
red_flags:
- Assuming the pixel-facing layer dominates because it sees the most data.
- Forgetting attention is quadratic when changing patch size.
- Computing per-patch FLOPs but forgetting to multiply by token count.
