slug: shared-memory-tile-budget
title: How large a tile fits in shared memory?
difficulty: medium
categories:
- CUDA
concepts:
- memory_hierarchy
- tiled_matmul
description: 'Return the largest square tile dimension that fits in a streaming multiprocessor''s shared
  memory.


  Write `max_tile(smem_bytes, dtype_bytes, buffers)` returning the largest `T` such that

  `T*T * dtype_bytes * buffers <= smem_bytes`. Return 0 if even a 1x1 tile does not fit.


  `buffers` is how many tiles are resident at once: 2 for a standard tiled matmul holding a tile of

  A and a tile of B, 4 if you double-buffer to overlap the next load with the current compute.


  **Why the answer is not simply "the biggest tile that fits".** Shared memory is also what limits

  *occupancy* — it is a per-SM budget shared between resident blocks. A tile that consumes all

  48 KB lets exactly one block live on the SM, so there is nothing to switch to when that block

  stalls on a global load, and latency hiding disappears. The largest tile is frequently not the

  fastest; it is the point at which you have traded away every other block.


  Double buffering makes this sharper: it halves the tile you can afford in exchange for overlapping

  the load with the compute, and which side wins depends on whether the kernel is bandwidth-bound or

  latency-bound — a question the arithmetic here sets up but does not answer.'
