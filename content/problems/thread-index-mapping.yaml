    \ \"\"\"\n        :type grid_dim: int\n        :type block_dim: int\n        :type n: int\n      \
    \  :rtype: List[List[int]]  # one list per block\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    grid_dim = int(_in[0]); block_dim = int(_in[1]); n = int(_in[2])

    print(Solution().mapThreads(grid_dim, block_dim, n))

    '
source_kind: problem
reference_solution: "class Solution(object):\n    def mapThreads(self, grid_dim, block_dim, n):\n    \
  \    out = []\n        for b in range(grid_dim):\n            block = []\n            for t in range(block_dim):\n\
  \                gid = b * block_dim + t\n                block.append(gid if gid < n else -1)\n   \
  \         out.append(block)\n        return out\n"
