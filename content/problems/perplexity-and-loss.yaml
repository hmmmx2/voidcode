description: 'Write `eval_metrics(logprobs, n_bytes)` returning `[loss_nats, perplexity, bits_per_byte]`
  from the natural-log probabilities a model assigned to each observed token. Two bases and two normalisers
  are in play: perplexity exponentiates the per-token mean in nats, while bits-per-byte divides the *total*
  by `n_bytes` and converts to bits -- swapping either is a silent, plausible-looking error the hidden
  cases are built to expose.'
