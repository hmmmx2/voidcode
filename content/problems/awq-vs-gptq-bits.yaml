slug: awq-vs-gptq-bits
title: What does group-wise quantization really cost?
difficulty: medium
categories:
- Systems
concepts:
- quantization_schemes
- quantization_basics
description: 'Return the effective bits per weight of group-wise quantization, including the scale and
  zero-point

  overhead.


  Write `effective_bits(bits, group_size, scale_bits)`. Each group of `group_size` weights is stored

  at `bits` each, plus **one scale and one zero-point** at `scale_bits` each. Return the total

  divided by `group_size`, rounded to 4dp.


  **Why "4-bit" is never 4 bits, and why the group size is the real decision.** At group 128 with

  fp16 scales the overhead is 32 bits spread over 128 weights — 0.25 bits, so 4-bit is really 4.25.

  At group 32 it is 1.0 extra bit, and your 4-bit model is 5-bit. Halving the group size to improve

  accuracy costs real memory, and the two pull against each other directly.


  **What the group size buys.** Quantization error depends on the *range* within a group, so smaller

  groups isolate outliers and cut error sharply — one extreme weight ruins 128 neighbours but only

  31 in a smaller group. This is the same observation that motivates AWQ and GPTQ: both spend their

  effort deciding what to keep in higher precision rather than improving the rounding, because the

  rounding is already optimal given the range.


  AWQ scales salient channels before quantizing so their effective range shrinks; GPTQ quantizes

  column by column and corrects the remaining columns for the error already committed. Both are

  attacks on the range, not on the arithmetic.'
