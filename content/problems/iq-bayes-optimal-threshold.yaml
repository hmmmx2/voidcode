  template_code: "class Solution(object):\n    def threshold_and_cost(self, probs, c_fn, c_fp):\n    \
    \    \"\"\"\n        :type probs: List[float]  -- calibrated P(y=1|x) per row\n        :type c_fn:\
    \ float         -- cost of a missed positive\n        :type c_fp: float         -- cost of a false\
    \ alarm\n        :rtype: List[float]       -- [t, cost_at_t, cost_at_half]\n        \"\"\"\n"
  driver_code: 'import sys, json

