    probs = json.loads(_in[0])

    c_fn = float(_in[1])

    c_fp = float(_in[2])

    _r = Solution().threshold_and_cost(probs, c_fn, c_fp)

    print([round(v, 6) for v in _r])

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def threshold_and_cost(self, probs, c_fn, c_fp):\n \
  \       t = c_fp / (c_fn + c_fp)\n        cost_opt = 0.0\n        cost_half = 0.0\n        for p in\
  \ probs:\n            cost_opt += (1.0 - p) * c_fp if p > t else p * c_fn\n            cost_half +=\
  \ (1.0 - p) * c_fp if p > 0.5 else p * c_fn\n        return [t, cost_opt, cost_half]\n"
