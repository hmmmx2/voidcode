- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def dropout_moments(self, a, p, mode):\n        \"\"\"\n\
    \        :type a: List[float]\n        :type p: float\n        :type mode: str  -- \"train\" or \"\
    eval\"\n        :rtype: List[float]  -- [scale, mean, var]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    a = json.loads(_in[0])

    p = float(_in[1])

    mode = _in[2].strip()

    _r = Solution().dropout_moments(a, p, mode)

    print([round(float(x), 6) + 0.0 for x in _r])

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def dropout_moments(self, a, p, mode):\n        total\
  \ = float(sum(a))\n        if mode == \"eval\":\n            return [1.0, total, 0.0]\n        scale\
  \ = 1.0 / (1.0 - p)\n        var = (p / (1.0 - p)) * sum(x * x for x in a)\n        return [scale, total,\
  \ var]\n"
