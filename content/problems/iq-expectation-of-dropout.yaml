slug: iq-expectation-of-dropout
title: Compute the moments inverted dropout leaves behind
difficulty: easy
categories:
- DL
concepts:
- regularization
description: 'Inverted dropout replaces each activation `a_i` with `c * m_i * a_i`, where `m_i ~ Bernoulli(1
  - p)` is 1 when the unit is kept, the masks are independent across units, and `c` is a constant chosen
  so the training-time expectation matches what the plain network produces at inference.


  Given the activations `a`, the drop probability `p` and a `mode` of `"train"` or `"eval"`, return `[scale,
  mean, var]` for the summed output `S = sum_i output_i`:


  - `scale` — the constant `c`. Derive it by requiring `E[c * m_i * a_i] = a_i`, given `E[m_i] = 1 - p`.

  - `mean` — `E[S]`.

  - `var` — `Var(S)`. The masks are independent so the per-unit variances add, and `Var(m_i) = p * (1
  - p)`.


  In `"eval"` mode dropout is switched off completely: no mask, no scaling. `scale` is `1.0`, `mean` is
  the plain sum, and `var` is `0.0`. That the deployed graph is the plain network is exactly why the correction
  is put on the training side.


  Edge cases and rounding:


  - `p = 0` is legal in `"train"` mode and must not divide by zero in spirit or in fact: scale `1.0`,
  variance `0.0`.

  - Activations may be negative. The mean depends on their signed sum, the variance on their squares,
  so a sign error shows up in only one of the two.

  - Round all three values to 6 decimal places.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 19
examples:
- input: a = [1.0, 2.0], p = 0.5, mode = "train"
  output: '[2.0, 3.0, 5.0]'
  explanation: c(1-p) = 1 gives c = 2, so survivors are doubled. The mean is preserved at 1 + 2 = 3. Var(S)
    = c^2 * p(1-p) * (1^2 + 2^2) = 4 * 0.25 * 5 = 5.
- input: a = [1.0, 2.0], p = 0.5, mode = "eval"
  output: '[1.0, 3.0, 0.0]'
  explanation: Same mean, zero variance. Only the mean is shared between the two modes — the distribution
    is not preserved, and the gap is the regularisation.
constraints:
- 1 <= len(a) <= 10^4
- 0 <= p < 1
- mode is "train" or "eval"
- The mean must be identical in both modes.
- Round all three values to 6 decimal places.
- Standard library only -- no numpy, no torch.
