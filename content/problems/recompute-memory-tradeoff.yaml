reference_solution: "class Solution(object):\n    def activation_bytes(self, layers, bytes_per_layer,\
  \ n_checkpoints):\n        if n_checkpoints <= 0:\n            return layers * bytes_per_layer\n   \
  \     seg = -(-layers // n_checkpoints)\n        return n_checkpoints * bytes_per_layer + seg * bytes_per_layer\n"
