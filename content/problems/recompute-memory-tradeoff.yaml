slug: recompute-memory-tradeoff
title: What does gradient checkpointing actually buy?
difficulty: medium
categories:
- Systems
concepts:
- gradient_checkpointing
- memory_accounting
description: 'Return the peak activation memory held during backward, with and without gradient checkpointing.


  Write `activation_bytes(layers, bytes_per_layer, n_checkpoints)`. With `n_checkpoints <= 0`,

  every layer''s activations are stored: `layers * bytes_per_layer`. Otherwise you store

  `n_checkpoints` boundary activations and recompute one segment at a time, so peak is

  `n_checkpoints * bytes_per_layer + ceil(layers / n_checkpoints) * bytes_per_layer`.


  **The trade is memory for compute, and the exchange rate is worth knowing.** Recomputing a segment

  means running its forward pass twice, so the classic sqrt(L) checkpointing costs roughly 33% extra

  forward FLOPs — one extra forward against a forward-plus-backward that is about 3x a forward — to

  turn O(L) activation memory into O(sqrt(L)).


  **Where it stops being the obvious win.** If the model is already memory-bound rather than

  compute-bound, that 33% is nearly free and you should take it. If you are compute-bound on a fast

  card with memory to spare, you are paying a third of your throughput for nothing. This project

  measured a 7.6B fitting in 37.17 GiB *with* checkpointing on a 44.42 GiB card - so it was load-

  bearing there, and dropping it would not have fit.'
