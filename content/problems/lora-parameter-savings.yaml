  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().lora_trainable_fraction(int(_p[0]), int(_p[1]), int(_p[2]), int(_p[3])))

    '
reference_solution: "class Solution(object):\n    def lora_trainable_fraction(self, d_in, d_out, rank,\
  \ n_layers):\n        trainable = n_layers * rank * (d_in + d_out)\n        frozen = n_layers * d_in\
  \ * d_out\n        return round(trainable / frozen, 6)\n"
