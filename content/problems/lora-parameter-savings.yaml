slug: lora-parameter-savings
title: What fraction of the model does LoRA actually train?
difficulty: medium
categories:
- Systems
concepts:
- peft_lora
- memory_accounting
description: 'Given a layer''s input and output dimensions, a LoRA rank, and how many such layers are
  adapted,

  return the fraction of the original parameters that LoRA actually trains.


  Write `lora_trainable_fraction(d_in, d_out, rank, n_layers)`.


  LoRA freezes `W` (d_in x d_out) and learns `B @ A` where `A` is `rank x d_in` and `B` is

  `d_out x rank`. So each adapted layer trains `rank * (d_in + d_out)` parameters against

  `d_in * d_out` frozen ones.


  Return the fraction rounded to 6 decimal places.


  **Why the memory saving is larger than this fraction suggests.** The frozen weights still occupy

  memory, so LoRA does not shrink the model — it shrinks the *optimizer state and gradients*, which

  under AdamW are 12 bytes per trainable parameter against 2 for a frozen bf16 weight. That is the

  real reason a 7B fits on one card with LoRA and not without, and it is a better answer than "fewer

  parameters".


  There is a second saving worth naming: toggling the adapter off recovers the reference policy for

  free, which removes an entire model copy from any RL setup.'
