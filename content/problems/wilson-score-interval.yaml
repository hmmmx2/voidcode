slug: wilson-score-interval
title: Compute a Wilson score interval
difficulty: medium
categories:
- ML
concepts:
- probability_expectation
- numerical_stability
description: "The normal approximation to a binomial proportion goes outside [0,1] at small n, which is\
  \ how a bucket of one gets reported as a confident rate. The Wilson interval does not.\n\nInput: `successes\
  \ n`, using z = 1.96. Output the interval as `low high`, each rounded to 4 decimal places, separated\
  \ by a single space.\n\n    centre = (p + z^2/2n) / (1 + z^2/n)\n    half   = z * sqrt( p(1-p)/n + z^2/(4n^2)\
  \ ) / (1 + z^2/n)\n\nWith `n = 0` return `0.0 1.0`: no observations license nothing narrower than the\
  \ whole range."
order_index: 44
