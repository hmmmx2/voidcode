reference_solution: "import math\n\nclass Solution(object):\n    def wilson(self, tokens):\n        s\
  \ = int(tokens[0]); n = int(tokens[1])\n        if n == 0:\n            return '0.0 1.0'\n        z\
  \ = 1.96\n        p = s / n\n        denom = 1 + z * z / n\n        centre = (p + z * z / (2 * n)) /\
  \ denom\n        half = z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / denom\n        lo = max(0.0,\
  \ centre - half)\n        hi = min(1.0, centre + half)\n        return str(round(lo, 4)) + ' ' + str(round(hi,\
  \ 4))\n"
