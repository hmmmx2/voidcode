slug: paged-kv-fragmentation
title: How much KV memory does paging waste?
difficulty: medium
categories:
- LLM
concepts:
- paged_attention
- continuous_batching
description: 'Return the total KV slots wasted to internal fragmentation across a batch.


  Write `wasted_blocks(seq_len, block_size, n_seqs)`. Each sequence occupies

  `ceil(seq_len / block_size)` blocks, and the tail block is partly empty. Return

  `allocated_slots - used_slots` summed over all sequences.


  **Why paging is still the right trade despite this waste.** The alternative is contiguous

  allocation sized to the *maximum* context, so a 32k-capable server reserves 32k of cache for a

  sequence that turns out to be 200 tokens. That is external fragmentation and it is catastrophic —

  vLLM''s PagedAttention paper measures 60-80% of KV memory wasted that way.


  Paging replaces it with internal fragmentation bounded by `block_size - 1` slots per sequence,

  which for a block of 16 is under 2% at any realistic length. Trading unbounded waste for bounded

  waste is the whole idea, and it is the same trade an operating system makes with pages.


  Smaller blocks waste less and cost more in per-block bookkeeping and less contiguous access —

  which is why 16 rather than 1.'
