reference_solution: "class Solution(object):\n    def wasted_blocks(self, seq_len, block_size, n_seqs):\n\
  \        blocks = -(-seq_len // block_size)\n        return blocks * block_size * n_seqs - seq_len *\
  \ n_seqs\n"
