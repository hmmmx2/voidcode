hints:
- Gradient buffer bytes = params * dtype_bytes. Bus bandwidth is already normalised for the ring's 2(N-1)/N
  factor.
- Convert GB/s to bytes/s with 1e9, not 2**30 — interconnect vendors quote decimal gigabytes.
- fraction = comm_time / (comm_time + compute_time), both in the same unit.
