    \ int\n        :rtype: float             # in [0, 1], rounded to 4dp\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().allreduce_fraction(int(_p[0]), float(_p[1]), float(_p[2]), int(_p[3])))

    '
reference_solution: "class Solution(object):\n    def allreduce_fraction(self, params, busbw_gb_s, compute_ms,\
  \ dtype_bytes=2):\n        comm_s = (params * dtype_bytes) / (busbw_gb_s * 1e9)\n        compute_s =\
  \ compute_ms / 1000.0\n        total = comm_s + compute_s\n        if total == 0:\n            return\
  \ 0.0\n        return round(comm_s / total, 4)\n"
