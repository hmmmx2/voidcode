slug: allreduce-bandwidth-scaling
title: How much of your step is all-reduce?
difficulty: medium
categories:
- Systems
concepts:
- collective_ops
- data_parallel
description: 'Given a model''s parameter count, the measured all-reduce bus bandwidth, and the compute
  time

  of one training step, return the fraction of step time spent in gradient communication under

  plain data parallelism.


  Write `allreduce_fraction(params, busbw_gb_s, compute_ms, dtype_bytes=2)`.


  **Ring all-reduce moves 2(N-1)/N times the payload, not once.** It is a reduce-scatter followed

  by an all-gather, and each sends (N-1)/N of the data. At large N that tends to 2x, which is the

  number to have in your head — but this question uses *bus bandwidth*, which is already normalised

  for that, so the payload is simply the gradient buffer.


  Return the fraction as a float in [0, 1], rounded to 4 decimal places. Communication is assumed

  not overlapped with compute.


  **Why this decides your parallelism strategy rather than merely describing it.** A measured

  22.11 GB/s over PCIe without NVLink is a real number from this project''s own probe. At 7.6B

  parameters in bf16 that is a 15.2 GB gradient buffer and roughly 0.69 s of pure communication —

  so if your step computes in 200 ms, you are spending 77% of the run moving gradients. That is the

  arithmetic that says "raise gradient accumulation" or "do not add the second GPU", and it is worth

  being able to do it out loud.'
