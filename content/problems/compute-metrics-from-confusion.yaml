description: Given the dataset size, how many rows are truly positive, how many the model flagged and
  how many of those flags were correct, rebuild the confusion matrix and return accuracy, precision, recall,
  F1 and the majority-class baseline accuracy. The traps are the empty denominators and the baseline,
  which tracks the larger class and is not always the negatives.
