source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def logistic_grad(self, X, y, w, b, l2):\n\
  \        n = len(X)\n        d = len(w)\n        gw = [0.0] * d\n        gb = 0.0\n        for xi, yi\
  \ in zip(X, y):\n            z = b\n            for j in range(d):\n                z += w[j] * xi[j]\n\
  \            # Branch-stable sigmoid: neither exp() argument is ever positive.\n            if z >=\
  \ 0.0:\n                p = 1.0 / (1.0 + math.exp(-z))\n            else:\n                e = math.exp(z)\n\
  \                p = e / (1.0 + e)\n            r = p - yi\n            for j in range(d):\n       \
  \         gw[j] += r * xi[j]\n            gb += r\n        out = [gw[j] / n + l2 * w[j] for j in range(d)]\n\
  \        out.append(gb / n)\n        return out\n"
