slug: flash-attention-sram-tile
title: Pick a tile that fits in SRAM
difficulty: hard
categories:
- CUDA
concepts:
- memory_hierarchy
- flash_attention
description: 'Input: `sram_bytes head_dim bytes_per_elem`.


  A FlashAttention block keeps three tiles live — the query block, the key block and the value block —
  each `tile x head_dim` elements. Return the largest tile size that fits, rounded DOWN to a multiple
  of 16, and the bytes it uses, as `tile bytes_used`.


  Return `0 0` when even a tile of 16 does not fit. Rounding down to 16 matters: a tile that is not a
  multiple of the warp-level fragment shape wastes the tail of every instruction, so the largest fitting
  tile is not the fastest one.'
order_index: 80
