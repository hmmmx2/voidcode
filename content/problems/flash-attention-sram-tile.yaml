    '
reference_solution: "class Solution(object):\n    def tile(self, tokens):\n        sram = float(tokens[0]);\
  \ d = float(tokens[1]); by = float(tokens[2])\n        per = 3 * d * by\n        if per <= 0:\n    \
  \        return '0 0'\n        raw = int(sram // per)\n        t = (raw // 16) * 16\n        if t <\
  \ 16:\n            return '0 0'\n        return str(t) + ' ' + str(int(t * per))\n"
