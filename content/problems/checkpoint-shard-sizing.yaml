reference_solution: "import math\n\nclass Solution(object):\n    def shards(self, tokens):\n        n\
  \ = float(tokens[0]); bpp = float(tokens[1])\n        states = float(tokens[2]); cap = float(tokens[3])\n\
  \        total_bytes = n * 1e9 * bpp * (1 + states)\n        gb = total_bytes / 1e9\n        shards\
  \ = 0 if cap <= 0 else math.ceil(gb / cap)\n        return str(round(gb, 2)) + ' ' + str(int(shards))\n"
