slug: checkpoint-shard-sizing
title: Size a sharded checkpoint write
difficulty: medium
categories:
- Systems
concepts:
- checkpointing_recovery
- memory_accounting
description: 'Input: `n_params_billions bytes_per_param optimizer_states max_shard_gb`.


  A checkpoint holds the weights plus `optimizer_states` tensors of the same shape (2 for Adam''s two
  moments, 0 for plain SGD). Compute the total size in GB and the number of shards needed at `max_shard_gb`
  each, as `total_gb shards`, with the total rounded to 2 decimal places and shards an integer.


  Use 1 GB = 1e9 bytes. Sharding exists because a single multi-gigabyte file is slow to write, impossible
  to write in parallel, and awkward to resume from — but the count is what tells you whether a save will
  stall the training loop.'
order_index: 57
