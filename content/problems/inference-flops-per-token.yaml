slug: inference-flops-per-token
title: FLOPs per generated token, and why decode is different
difficulty: medium
categories:
- Systems
- LLM
concepts:
- serving_latency
- memory_accounting
description: 'Input: `n_params_billions`.


  A forward pass costs roughly `2 * N` FLOPs per token, where N is the parameter count — one multiply
  and one add per weight. Training adds a backward pass at roughly twice that again, giving `6 * N` per
  token.


  Return `inference_gflops training_gflops` per token, each rounded to 1 decimal place, where the inputs
  are in BILLIONS of parameters and the outputs in GFLOPs.


  This is the arithmetic that shows decode is memory-bound: 2N FLOPs is small, while reading N weights
  to produce ONE token is the whole model through memory. The ratio of those two is why batching helps
  decode so much.'
