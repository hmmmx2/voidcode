slug: top-p-sampling
title: Nucleus (Top-p) Filtering
difficulty: medium
categories:
- LLM
concepts:
- sampling_decoding
description: 'Implement the filtering step of nucleus sampling, the decoding strategy behind almost every
  deployed LLM.


  Given a probability distribution over the vocabulary and a threshold `p`, keep the **smallest set of
  tokens whose probabilities sum to at least p**, taking them in order of decreasing probability. Everything
  else is discarded before sampling.


  Unlike top-k, the size of this set adapts to the distribution: a confident model keeps one or two tokens,
  an uncertain one keeps many.


  Return the **indices** of the kept tokens, sorted ascending. Break probability ties by preferring the
  lower index.'
inferred_concepts: true
review_needed: true
order_index: 6
examples:
- input: probs = [0.5, 0.3, 0.15, 0.05], p = 0.8
  output: '[0, 1]'
  explanation: 0.5 then 0.3 reaches exactly 0.8, so the nucleus stops there.
- input: probs = [0.4, 0.3, 0.2, 0.1], p = 0.9
  output: '[0, 1, 2, 3]'
  explanation: 0.4 + 0.3 + 0.2 lands just below 0.9 in floating point, so the fourth token is still needed.
- input: probs = [0.25, 0.25, 0.25, 0.25], p = 0.5
  output: '[0, 1]'
  explanation: All tied, so the two lowest indices win and reach 0.5.
constraints:
- 1 <= len(probs) <= 10^5
- 0 <= probs[i] <= 1 and the values sum to approximately 1.
- 0 < p <= 1
- Ties in probability are broken by preferring the lower index.
- Return the kept indices sorted in ascending order.
- Standard library only -- no numpy, no torch.
hints:
- Sort the indices by probability, largest first -- but sort the INDICES, not the probabilities, because
  the answer is positions in the original vocabulary.
- Walk that order accumulating probability and stop as soon as the running total reaches p. The token
  that crosses the threshold is included.
- 'sorted(range(len(probs)), key=lambda i: (-probs[i], i)) gives descending probability with the lower
  index winning ties. Collect until the cumulative sum >= p, then sort the collected indices before returning.'
hint_ladder:
  level_0: Sort the indices by probability, largest first -- but sort the INDICES, not the probabilities,
    because the answer is positions in the original vocabulary.
  level_1: Walk that order accumulating probability and stop as soon as the running total reaches p. The
    token that crosses the threshold is included.
  level_2: 'sorted(range(len(probs)), key=lambda i: (-probs[i], i)) gives descending probability with
    the lower index winning ties. Collect until the cumulative sum >= p, then sort the collected indices
    before returning.'
