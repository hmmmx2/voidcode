code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def topP(self, probs, p):\n        \"\"\"\n        :type\
    \ probs: List[float]\n        :type p: float\n        :rtype: List[int]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    probs = json.loads(_in[0]); p = float(_in[1])

    print(Solution().topP(probs, p))

    '
source_kind: problem
reference_solution: "class Solution(object):\n    def topP(self, probs, p):\n        order = sorted(range(len(probs)),\
  \ key=lambda i: (-probs[i], i))\n        kept, cumulative = [], 0.0\n        for i in order:\n     \
  \       kept.append(i)\n            cumulative += probs[i]\n            if cumulative >= p:\n      \
  \          break\n        return sorted(kept)\n"
