reference_solution: "class Solution(object):\n    REQUIRED = ('model', 'optimizer', 'step', 'rng', 'dataloader')\n\
  \n    def missing_for_exact_resume(self, present):\n        gaps = sorted(set(self.REQUIRED) - set(present))\n\
  \        return ','.join(gaps) or 'none'\n"
