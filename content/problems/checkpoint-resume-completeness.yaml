slug: checkpoint-resume-completeness
title: What must a checkpoint hold to resume exactly?
difficulty: medium
categories:
- Systems
concepts:
- checkpointing_recovery
- optimizers_adaptive
description: "Given the components a checkpoint contains, return which of the five required for an *exact*\n\
  resume are missing.\n\nWrite `missing_for_exact_resume(present)` where `present` is a list of strings.\
  \ Return a\ncomma-separated sorted string of what is absent, or `\"none\"`.\n\nThe five: `model`, `optimizer`,\
  \ `step`, `rng`, `dataloader`.\n\n**Why each one, because \"just save the weights\" is the intuition\
  \ to dismantle:**\n\n- **optimizer** — Adam's moments are state. Resume without them and the first few\
  \ steps take a\n  different trajectory than the uninterrupted run. Plain SGD hides this, which is exactly\
  \ why a\n  resume test built on SGD proves nothing: it would pass with the optimizer state dropped entirely.\n\
  - **step** — the learning-rate schedule is a function of it. Resume at step 0 and you re-warm up.\n\
  - **rng** — dropout masks and data shuffling both draw from it. Without it the resumed run sees\n  different\
  \ regularisation and different batches.\n- **dataloader** — position in the epoch. Without it you replay\
  \ data already seen, which is\n  quietly worse than skipping it: the model sees those examples twice\
  \ in one epoch.\n\nA resume is only verified when the resumed loss curve matches the uninterrupted one\
  \ to floating\npoint, and that check is worth building because every omission above produces a curve\
  \ that looks\nplausible and is wrong."
