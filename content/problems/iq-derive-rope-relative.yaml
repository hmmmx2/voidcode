source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def rope_dot(self, q, k, m, n, base):\n\
  \        return sum(a * b for a, b in zip(self._rot(q, m, base), self._rot(k, n, base)))\n\n    def\
  \ _rot(self, x, pos, base):\n        d = len(x)\n        out = [0.0] * d\n        for i in range(d //\
  \ 2):\n            theta = base ** (-2.0 * i / d)\n            a = pos * theta\n            c, s = math.cos(a),\
  \ math.sin(a)\n            x0, x1 = x[2 * i], x[2 * i + 1]\n            out[2 * i] = x0 * c - x1 * s\n\
  \            out[2 * i + 1] = x0 * s + x1 * c\n        return out\n"
