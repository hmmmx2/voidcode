slug: iq-implement-auc
title: Compute ROC-AUC on a whiteboard
difficulty: medium
categories:
- ML
concepts:
- loss_functions
description: 'Given `y_true` (0/1 labels) and `y_score` (any real-valued scores, higher meaning more positive),
  return the ROC-AUC.


  **Do not build the curve.** Do not sweep thresholds. There is a closed form that needs one sort, and
  finding it is the question.


  AUC is the probability that a randomly chosen positive scores above a randomly chosen negative, with
  ties counting as half. Written that way it is a rank statistic, and the Mann-Whitney U identity gives
  it to you directly:


  `AUC = (sum of ranks of positives - n_pos(n_pos + 1) / 2) / (n_pos * n_neg)`


  **Ties matter.** Equal scores must share the average of the ranks they span, or every tied model is
  scored wrongly. Constant-score predictions should give exactly 0.5, and that is one of the tests.


  Return the value rounded to 6 decimal places. If either class is absent, AUC is undefined — return `None`.'
inferred_concepts: true
review_needed: true
order_index: 1
examples:
- input: y_true = [0, 0, 1, 1], y_score = [0.1, 0.4, 0.35, 0.8]
  output: '0.75'
  explanation: Three of the four positive/negative pairs are ordered correctly; (0.4, 0.35) is not. 3/4
    = 0.75.
- input: y_true = [0, 1], y_score = [0.5, 0.5]
  output: '0.5'
  explanation: A tie counts as half, so a constant score gives 0.5.
constraints:
- 1 <= len(y_true) == len(y_score) <= 10^4
- y_true[i] is 0 or 1
- Return None if either class is missing.
- Ties share the average rank.
- Round to 6 decimal places.
- Standard library only -- no numpy, no sklearn.
