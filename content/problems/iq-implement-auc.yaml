source_kind: interview_problem
reference_solution: "class Solution(object):\n    def roc_auc(self, y_true, y_score):\n        n = len(y_true)\n\
  \        n_pos = sum(1 for y in y_true if y == 1)\n        n_neg = n - n_pos\n        if n_pos == 0\
  \ or n_neg == 0:\n            return None\n\n        # Rank by score, averaging ranks across ties.\n\
  \        order = sorted(range(n), key=lambda i: y_score[i])\n        ranks = [0.0] * n\n        i =\
  \ 0\n        while i < n:\n            j = i\n            while j + 1 < n and y_score[order[j + 1]]\
  \ == y_score[order[i]]:\n                j += 1\n            average = (i + j) / 2.0 + 1.0\n       \
  \     for k in range(i, j + 1):\n                ranks[order[k]] = average\n            i = j + 1\n\n\
  \        rank_sum = sum(ranks[i] for i in range(n) if y_true[i] == 1)\n        return (rank_sum - n_pos\
  \ * (n_pos + 1) / 2.0) / (n_pos * n_neg)\n"
