source_kind: problem
reference_solution: "class Solution(object):\n    def nms(self, boxes, scores, threshold):\n        def\
  \ iou(a, b):\n            x1 = max(a[0], b[0]); y1 = max(a[1], b[1])\n            x2 = min(a[2], b[2]);\
  \ y2 = min(a[3], b[3])\n            inter = max(0.0, x2 - x1) * max(0.0, y2 - y1)\n            area_a\
  \ = max(0.0, a[2] - a[0]) * max(0.0, a[3] - a[1])\n            area_b = max(0.0, b[2] - b[0]) * max(0.0,\
  \ b[3] - b[1])\n            union = area_a + area_b - inter\n            return inter / union if union\
  \ > 0 else 0.0\n        order = sorted(range(len(boxes)), key=lambda i: (-scores[i], i))\n        kept\
  \ = []\n        while order:\n            best = order.pop(0)\n            kept.append(best)\n     \
  \       order = [i for i in order if iou(boxes[best], boxes[i]) <= threshold]\n        return kept\n"
