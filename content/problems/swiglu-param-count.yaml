slug: swiglu-param-count
title: A gated FFN has three matrices, not two
difficulty: medium
categories:
- LLM
concepts:
- feedforward_blocks
description: 'Input: `d_model d_ff gated`, where `gated` is 1 or 0.


  A standard FFN is two matrices: `d_model x d_ff` up and `d_ff x d_model` down. A gated variant such
  as SwiGLU adds a third `d_model x d_ff` gate projection.


  Return `params d_ff_for_equal_params`, where the second is the `d_ff` a GATED FFN would need to match
  the parameter count of a NON-gated one at the given `d_ff`, floored to an integer.


  This is why gated models quote `d_ff` around 8/3 of the usual 4x rather than 4x: the third matrix has
  to be paid for somewhere, and it is paid for in width.'
order_index: 68
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def ffn(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().ffn(_p))

    '
reference_solution: "class Solution(object):\n    def ffn(self, tokens):\n        d = int(tokens[0]);\
  \ f = int(tokens[1]); g = int(tokens[2])\n        mult = 3 if g == 1 else 2\n        params = mult *\
  \ d * f\n        equal = int(2 * f / 3)\n        return str(params) + ' ' + str(equal)\n"
