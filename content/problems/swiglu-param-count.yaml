hints:
- 'Non-gated: 2 * d_model * d_ff. Gated: 3 * d_model * d_ff.'
- Equal params means 3 * d * x == 2 * d * d_ff, so x = 2/3 * d_ff.
- 4 * d_model scaled by 2/3 gives the familiar 8/3.
