reference_solution: "class Solution(object):\n    def act(self, tokens):\n        b = float(tokens[0]);\
  \ s = float(tokens[1]); d = float(tokens[2])\n        L = float(tokens[3]); by = float(tokens[4])\n\
  \        gb = b * s * d * L * by * 10 / 1e9\n        return str(round(gb, 2)) + ' ' + str(round(gb *\
  \ 2, 2))\n"
