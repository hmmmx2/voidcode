slug: activation-memory-scaling
title: Activation memory scales with batch and sequence, not parameters
difficulty: medium
categories:
- Systems
- DL
concepts:
- memory_accounting
- gradient_checkpointing
description: 'Input: `batch seq_len d_model n_layers bytes_per_elem`.


  Take activation memory as roughly `batch * seq_len * d_model * n_layers * bytes * 10`, where the factor
  of 10 stands in for the tensors a transformer block keeps live.


  Return the total in GB rounded to 2 decimals, and the GB if `seq_len` doubles, as `gb gb_double_seq`.
  Use 1 GB = 1e9 bytes.


  The point is which knob moves it. Parameters do not appear in this formula at all: a learner who runs
  out of memory reaches for a smaller model when the cheap fix is usually a shorter sequence or a smaller
  batch.'
