    '
reference_solution: "class Solution(object):\n    def token_count(self, width, height, tile, patch, thumbnail):\n\
  \        if width <= 0 or height <= 0 or tile <= 0 or patch <= 0:\n            return 0\n        per_tile\
  \ = (tile // patch) ** 2\n        cols = (width + tile - 1) // tile\n        rows = (height + tile -\
  \ 1) // tile\n        total = cols * rows * per_tile\n        if thumbnail:\n            total += per_tile\n\
  \        return total\n"
