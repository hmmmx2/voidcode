slug: warmup-steps-from-tokens
title: Convert a token budget into optimizer steps
difficulty: easy
categories:
- DL
concepts:
- lr_scheduling
- gradient_accumulation
description: 'Input: `total_tokens_billions batch_size seq_len grad_accum warmup_pct`.


  One optimizer step consumes `batch_size * seq_len * grad_accum` tokens. Return `total_steps warmup_steps`,
  both floored to integers, with warmup being `warmup_pct` percent of the total.


  Gradient accumulation is the part people drop: it multiplies the tokens per STEP, so accumulating over
  8 micro-batches means 8x fewer optimizer steps for the same data. A schedule computed without it warms
  up eight times too slowly and decays to zero long before the run ends.'
order_index: 85
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def steps(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().steps(_p))

    '
reference_solution: "class Solution(object):\n    def steps(self, tokens):\n        tot = float(tokens[0])\
  \ * 1e9\n        b = float(tokens[1]); s = float(tokens[2])\n        acc = float(tokens[3]); pct = float(tokens[4])\n\
  \        per = b * s * acc\n        if per <= 0:\n            return '0 0'\n        total = int(tot\
  \ // per)\n        return str(total) + ' ' + str(int(total * pct / 100))\n"
