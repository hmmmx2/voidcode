slug: iq-patch-embedding-cost
title: Share of a ViT spent in the patch stem
difficulty: medium
categories:
- VLM
- DL
concepts:
- embeddings
- vision_transformer
description: 'Write `stem_share(side, patch, channels, d, layers)`.


  The patch embedding, or stem, is a single linear map with bias from a flattened patch to the model width:


  ```

  n           = (side // patch) ** 2       # tokens, no class token

  patch_dim   = patch * patch * channels

  stem_params = patch_dim * d + d

  stem_flops  = 2 * n * patch_dim * d      # 2 = one multiply plus one add

  ```


  Use these standard per-layer figures for the transformer body:


  ```

  layer_params = 12 * d * d

  layer_flops  = 24 * n * d * d + 4 * n * n * d


  body_params  = layers * layer_params

  body_flops   = layers * layer_flops

  ```


  Return `[stem_params, stem_flops, param_share, flop_share]` where


  ```

  param_share = stem_params / (stem_params + body_params)

  flop_share  = stem_flops  / (stem_flops  + body_flops)

  ```


  `stem_params` and `stem_flops` must be exact integers -- build them with integer arithmetic so nothing
  lands in a float. The driver rounds the two shares to 6 decimals.


  **The FLOP count is the whole question.** The stem touches more raw data than anything else in the network,
  which makes it feel expensive, but it compresses that data once per token with one cheap projection
  and every later layer pays far more. Getting there means multiplying by `n`.


  Tokens use floor division, so a side that is not a multiple of the patch drops the leftover strip.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 29
examples:
- input: side = 224, patch = 14, channels = 3, d = 1024, layers = 24  (ViT-L/14)
  output: '[603136, 308281344, 0.001993, 0.00191]'
  explanation: A 14x14 RGB patch flattens to 588 values, projected to width 1024 for 603136 parameters,
    and 0.31 GFLOP across 256 tokens. The body is 302M parameters and 161 GFLOP, so the stem is two tenths
    of one percent either way.
- input: side = 224, patch = 16, channels = 3, d = 768, layers = 12  (ViT-B/16)
  output: '[590592, 231211008, 0.006905, 0.006617]'
  explanation: A narrower, shallower body raises the stem's share to about 0.7 percent -- larger, still
    not where the time goes.
constraints:
- 1 <= side <= 8192, 1 <= patch <= side, 1 <= channels <= 16
- 1 <= d <= 8192, 1 <= layers <= 128
- Tokens use floor division and there is no class token.
- stem_params and stem_flops are exact integers, not floats.
- Round both shares to 6 decimal places.
- Standard library only -- no numpy, no torch.
