source_kind: interview_problem
reference_solution: "class Solution(object):\n    def stem_share(self, side, patch, channels, d, layers):\n\
  \        n = (side // patch) ** 2\n        patch_dim = patch * patch * channels\n        stem_params\
  \ = patch_dim * d + d\n        stem_flops = 2 * n * patch_dim * d\n        body_params = layers * 12\
  \ * d * d\n        body_flops = layers * (24 * n * d * d + 4 * n * n * d)\n        return [stem_params,\n\
  \                stem_flops,\n                float(stem_params) / float(stem_params + body_params),\n\
  \                float(stem_flops) / float(stem_flops + body_flops)]\n"
