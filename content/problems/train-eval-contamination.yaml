slug: train-eval-contamination
title: How much of your eval set is in the training data?
difficulty: medium
categories:
- ML
concepts:
- dataloading
description: 'Input: `n_train n_eval`, then the `n_train` training ids, then the `n_eval` eval ids.


  Return `n_contaminated pct_of_eval`, where contaminated means an eval id that also appears in training.
  Percentage rounded to 1 decimal place.


  Contamination inflates every evaluation number without breaking anything, so it is invisible in exactly
  the way that matters. Nothing about a contaminated benchmark looks wrong — the score just goes up, and
  the model looks better than it is on data it has already seen.'
order_index: 84
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def contam(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().contam(_p))

    '
reference_solution: "class Solution(object):\n    def contam(self, tokens):\n        nt = int(tokens[0]);\
  \ ne = int(tokens[1])\n        train = set(tokens[2:2 + nt])\n        ev = set(tokens[2 + nt:2 + nt\
  \ + ne])\n        if not ev:\n            return '0 0.0'\n        bad = len(train & ev)\n        return\
  \ str(bad) + ' ' + str(round(bad / len(ev) * 100, 1))\n"
