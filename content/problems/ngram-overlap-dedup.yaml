    '
reference_solution: "class Solution(object):\n    def overlap(self, tokens):\n        n = int(tokens[0])\n\
  \        rest = tokens[1:]\n        if '|' not in rest:\n            return 0.0\n        cut = rest.index('|')\n\
  \        a, b = rest[:cut], rest[cut + 1:]\n        def grams(xs):\n            return {tuple(xs[i:i\
  \ + n]) for i in range(len(xs) - n + 1)} if len(xs) >= n else set()\n        ga, gb = grams(a), grams(b)\n\
  \        if not ga or not gb:\n            return 0.0\n        u = len(ga | gb)\n        return 0.0\
  \ if u == 0 else round(len(ga & gb) / u, 4)\n"
