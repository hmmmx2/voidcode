slug: ngram-overlap-dedup
title: Near-duplicate detection by n-gram overlap
difficulty: medium
categories:
- ML
concepts:
- dataloading
- tokenization
description: 'Input: `n`, then the tokens of document A, then `|`, then the tokens of document B.


  Return the Jaccard similarity of their sets of n-grams, rounded to 4 decimal places: `|A ∩ B| / |A ∪
  B|`.


  Return `0.0` when either document is shorter than `n`, since it produces no n-grams.


  Exact-match deduplication misses the documents that matter most — a training corpus is full of near-duplicates
  that differ by a header or a licence block, and they are what makes a model memorise.'
order_index: 83
