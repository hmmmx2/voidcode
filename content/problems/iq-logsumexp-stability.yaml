source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def streaming_lse(self, tiles):\n   \
  \     m = None\n        s = 0.0\n        for tile in tiles:\n            if not tile:\n            \
  \    continue\n            tm = max(tile)\n            if m is None:\n                m = tm\n     \
  \           s = sum(math.exp(z - m) for z in tile)\n            else:\n                if tm > m:\n\
  \                    s *= math.exp(m - tm)\n                    m = tm\n                s += sum(math.exp(z\
  \ - m) for z in tile)\n        return [m, s, m + math.log(s)]\n"
