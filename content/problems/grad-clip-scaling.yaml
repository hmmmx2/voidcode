  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().clip_scale(float(_p[0]), [float(x) for x in _p[1:]]))

    '
reference_solution: "class Solution(object):\n    def clip_scale(self, max_norm, grads):\n        import\
  \ math\n        norm = math.sqrt(sum(g * g for g in grads))\n        if norm <= max_norm or norm ==\
  \ 0.0:\n            return 1.0\n        return round(max_norm / norm, 6)\n"
