slug: grad-clip-scaling
title: What does clipping actually do to a gradient?
difficulty: medium
categories:
- DL
concepts:
- gradient_clipping
- backpropagation
description: 'Return the factor by which clip-by-global-norm scales a gradient.


  Write `clip_scale(max_norm, grads)`. Compute the global L2 norm across *all* gradients together.

  If it is at or below `max_norm`, return 1.0. Otherwise return `max_norm / norm`, rounded to 6dp.


  **Global, not per-tensor, and the distinction is the question.** Clipping each parameter''s

  gradient separately changes the *direction* of the update: a layer with a large gradient gets

  scaled down more than one with a small gradient, so the step no longer points along the true

  gradient. Global clipping scales everything by one factor, so the direction is preserved and only

  the magnitude changes. That is why `clip_grad_norm_` exists and `clip_grad_value_` is a different,

  blunter tool.


  **What clipping is actually protecting against.** Not large gradients in general — large ones are

  often correct early in training. It is protecting against the rare spike, usually one bad batch,

  that would otherwise take a single enormous step and destroy weights that took hours to learn. A

  clip that fires constantly is not protecting you, it is telling you the learning rate is wrong.


  Return 1.0 for an all-zero gradient rather than dividing by zero.'
