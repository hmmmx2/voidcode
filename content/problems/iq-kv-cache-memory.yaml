source_kind: interview_problem
reference_solution: "class Solution(object):\n    def kv_capacity(self, layers, kv_heads, head_dim, dtype_bytes,\
  \ seq_len, free_bytes):\n        per_token = 2 * layers * kv_heads * head_dim * dtype_bytes\n      \
  \  per_request = per_token * seq_len\n        fits = free_bytes // per_request\n        return [per_token,\
  \ per_request, fits]\n"
