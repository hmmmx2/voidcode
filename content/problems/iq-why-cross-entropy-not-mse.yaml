slug: iq-why-cross-entropy-not-mse
title: Return dL/dz for softmax under two losses
difficulty: medium
categories:
- ML
- DL
concepts:
- numerical_stability
- loss_functions
description: 'Given `logits` (a list of real numbers), an integer `label` (the index of the correct class)
  and `loss` (either `"ce"` or `"mse"`), return `dL/dz` — the gradient of the loss with respect to the
  **logits** — as a list of the same length.


  Let `p = softmax(z)` and let `y` be the one-hot vector with `y[label] = 1`. The Jacobian of the softmax
  is


  ```

  dp_i/dz_j = p_i * (delta_ij - p_j)

  ```


  **`loss == "ce"`** — `L = -log p[label]`, so `dL/dp_i = -y_i / p_i`.


  **`loss == "mse"`** — `L = sum_i (p_i - y_i)**2`, so `dL/dp_i = 2 * (p_i - y_i)`.


  Push each of those through the Jacobian yourself. In one case the `1/p_i` from the log cancels the `p_i`
  in the Jacobian and almost everything disappears. In the other nothing cancels, and the surviving expression
  is what makes the gradient vanish exactly where the model is confidently wrong.


  Edge cases and rounding:


  - Both gradients sum to zero across the coordinates — every row of the Jacobian does. Use that as a
  self-check.

  - `logits` are unnormalised and may be negative.

  - Round every returned value to 6 decimal places.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 14
examples:
- input: logits = [0.0, 0.0, 0.0], label = 0, loss = "ce"
  output: '[-0.666667, 0.333333, 0.333333]'
  explanation: 'p is uniform at 1/3 and y = [1, 0, 0]. Cross-entropy leaves nothing but the difference:
    [1/3 - 1, 1/3, 1/3].'
- input: logits = [0.0, 0.0, 0.0], label = 0, loss = "mse"
  output: '[-0.444444, 0.222222, 0.222222]'
  explanation: 'Same p, but every coordinate keeps a factor of p_j: 2*p_j*((p_j - y_j) - sum_i p_i*(p_i
    - y_i)). Here the weighted sum is 0, leaving 2*(1/3)*(-2/3) = -4/9 and 2*(1/3)*(1/3) = 2/9.'
- input: logits = [6.0, 0.0], label = 1, loss = "mse"
  output: '[0.009842, -0.009842]'
  explanation: The model is confidently wrong (p ~ [0.9975, 0.0025] with the answer being class 1) and
    squared error still produces a gradient of magnitude 0.0098. Cross-entropy on the same input gives
    0.9975 — a hundred times larger.
constraints:
- 2 <= len(logits) <= 10^3
- 0 <= label < len(logits)
- loss is either "ce" or "mse"
- The returned gradient sums to 0.
- Round each value to 6 decimal places.
- Standard library only -- no numpy, no torch.
