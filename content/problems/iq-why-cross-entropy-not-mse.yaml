  template_code: "import math\n\nclass Solution(object):\n    def logit_grad(self, logits, label, loss):\n\
    \        \"\"\"\n        :type logits: List[float]\n        :type label: int\n        :type loss:\
    \ str  -- \"ce\" or \"mse\"\n        :rtype: List[float]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    logits = json.loads(_in[0])

    label = int(_in[1])

    loss = _in[2].strip()

    _r = Solution().logit_grad(logits, label, loss)

    print([round(float(x), 6) + 0.0 for x in _r])

