source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def logit_grad(self, logits, label, loss):\n\
  \        m = max(logits)\n        exps = [math.exp(z - m) for z in logits]\n        s = sum(exps)\n\
  \        p = [e / s for e in exps]\n        d = [p[i] - (1.0 if i == label else 0.0) for i in range(len(p))]\n\
  \        if loss == \"ce\":\n            return d\n        dot = sum(d[i] * p[i] for i in range(len(p)))\n\
  \        return [2.0 * p[j] * (d[j] - dot) for j in range(len(p))]\n"
