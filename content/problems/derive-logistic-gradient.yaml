description: Write the gradient of the mean log-loss for logistic regression with respect to the weights
  and the bias, with an L2 penalty on the weights. One derivative of the sigmoid collapses the whole chain
  rule to a single residual; the traps are that the penalty must not touch the bias, and that a strongly
  negative logit overflows the naive sigmoid.
