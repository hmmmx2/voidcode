abstract: >-
  Deep networks were hard to train because every layer's input distribution shifted as the layers
  below it learned. This paper normalises each layer's pre-activations using the statistics of the
  current mini-batch, then gives the layer two learnable parameters to undo that normalisation if it
  wants to. Training became far less sensitive to initialisation and learning rate — and brought
  with it the one detail that catches everybody, which is that the layer computes something
  different at inference than it does during training.
