source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def gd_analysis(self, eigs, eta, eps):\n\
  \        lo = min(eigs)\n        hi = max(eigs)\n        rho = max(abs(1.0 - eta * e) for e in eigs)\n\
  \        eta_max = 2.0 / hi\n        eta_star = 2.0 / (hi + lo)\n        kappa = hi / lo\n        rate\
  \ = (kappa - 1.0) / (kappa + 1.0)\n        if rate == 0.0:\n            steps = 1\n        else:\n \
  \           steps = int(math.ceil(math.log(eps) / math.log(rate)))\n        return [rho, eta_max, eta_star,\
  \ steps]\n"
