reference_solution: "import math\n\nclass Solution(object):\n    def lr(self, tokens):\n        base =\
  \ float(tokens[0]); warm = int(tokens[1])\n        total = int(tokens[2]); step = int(tokens[3])\n \
  \       if warm > 0 and step < warm:\n            return round(base * step / warm, 6)\n        span\
  \ = max(total - warm, 1)\n        progress = (step - warm) / span\n        progress = min(max(progress,\
  \ 0.0), 1.0)\n        return round(base * 0.5 * (1 + math.cos(math.pi * progress)), 6)\n"
