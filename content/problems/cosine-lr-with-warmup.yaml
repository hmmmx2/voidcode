slug: cosine-lr-with-warmup
title: Learning rate at step n under warmup plus cosine decay
difficulty: medium
categories:
- DL
concepts:
- lr_scheduling
description: "Input: `base_lr warmup_steps total_steps step`. Return the learning rate at `step`, rounded\
  \ to 6 decimal places.\n\nDuring warmup the rate rises linearly from 0 to `base_lr` over `warmup_steps`.\
  \ After that it follows a cosine from `base_lr` down to 0 across the remaining steps:\n\n    progress\
  \ = (step - warmup) / (total - warmup)\n    lr = base_lr * 0.5 * (1 + cos(pi * progress))\n\nClamp `progress`\
  \ into [0,1] so a step past `total_steps` returns 0 rather than rising again — a cosine keeps going,\
  \ and a schedule that turns back up at the end of a long run is a real and confusing bug."
order_index: 45
