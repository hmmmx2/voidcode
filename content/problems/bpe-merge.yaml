slug: bpe-merge
title: Byte-Pair Encoding Merge
difficulty: medium
categories:
- LLM
concepts:
- tokenization
description: 'Perform one merge step of Byte-Pair Encoding, the tokenisation algorithm behind GPT, Llama
  and most modern LLMs.


  Given a sequence of tokens:


  1. Count every **adjacent pair**.

  2. Pick the most frequent pair. On a tie, choose the one whose first occurrence is earliest.

  3. Replace every **non-overlapping** occurrence of that pair, scanning left to right, with the two tokens
  concatenated.


  Non-overlapping is the subtle part: in `[a, a, a]` the pair `(a, a)` appears twice by count, but merging
  left to right consumes the first two and leaves the third alone.


  Return the token sequence after this single merge.'
inferred_concepts: true
review_needed: true
order_index: 7
examples:
- input: tokens = ["l", "o", "w", "l", "o", "w"]
  output: '[''lo'', ''w'', ''lo'', ''w'']'
  explanation: (l,o) and (o,w) both appear twice; (l,o) occurs first, so it wins the tie.
- input: tokens = ["a", "b", "a", "b", "a", "b"]
  output: '[''ab'', ''ab'', ''ab'']'
  explanation: (a,b) appears three times and all three are disjoint, so all are merged.
- input: tokens = ["x", "y", "z"]
  output: '[''xy'', ''z'']'
  explanation: Every pair occurs once, so the earliest one is merged.
constraints:
- 1 <= len(tokens) <= 10^4
- Tokens are non-empty strings.
- If the sequence has fewer than 2 tokens, return it unchanged.
- Merge non-overlapping occurrences, scanning left to right.
- Standard library only -- no numpy, no torch.
hints:
- Two passes. The first counts adjacent pairs and picks a winner; the second rebuilds the sequence. Trying
  to do both at once is where the overlapping-merge bug comes from.
- For the tie-break you need the first index at which each pair appears, so record it as you count rather
  than searching for it afterwards.
- 'Rebuild with a while loop, not a for loop: when you merge at position i you must advance by 2, and
  a for loop cannot skip the token you just consumed.'
hint_ladder:
  level_0: Two passes. The first counts adjacent pairs and picks a winner; the second rebuilds the sequence.
    Trying to do both at once is where the overlapping-merge bug comes from.
  level_1: For the tie-break you need the first index at which each pair appears, so record it as you
    count rather than searching for it afterwards.
  level_2: 'Rebuild with a while loop, not a for loop: when you merge at position i you must advance by
    2, and a for loop cannot skip the token you just consumed.'
