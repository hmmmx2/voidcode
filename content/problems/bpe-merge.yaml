source_kind: problem
reference_solution: "class Solution(object):\n    def bpeMerge(self, tokens):\n        if len(tokens)\
  \ < 2:\n            return list(tokens)\n        counts, first = {}, {}\n        for i in range(len(tokens)\
  \ - 1):\n            pair = (tokens[i], tokens[i + 1])\n            counts[pair] = counts.get(pair,\
  \ 0) + 1\n            if pair not in first:\n                first[pair] = i\n        best = min(counts,\
  \ key=lambda pr: (-counts[pr], first[pr]))\n        out, i = [], 0\n        while i < len(tokens):\n\
  \            if i < len(tokens) - 1 and (tokens[i], tokens[i + 1]) == best:\n                out.append(tokens[i]\
  \ + tokens[i + 1])\n                i += 2\n            else:\n                out.append(tokens[i])\n\
  \                i += 1\n        return out\n"
