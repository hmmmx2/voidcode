slug: iq-implement-stratified-split
title: Split without leaking a user across the boundary
difficulty: medium
categories:
- ML
concepts:
- tensors_and_shapes
description: 'You are given `rows` as a list of `[user_id, label]` pairs and a `test_frac`. Return `[train_ids,
  test_ids]` -- the user ids on each side, each list sorted ascending.


  **A user id must never appear on both sides.** That is the hard constraint. Preserving the class ratio
  is the soft one: with whole users as the unit you often cannot hit it exactly, and that is fine.


  Why that ordering: a leaked user means the model has seen that user''s rows in training and is scored
  on them again in test, so the metric is measuring memorisation. An imperfect class ratio only adds variance
  to a metric that still means what it says. **A biased-but-valid estimate beats a precise invalid one.**


  **The algorithm, exactly** (it must be deterministic -- no `random`):


  1. Group rows by `user_id`. A group''s size is its row count; its positive count is how many of its
  labels are 1.

  2. Sort groups by size **descending**, breaking ties by `user_id` ascending. Largest first matters:
  placing a big group last is what overshoots the target.

  3. Target test size is `test_frac * len(rows)`.

  4. For each group in that order, put it in **test** if the test side is still below its target size,
  otherwise in **train**.


  Standard library only -- no numpy, no sklearn.'
inferred_concepts: true
review_needed: true
order_index: 35
examples:
- input: rows = [[1,1],[1,0],[2,1],[3,0]], test_frac = 0.5
  output: '[[2, 3], [1]]'
  explanation: User 1 has 2 rows, users 2 and 3 have 1 each. Target test size is 2. User 1 is largest
    so it goes to test, filling it. Users 2 and 3 then go to train. Note user 1 is never split.
constraints:
- 1 <= len(rows) <= 10^4
- label is 0 or 1
- 0 < test_frac < 1
- A user_id must appear on exactly one side.
- Deterministic -- no randomness.
- Both returned lists are sorted ascending.
- Standard library only -- no numpy, no sklearn.
