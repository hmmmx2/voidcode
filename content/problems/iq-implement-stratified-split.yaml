source_kind: interview_problem
reference_solution: "class Solution(object):\n    def grouped_split(self, rows, test_frac):\n        sizes\
  \ = {}\n        for uid, _label in rows:\n            sizes[uid] = sizes.get(uid, 0) + 1\n        order\
  \ = sorted(sizes.keys(), key=lambda u: (-sizes[u], u))\n        target = test_frac * len(rows)\n   \
  \     train, test, filled = [], [], 0\n        for uid in order:\n            if filled < target:\n\
  \                test.append(uid)\n                filled += sizes[uid]\n            else:\n       \
  \         train.append(uid)\n        return [sorted(train), sorted(test)]\n"
