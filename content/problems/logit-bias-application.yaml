slug: logit-bias-application
title: Apply a logit bias and see what it does to the tail
difficulty: medium
categories:
- LLM
concepts:
- sampling_decoding
- numerical_stability
description: 'Input: `bias_index bias_value`, then the logits.


  Add `bias_value` to the logit at `bias_index`, softmax the result, and return the probability of that
  token rounded to 4 decimal places.


  A bias of -100 is the conventional way to ban a token, and it works because softmax is exponential:
  -100 in logit space is a factor of e^-100, which underflows to a probability indistinguishable from
  zero. Use the max-subtraction trick or a large positive bias will overflow before it is normalised.


  An out-of-range `bias_index` applies no bias rather than raising.'
order_index: 82
