reference_solution: "import math\n\nclass Solution(object):\n    def bias(self, tokens):\n        i =\
  \ int(tokens[0]); b = float(tokens[1])\n        logits = [float(x) for x in tokens[2:]]\n        if\
  \ not logits:\n            return 0.0\n        if 0 <= i < len(logits):\n            logits[i] += b\n\
  \        m = max(logits)\n        exps = [math.exp(v - m) for v in logits]\n        tot = sum(exps)\n\
  \        if not (0 <= i < len(logits)) or tot == 0:\n            return 0.0\n        return round(exps[i]\
  \ / tot, 4)\n"
