  level_0: Compute bytes per parameter per GPU for each stage, then compare against the budget once.
  level_1: Stage 1 shards optimizer state only. Stage 2 adds gradients. Stage 3 adds parameters.
  level_2: A GiB is 2**30 bytes. Convert once, at the end, rather than per component.
source_kind: problem
order_index: 13
reference_solution: "class Solution(object):\n    OPT_BYTES = {\"adamw\": 12, \"adamw8bit\": 6, \"adafactor\"\
  : 2}\n\n    def lowest_zero_stage(self, params, gpus, gib_per_gpu, optimizer):\n        opt = self.OPT_BYTES[optimizer]\n\
  \        budget = gib_per_gpu * (2 ** 30)\n        for stage in (0, 1, 2, 3):\n            p = 2 / gpus\
  \ if stage == 3 else 2\n            g = 2 / gpus if stage >= 2 else 2\n            o = opt / gpus if\
  \ stage >= 1 else opt\n            if params * (p + g + o) <= budget:\n                return stage\n\
  \        return None\n"
