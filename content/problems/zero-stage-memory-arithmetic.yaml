hints:
- Compute bytes per parameter per GPU for each stage, then compare against the budget once.
- Stage 1 shards optimizer state only. Stage 2 adds gradients. Stage 3 adds parameters.
- A GiB is 2**30 bytes. Convert once, at the end, rather than per component.
