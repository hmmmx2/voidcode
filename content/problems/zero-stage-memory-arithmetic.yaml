slug: zero-stage-memory-arithmetic
title: Which ZeRO stage does this model need?
difficulty: medium
categories:
- Systems
concepts:
- zero_sharding
- memory_accounting
description: 'You are given a model''s parameter count, an optimizer, and a per-GPU memory budget. Return
  the

  **lowest** ZeRO stage that fits, or `None` if no stage does.


  Write `lowest_zero_stage(params, gpus, gib_per_gpu, optimizer)`.


  `optimizer` is one of `"adamw"`, `"adamw8bit"`, or `"adafactor"`. Assume BF16 parameters and

  gradients, and account for these per-parameter costs:


  | component | bytes/param | sharded by |

  |---|---|---|

  | parameters (bf16) | 2 | stage 3 only |

  | gradients (bf16) | 2 | stages 2 and 3 |

  | optimizer state | 12 adamw / 6 adamw8bit / 2 adafactor | stages 1, 2 and 3 |


  Sharded components are divided by `gpus`; unsharded ones are replicated in full on every GPU.

  Stage 0 shards nothing. Ignore activations — this question is about *static* state.


  Return the smallest stage in `0, 1, 2, 3` whose per-GPU total is at or below the budget.


  **Why the answer is not simply "use stage 3".** Each stage buys memory with communication.

  Stage 3 re-gathers parameters on every forward *and* every backward, for every micro-batch, and

  gradient accumulation does not amortise that. On a slow interconnect the extra collectives can

  cost more than the memory saves — so the lowest stage that fits is the right answer, not the

  most aggressive one.

  '
inferred_concepts: false
review_needed: true
