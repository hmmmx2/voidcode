slug: weight-tying-savings
title: What does tying the embedding and output layer save?
difficulty: easy
categories:
- LLM
concepts:
- embeddings
description: 'Input: `vocab_size d_model total_params_millions`.


  Weight tying reuses the input embedding matrix as the output projection, removing one `vocab_size x
  d_model` matrix. Return `saved_millions saved_pct`, the first rounded to 2 decimal places and the percentage
  to 1.


  The saving is large on small models and negligible on large ones, because the embedding is a fixed size
  while the rest of the model grows. That crossover is the whole reason tying is common at 100M and rare
  at 70B.'
order_index: 67
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def tying(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().tying(_p))

    '
reference_solution: "class Solution(object):\n    def tying(self, tokens):\n        v = float(tokens[0]);\
  \ d = float(tokens[1]); tot = float(tokens[2])\n        saved = v * d / 1e6\n        pct = 0.0 if tot\
  \ == 0 else round(saved / tot * 100, 1)\n        return str(round(saved, 2)) + ' ' + str(pct)\n"
