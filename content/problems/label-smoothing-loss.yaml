description: 'Input: `eps true_class`, then the logits for each class.


  Label smoothing replaces the one-hot target with `1 - eps + eps/C` on the true class and `eps/C` elsewhere,
  then takes the cross-entropy against that. Return the loss rounded to 4 decimal places.


  Compute log-softmax with the max-subtraction trick. Exponentiating a large logit directly overflows,
  and the result is `inf` rather than an error — a wrong number, not a crash.'
order_index: 46
