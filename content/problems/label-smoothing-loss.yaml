reference_solution: "import math\n\nclass Solution(object):\n    def loss(self, tokens):\n        eps\
  \ = float(tokens[0]); true = int(tokens[1])\n        logits = [float(x) for x in tokens[2:]]\n     \
  \   c = len(logits)\n        m = max(logits)\n        lse = m + math.log(sum(math.exp(v - m) for v in\
  \ logits))\n        logp = [v - lse for v in logits]\n        total = 0.0\n        for i in range(c):\n\
  \            t = (1 - eps + eps / c) if i == true else (eps / c)\n            total -= t * logp[i]\n\
  \        return round(total, 4)\n"
