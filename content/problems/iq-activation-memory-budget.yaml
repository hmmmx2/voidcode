source_kind: interview_problem
reference_solution: "class Solution(object):\n    def memory_gb(self, n_params, n_layers, d_model, batch,\
  \ seq,\n                  tensors_per_layer, checkpointing):\n        GB = 10 ** 9\n        weights\
  \ = n_params * 2       # bf16\n        grads = n_params * 2         # bf16\n        master = n_params\
  \ * 4        # fp32 master copy\n        optimizer = n_params * 8     # two fp32 moments\n\n       \
  \ tokens = batch * seq\n        one = tokens * d_model * 2   # one d-wide bf16 tensor\n        if checkpointing:\n\
  \            activations = (n_layers + tensors_per_layer) * one\n        else:\n            activations\
  \ = n_layers * tensors_per_layer * one\n\n        total = weights + grads + master + optimizer + activations\n\
  \        return [weights / float(GB), grads / float(GB), master / float(GB),\n                optimizer\
  \ / float(GB), activations / float(GB), total / float(GB)]\n"
