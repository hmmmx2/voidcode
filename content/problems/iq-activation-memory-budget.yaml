slug: iq-activation-memory-budget
title: Size a mixed-precision training memory budget
difficulty: hard
categories:
- DL
- CUDA
concepts:
- mixed_precision
- memory_accounting
description: "Return the training memory breakdown, in GB, for a mixed-precision run with AdamW.\n\n```\n\
  class Solution(object):\n    def memory_gb(self, n_params, n_layers, d_model, batch, seq,\n        \
  \          tensors_per_layer, checkpointing):\n        # -> [weights, grads, master, optimizer, activations,\
  \ total]\n```\n\n**Define `GB = 10**9` bytes** (decimal, not GiB) so the arithmetic is checkable by\
  \ hand.\n\n**Fixed costs**, independent of batch and sequence length:\n\n```\nweights   = n_params *\
  \ 2   # bf16 copy used for the matmuls\ngrads     = n_params * 2   # bf16 gradients\nmaster    = n_params\
  \ * 4   # fp32 master copy the optimizer updates\noptimizer = n_params * 8   # two fp32 moments, 4 bytes\
  \ each\n```\n\nThat is 16 bytes per parameter, so the bf16 weights are one eighth of the fixed bill.\
  \ Reporting only the weights is the mistake this is built to catch.\n\n**Activations.** Let `tokens\
  \ = batch * seq`. One saved d-wide bf16 tensor costs `tokens * d_model * 2` bytes. A layer saves `tensors_per_layer`\
  \ of them (count the `d_ff`-wide FFN intermediate as its own multiple of a d-wide tensor — the caller\
  \ has already folded that into `tensors_per_layer`).\n\n```\none      = tokens * d_model * 2\nif not\
  \ checkpointing:  activations = n_layers * tensors_per_layer * one\nif checkpointing:      activations\
  \ = (n_layers + tensors_per_layer) * one\n```\n\nThe checkpointing rule is exactly that: keep one tensor\
  \ at each of the `n_layers` layer boundaries, plus enough room to rematerialize a single layer's `tensors_per_layer`\
  \ tensors during its backward pass. Note it still grows with depth — a solution that assumes checkpointing\
  \ removes the depth factor entirely gets this wrong.\n\n**Total** is the sum of all five. Return the\
  \ six values in GB, in the order above; the driver rounds each to 6 decimal places.\n\nStandard library\
  \ only -- no numpy, no torch."
inferred_concepts: true
review_needed: true
order_index: 10
examples:
- input: n_params=7000000000, n_layers=32, d_model=4096, batch=8, seq=2048, tensors_per_layer=10, checkpointing=False
  output: '[14.0, 14.0, 28.0, 56.0, 42.949673, 154.949673]'
  explanation: Fixed cost is 7e9 x 16 bytes = 112 GB, already past an 80GB card before a single activation
    is stored. Activations add another 42.9 GB, giving 155 GB against 80 — sharding is a precondition
    here, not an optimization.
- input: same but checkpointing=True
  output: '[14.0, 14.0, 28.0, 56.0, 5.637145, 117.637145]'
  explanation: The activation multiplier drops from 32*10 = 320 d-wide tensors to 32 + 10 = 42, cutting
    42.9 GB to 5.6 GB. The fixed 112 GB does not move, which is why checkpointing alone never rescues
    this configuration.
constraints:
- 1 <= n_params <= 10^12
- 1 <= n_layers <= 200, 1 <= d_model <= 2^16
- 1 <= batch * seq <= 10^7
- 1 <= tensors_per_layer <= 64
- GB means 10^9 bytes.
- Round every returned value to 6 decimal places.
- Standard library only -- no numpy, no torch.
