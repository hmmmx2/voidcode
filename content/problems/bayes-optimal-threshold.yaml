description: Given calibrated probabilities and the cost of a false negative and a false positive, return
  the decision threshold that minimises expected cost, the expected cost under it, and the expected cost
  at 0.5. The answer depends only on the ratio of the two costs, and 0.5 is a special case rather than
  a neutral default.
