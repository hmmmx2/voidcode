slug: quantization-group-overhead
title: What do per-group scales cost you?
difficulty: medium
categories:
- Systems
- CUDA
concepts:
- quantization_schemes
description: "Input: `n_weights bits group_size scale_bits`.\n\nGroup-wise quantization stores one scale\
  \ per group of `group_size` weights. Return `total_bits effective_bits_per_weight`, the second rounded\
  \ to 3 decimal places.\n\n    total = n_weights * bits + ceil(n_weights / group_size) * scale_bits\n\
  \nThis is the arithmetic that makes \"4-bit\" not quite 4 bits. A group size of 128 with 16-bit scales\
  \ adds 0.125 bits per weight — small, and not nothing, and it shrinks as the group grows at the cost\
  \ of accuracy."
order_index: 60
