    '
reference_solution: "import math\n\nclass Solution(object):\n    def overhead(self, tokens):\n       \
  \ n = int(tokens[0]); b = int(tokens[1])\n        g = int(tokens[2]); sb = int(tokens[3])\n        if\
  \ n <= 0 or g <= 0:\n            return '0 0.0'\n        total = n * b + math.ceil(n / g) * sb\n   \
  \     return str(total) + ' ' + str(round(total / n, 3))\n"
