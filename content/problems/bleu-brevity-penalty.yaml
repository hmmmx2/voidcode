slug: bleu-brevity-penalty
title: The brevity penalty, and the degenerate output it stops
difficulty: medium
categories:
- LLM
concepts:
- tokenization
description: 'Input: `candidate_len reference_len`.


  BLEU''s brevity penalty is `1` when the candidate is at least as long as the reference, and `exp(1 -
  r/c)` otherwise. Return it rounded to 4 decimal places.


  Without it, precision-based scoring rewards saying almost nothing: emit a single word you are confident
  about and precision is 1.0. The penalty is what makes a one-word answer score near zero.


  Return `0.0` for a candidate of length 0 — there is nothing to score.'
order_index: 75
