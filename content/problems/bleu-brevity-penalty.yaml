reference_solution: "import math\n\nclass Solution(object):\n    def bp(self, tokens):\n        c = float(tokens[0]);\
  \ r = float(tokens[1])\n        if c <= 0:\n            return 0.0\n        if c >= r:\n           \
  \ return 1.0\n        return round(math.exp(1 - r / c), 4)\n"
