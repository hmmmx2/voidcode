source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def score_stats(self, d_model, n_heads,\
  \ var_q, var_k):\n        d_k = d_model // n_heads\n        sd_raw = math.sqrt(d_k * var_q * var_k)\n\
  \        divisor = math.sqrt(d_k)\n        return [d_k, sd_raw, divisor, sd_raw / divisor]\n"
