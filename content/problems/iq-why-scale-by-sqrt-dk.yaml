slug: iq-why-scale-by-sqrt-dk
title: Size the attention score divisor from head width
difficulty: easy
categories:
- DL
- LLM
concepts:
- attention_scaled_dot
description: 'A transformer of width `d_model` with `n_heads` heads gives each head `d_k = d_model //
  n_heads` dimensions. One raw score is the dot product of a query and a key over those `d_k` dimensions:


  ```

  s = sum_{i=1..d_k} q_i * k_i

  ```


  Assume the components are independent and zero-mean with `Var(q_i) = var_q` and `Var(k_i) = var_k` for
  every `i`. Return `[d_k, sd_raw, divisor, sd_scaled]`:


  - `d_k` — the per-head width, using integer floor division.

  - `sd_raw` — the standard deviation of `s`. Each term has `E[q_i k_i] = 0` and `Var(q_i k_i) = var_q
  * var_k`; the terms are independent so the variances add over all `d_k` of them. Take the square root.

  - `divisor` — what the model divides the score by: `sqrt(d_k)`. This is a constant of the architecture
  and does **not** depend on `var_q` or `var_k`.

  - `sd_scaled` — the standard deviation after dividing, `sd_raw / divisor`.


  `sd_scaled` comes out at exactly 1 when `var_q * var_k == 1`, and only then. Learned projections are
  not unit-variance, so the fixed divisor over- or under-corrects — which is the gap QK-norm closes.


  Round the three floats to 6 decimal places; `d_k` is returned as an integer.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 17
examples:
- input: d_model = 512, n_heads = 8, var_q = 1.0, var_k = 1.0
  output: '[64, 8.0, 8.0, 1.0]'
  explanation: d_k = 64, so Var(s) = 64 * 1 * 1 = 64 and sd_raw = 8. The divisor sqrt(64) = 8 is exactly
    right here, leaving unit standard deviation. Note the divisor is 8, not sqrt(512) = 22.6.
- input: d_model = 768, n_heads = 12, var_q = 4.0, var_k = 1.0
  output: '[64, 16.0, 8.0, 2.0]'
  explanation: The same head width, but Var(s) = 64 * 4 * 1 = 256 so sd_raw = 16. The divisor is still
    sqrt(64) = 8, so the scaled score has standard deviation 2 — the architectural constant under-corrects
    when the components are not unit-variance.
constraints:
- 1 <= n_heads <= d_model <= 2^16
- var_q > 0 and var_k > 0
- d_k is d_model // n_heads (floor division).
- divisor depends only on d_k.
- Round the three floats to 6 decimal places.
- Standard library only -- no numpy, no torch.
