description: 'Write `score_stats(d_model, n_heads, var_q, var_k)` returning the head width, the standard
  deviation of a raw query-key score, the divisor a transformer actually applies, and the standard deviation
  left after dividing. The trap is that the divisor is fixed by the head width alone: it is not derived
  from `d_model`, and it is not whatever value would happen to normalise these particular component variances.'
