slug: autograd-topological-order
title: In what order does backward visit the graph?
difficulty: medium
categories:
- DL
concepts:
- autograd
- backpropagation
description: 'Given a computation graph, return the order in which backward visits its nodes.


  Write `backward_order(edges)` where `edges` is a list of `"a>b"` strings meaning `a`''s output feeds

  `b`. Return the reverse-topological order as a comma-separated string, breaking ties

  alphabetically so the answer is deterministic.


  **Why reverse-topological and not merely reversed.** A node''s gradient is the *sum* over every

  consumer of its output. Visit it before all its consumers have contributed and you propagate a

  partial gradient — which is not an error, it is a wrong number that keeps training. This is why

  a node with two consumers must wait for both, and why simply walking the graph backwards from the

  output is insufficient when the graph branches and rejoins.


  That accumulate-then-propagate rule is the whole of reverse-mode autodiff, and it is what makes a

  residual connection work: `x` feeds both the block and the addition, so its gradient is the sum of

  two paths. Get the ordering wrong and residual networks train subtly worse with nothing to point

  at.'
