    '
reference_solution: "class Solution(object):\n    def backward_order(self, edges):\n        nodes, succ,\
  \ indeg = set(), {}, {}\n        for e in edges:\n            a, b = e.split('>')\n            nodes\
  \ |= {a, b}\n            succ.setdefault(a, []).append(b)\n            indeg[b] = indeg.get(b, 0) +\
  \ 1\n            indeg.setdefault(a, indeg.get(a, 0))\n        ready = sorted(n for n in nodes if indeg.get(n,\
  \ 0) == 0)\n        out, ind = [], dict(indeg)\n        while ready:\n            n = ready.pop(0)\n\
  \            out.append(n)\n            for m in sorted(succ.get(n, [])):\n                ind[m] -=\
  \ 1\n                if ind[m] == 0:\n                    ready.append(m)\n            ready.sort()\n\
  \        return ','.join(reversed(out))\n"
