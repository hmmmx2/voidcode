reference_solution: "class Solution(object):\n    def fits_int8(self, w_min, w_max, bits, tolerance):\n\
  \        levels = 2 ** bits\n        scale = (w_max - w_min) / (levels - 1)\n        return (scale /\
  \ 2.0) <= tolerance\n"
