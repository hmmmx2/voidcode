slug: quantization-error-budget
title: Will INT8 hold this weight range?
difficulty: medium
categories:
- Systems
concepts:
- quantization_basics
- numerical_stability
description: "Given the minimum and maximum weight in a tensor and a target integer width, return the\
  \ maximum\nabsolute quantization error introduced by uniform affine quantization.\n\nWrite `fits_int8(w_min,\
  \ w_max, bits, tolerance)` returning `True` if that error is within\n`tolerance`, else `False`.\n\n\
  Uniform affine quantization maps the range `[w_min, w_max]` onto `2**bits` levels. The step is\n\n \
  \   scale = (w_max - w_min) / (2**bits - 1)\n\nand round-to-nearest puts any weight within `scale /\
  \ 2` of a representable level, so the worst\ncase error is `scale / 2`.\n\n**Outliers are the whole\
  \ problem, and this formula is why.** The error depends only on the\n*range*, not on the distribution\
  \ inside it. One activation outlier at 100x the typical magnitude\nwidens the range by 100x and so multiplies\
  \ every other weight's error by 100 — which is the\nobservation that motivates per-channel scales, and\
  \ the reason AWQ and GPTQ spend their effort on\nchoosing what to keep in higher precision rather than\
  \ on the rounding itself.\n\nReturn a boolean."
