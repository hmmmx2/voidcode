hints:
- 2**bits - 1 intervals, not 2**bits. Eight bits gives 256 levels and therefore 255 steps between the
  extremes.
- Worst-case round-to-nearest error is half a step.
- The answer depends on the range only. Nothing about the distribution inside it enters.
