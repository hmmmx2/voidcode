code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "import math\n\nclass Solution(object):\n    def adam_step(self, params, grads, m, v,\
    \ t, lr, b1, b2, eps):\n        \"\"\"\n        :rtype: List[List[float]]  -- [params, m, v]\n   \
    \     \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    params = json.loads(_in[0])

    grads = json.loads(_in[1])

    m = json.loads(_in[2])

    v = json.loads(_in[3])

    t = int(_in[4])

    lr, b1, b2, eps = [float(x) for x in _in[5].split()]

    _r = Solution().adam_step(params, grads, m, v, t, lr, b1, b2, eps)

    print([[round(x, 6) for x in row] for row in _r])

    '
source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def adam_step(self, params, grads, m,\
  \ v, t, lr, b1, b2, eps):\n        out_p, out_m, out_v = [], [], []\n        for p, g, mi, vi in zip(params,\
  \ grads, m, v):\n            mi = b1 * mi + (1 - b1) * g\n            vi = b2 * vi + (1 - b2) * g *\
  \ g\n            m_hat = mi / (1 - b1 ** t)\n            v_hat = vi / (1 - b2 ** t)\n            p =\
  \ p - lr * m_hat / (math.sqrt(v_hat) + eps)\n            out_p.append(p)\n            out_m.append(mi)\n\
  \            out_v.append(vi)\n        return [out_p, out_m, out_v]\n"
