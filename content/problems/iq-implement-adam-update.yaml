slug: iq-implement-adam-update
title: One Adam step, from memory
difficulty: medium
categories:
- DL
- PyTorch
concepts:
- optimizers_adaptive
description: 'Write a single Adam update. You are given the current parameters, their gradients, the first
  and second moment buffers, and the step number `t` (1-based, already incremented for this step).


  Return `[params, m, v]` after the step, each rounded to 6 decimals.


  **Bias correction is the question.** `m` and `v` start at zero, so early estimates are biased toward
  zero — at `t = 1` with the usual betas, `m` is only 10% of the gradient and `v` is 0.1% of its square.
  Dividing by `1 - beta^t` undoes exactly that. Omitting it gives a first step that is far too small,
  and the error decays over hundreds of steps rather than disappearing.


  The update is:


  ```

  m = b1*m + (1-b1)*g

  v = b2*v + (1-b2)*g*g

  m_hat = m / (1 - b1**t)

  v_hat = v / (1 - b2**t)

  p -= lr * m_hat / (sqrt(v_hat) + eps)

  ```


  **Return the uncorrected `m` and `v`**, not the hatted ones — the buffers that carry to the next step
  are the raw moments. Returning the corrected values compounds the correction and is the most common
  way this is written wrongly.'
inferred_concepts: true
review_needed: true
order_index: 2
examples:
- input: params = [1.0], grads = [0.1], m = [0.0], v = [0.0], t = 1, lr = 0.01
  output: '[[0.99], [0.01], [1e-05]]'
  explanation: At t=1 bias correction makes m_hat equal g exactly, so the step is almost exactly lr regardless
    of the gradient's size.
constraints:
- 1 <= len(params) == len(grads) == len(m) == len(v) <= 10^3
- t >= 1
- Return [params, m, v] with the UNCORRECTED moments.
- Round every value to 6 decimal places.
- Standard library only -- no numpy, no torch.
