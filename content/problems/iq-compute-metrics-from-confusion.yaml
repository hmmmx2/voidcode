source_kind: interview_problem
reference_solution: "class Solution(object):\n    def confusion_metrics(self, n, n_pos, n_flagged, n_tp):\n\
  \        tp = n_tp\n        fp = n_flagged - n_tp\n        fn = n_pos - n_tp\n        tn = n - tp -\
  \ fp - fn\n        accuracy = (tp + tn) / float(n)\n        precision = tp / float(tp + fp) if (tp +\
  \ fp) > 0 else 0.0\n        recall = tp / float(tp + fn) if (tp + fn) > 0 else 0.0\n        if precision\
  \ + recall > 0.0:\n            f1 = 2.0 * precision * recall / (precision + recall)\n        else:\n\
  \            f1 = 0.0\n        baseline = max(n_pos, n - n_pos) / float(n)\n        return [accuracy,\
  \ precision, recall, f1, baseline]\n"
