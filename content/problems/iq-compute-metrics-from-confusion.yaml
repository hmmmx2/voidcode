slug: iq-compute-metrics-from-confusion
title: Score a classifier from four raw counts
difficulty: easy
categories:
- ML
concepts:
- classification_metrics
description: 'Implement `confusion_metrics(n, n_pos, n_flagged, n_tp)`.


  - `n` -- total rows

  - `n_pos` -- rows whose true label is 1

  - `n_flagged` -- rows the model predicted 1

  - `n_tp` -- rows that were both flagged and truly positive


  Recover the four cells first:


  ```

  TP = n_tp

  FP = n_flagged - n_tp

  FN = n_pos - n_tp

  TN = n - TP - FP - FN

  ```


  Return `[accuracy, precision, recall, f1, baseline]`, each rounded to 6 decimal places:


  ```

  accuracy  = (TP + TN) / n

  precision = TP / (TP + FP)

  recall    = TP / (TP + FN)

  f1        = 2 * precision * recall / (precision + recall)

  baseline  = max(n_pos, n - n_pos) / n

  ```


  **Empty denominators return 0.0; they do not raise.** A model that flags nothing has `TP + FP = 0`,
  so precision is `0.0`. An evaluation split with no positives has `TP + FN = 0`, so recall is `0.0`.
  If `precision + recall == 0`, F1 is `0.0`.


  `baseline` is the accuracy of the constant classifier that always predicts the **larger** class, and
  it is the number the other four should be read against. On a 1%-positive problem it is 0.99, so a model
  reporting 0.988 accuracy is losing to a classifier that does nothing at all -- which is the entire reason
  accuracy is the wrong headline metric on an imbalanced problem.


  Standard library only -- no numpy, no sklearn.'
inferred_concepts: false
review_needed: false
order_index: 5
examples:
- input: n = 10000, n_pos = 100, n_flagged = 180, n_tp = 80
  output: '[0.988, 0.444444, 0.8, 0.571429, 0.99]'
  explanation: TP=80, FP=100, FN=20, TN=9800. Accuracy is 9880/10000 = 0.988, which is below the 0.99
    baseline even though the model catches 4 out of every 5 frauds.
- input: n = 10, n_pos = 8, n_flagged = 5, n_tp = 5
  output: '[0.7, 1.0, 0.625, 0.769231, 0.8]'
  explanation: Here the positives are the majority, so the baseline is 8/10 = 0.8. Every flag was correct
    (precision 1.0) but three positives were missed, and 0.7 accuracy still loses to always predicting
    the positive class.
constraints:
- 1 <= n <= 10^7
- 0 <= n_tp <= min(n_pos, n_flagged)
- 0 <= n_pos <= n and 0 <= n_flagged <= n
- An undefined precision, recall or F1 is 0.0, not an error.
- baseline is the majority class rate, which may be the positive class.
- Round each of the five values to 6 decimal places.
- Standard library only -- no numpy, no sklearn.
