slug: iq-vit-token-budget
title: Token count and attention cost across two ViT configurations
difficulty: easy
categories:
- VLM
- CUDA
concepts:
- attention_scaled_dot
- tokenization
- vision_transformer
description: 'Write `token_budget(side_a, patch_a, side_b, patch_b, include_cls)`.


  A square image of `side` pixels is cut into non-overlapping `patch x patch` squares. The grid is `side
  // patch` per axis -- leftover pixels along the right and bottom edges are dropped, so this is floor
  division, not rounding.


  ```

  tokens = (side // patch) ** 2 + (1 if include_cls else 0)

  ```


  Self-attention is quadratic in the token count, so configuration B costs


  ```

  attn_ratio = (tokens_b / tokens_a) ** 2

  ```


  times what configuration A costs. Return `[tokens_a, tokens_b, attn_ratio]`.


  `tokens_a` and `tokens_b` are integers. The driver rounds `attn_ratio` to 6 decimals.


  **The class token** is one extra row that never came from a patch. It is a rounding error at 9216 tokens
  and a real 0.4% at 256, so including it shifts the ratio even though it barely shifts either token count.


  **Order matters.** The ratio is B relative to A, so a configuration B that is smaller than A must give
  a value below 1.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 27
examples:
- input: side_a = 224, patch_a = 14, side_b = 1344, patch_b = 14, include_cls = False
  output: '[256, 9216, 1296.0]'
  explanation: 224 // 14 = 16 giving 16^2 = 256 tokens; 1344 // 14 = 96 giving 96^2 = 9216. Six times
    the side is 36 times the tokens and 36^2 = 1296 times the attention cost.
- input: side_a = 224, patch_a = 14, side_b = 224, patch_b = 7, include_cls = False
  output: '[256, 1024, 16.0]'
  explanation: Halving the patch at fixed resolution quadruples the token count, which is 16x the attention
    cost -- the patch size is the real resolution knob.
constraints:
- 1 <= side_a, side_b <= 8192
- 1 <= patch_a <= side_a and 1 <= patch_b <= side_b
- include_cls is a bool and adds exactly one token to each configuration
- Use floor division for the grid; leftover pixels are dropped.
- The ratio is B relative to A, not A relative to B.
- Round the ratio to 6 decimal places.
- Standard library only -- no numpy, no torch.
