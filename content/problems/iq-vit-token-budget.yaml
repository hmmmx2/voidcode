source_kind: interview_problem
reference_solution: "class Solution(object):\n    def token_budget(self, side_a, patch_a, side_b, patch_b,\
  \ include_cls):\n        extra = 1 if include_cls else 0\n        ta = (side_a // patch_a) ** 2 + extra\n\
  \        tb = (side_b // patch_b) ** 2 + extra\n        ratio = float(tb) / float(ta)\n        return\
  \ [ta, tb, ratio * ratio]\n"
