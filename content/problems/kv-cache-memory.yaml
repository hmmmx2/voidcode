description: 'Write `kv_capacity(layers, kv_heads, head_dim, dtype_bytes, seq_len, free_bytes)` returning
  the cache bytes per token, the bytes one full-length request holds, and how many such requests fit in
  the free memory. Two traps: the factor of 2 for K and V, and keying the width on KV heads rather than
  query heads so grouped-query and multi-query models come out right.'
