slug: recompute-extra-flops
title: What does gradient checkpointing cost in compute?
difficulty: medium
categories:
- Systems
- DL
concepts:
- gradient_checkpointing
description: 'Input: `forward_flops`.


  A normal training step is one forward plus a backward worth roughly two forwards, so 3F. Full gradient
  checkpointing recomputes the forward during the backward pass, adding one more F for 4F total.


  Return `baseline checkpointed overhead_pct`, the first two as given and the percentage rounded to 1
  decimal place.


  The familiar figure is "about 33% more compute", and this is where it comes from: one extra F on a base
  of 3F. It buys an activation-memory reduction that is usually far larger than 33%, which is why the
  trade is normally worth taking.'
order_index: 64
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def extra(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().extra(_p))

    '
reference_solution: "class Solution(object):\n    def extra(self, tokens):\n        f = float(tokens[0])\n\
  \        base = 3 * f; ckpt = 4 * f\n        pct = 0.0 if base == 0 else round((ckpt - base) / base\
  \ * 100, 1)\n        return str(round(base, 2)) + ' ' + str(round(ckpt, 2)) + ' ' + str(pct)\n"
