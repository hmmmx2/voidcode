source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def _bubble(self, stages, microbatches,\
  \ chunks):\n        return float(stages - 1) / float(chunks * microbatches + stages - 1)\n\n    def\
  \ pipeline(self, stages, microbatches, chunks, target):\n        bubble = self._bubble(stages, microbatches,\
  \ chunks)\n        need = float(stages - 1) * (1.0 - target) / (target * chunks)\n        m = int(math.ceil(need))\n\
  \        if m < 1:\n            m = 1\n        while self._bubble(stages, m, chunks) > target:\n   \
  \         m += 1\n        while m > 1 and self._bubble(stages, m - 1, chunks) <= target:\n         \
  \   m -= 1\n        return [bubble, m]\n"
