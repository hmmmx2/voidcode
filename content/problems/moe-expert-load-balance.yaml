reference_solution: "class Solution(object):\n    def load_imbalance(self, counts):\n        total = sum(counts)\n\
  \        if not counts or total == 0:\n            return 0.0\n        ideal = total / len(counts)\n\
  \        return round(max(counts) / ideal, 4)\n"
