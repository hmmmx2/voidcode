slug: moe-expert-load-balance
title: How badly is this MoE router imbalanced?
difficulty: medium
categories:
- LLM
concepts:
- moe_routing
- collective_ops
description: 'Given the token counts routed to each expert in one batch, return the load-imbalance factor:

  the busiest expert''s share divided by the perfectly-balanced share.


  Write `load_imbalance(counts)`. Perfect balance is 1.0. Return 0.0 if no tokens were routed.

  Round to 4 decimal places.


  **Why the maximum and not the variance.** Expert parallelism puts each expert on a different

  device and every device must finish before the all-to-all completes, so **the step is as slow as

  the busiest expert**. Variance describes the distribution; the max describes the wall clock. A

  router with one hot expert and the rest balanced has low variance and terrible throughput.


  **What the number means in practice.** An imbalance of 2.0 on eight experts means one device does

  twice its share while others idle — you are paying for eight devices and getting the throughput of

  roughly four. This is why MoE training carries an auxiliary load-balancing loss at all: without it

  routers collapse onto a few experts early and never recover, because the popular experts get more

  gradient and become more attractive still.


  Token dropping is the other half of the story: with a capacity factor, tokens beyond an expert''s

  limit are simply discarded, so the imbalance stops showing up as slowness and starts showing up as

  quality loss instead — harder to see and worse.'
