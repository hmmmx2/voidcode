reference_solution: "class Solution(object):\n    def decode_throughput(self, params, dtype_bytes, kv_bytes_per_seq,\
  \ batch, bandwidth, efficiency):\n        weight_bytes = params * dtype_bytes\n        bytes_per_step\
  \ = weight_bytes + batch * kv_bytes_per_seq\n        effective = bandwidth * efficiency\n        seconds_per_step\
  \ = bytes_per_step / effective\n        return [bytes_per_step, batch / seconds_per_step, 1000.0 * seconds_per_step]\n"
