slug: iq-decode-throughput-arithmetic
title: Bound decode throughput from memory bandwidth
difficulty: hard
categories:
- LLM
- CUDA
concepts:
- sampling_decoding
description: 'During autoregressive decoding a step produces one token per sequence, and what limits it
  is how fast bytes leave HBM, not arithmetic. Size that bound.


  `decode_throughput(self, params, dtype_bytes, kv_bytes_per_seq, batch, bandwidth, efficiency) -> list`


  | argument | meaning |

  | --- | --- |

  | `params` | parameter count, e.g. `7e9` |

  | `dtype_bytes` | bytes per stored weight (2 for bf16, 1 for int8) |

  | `kv_bytes_per_seq` | KV cache bytes for **one** sequence at its current length |

  | `batch` | sequences decoded together in a single step |

  | `bandwidth` | peak memory bandwidth in bytes/s, e.g. `2e12` |

  | `efficiency` | achieved fraction of peak, in `(0, 1]` |


  Return `[bytes_per_step, tokens_per_s, ms_per_token]`:


  ```

  bytes_per_step   = params * dtype_bytes + batch * kv_bytes_per_seq

  seconds_per_step = bytes_per_step / (bandwidth * efficiency)

  tokens_per_s     = batch / seconds_per_step     # aggregate, all sequences

  ms_per_token     = 1000 * seconds_per_step      # what one user waits

  ```


  **What scales with batch.** Every weight is read once per step and reused across all `batch` sequences,
  so the weight term carries no `batch` factor. A KV cache is private to its sequence and every byte is
  re-read each step, so that term does. This is precisely why batching lifts aggregate throughput without
  lifting per-user latency -- and why the gain flattens once `batch * kv_bytes_per_seq` approaches the
  weight bytes, which is the arithmetic that makes grouped-query attention worth a small quality cost.


  **Compute never appears.** A decode step does roughly `2 * params` FLOPs while moving at least `params
  * dtype_bytes` bytes, so arithmetic intensity sits near 1 FLOP per byte against hardware that wants
  hundreds. Answering this with a FLOP bound gives a number that is wrong by orders of magnitude.


  `bytes_per_step` is printed as an integer; `tokens_per_s` and `ms_per_token` are rounded to 6 decimals.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 24
examples:
- input: params = 7e9, dtype_bytes = 2, kv_bytes_per_seq = 0, batch = 1, bandwidth = 2e12, efficiency
    = 1.0
  output: '[14000000000, 142.857143, 7.0]'
  explanation: 14 GB of bf16 weights at 2 TB/s takes 7 ms, capping a single sequence at about 143 tokens/s.
    Real kernels reach 60-70% of peak, so 90-100 tok/s in practice.
- input: params = 7e9, dtype_bytes = 2, kv_bytes_per_seq = 4e9, batch = 4, bandwidth = 2e12, efficiency
    = 1.0
  output: '[30000000000, 266.666667, 15.0]'
  explanation: Four sequences each dragging a 4 GB cache add 16 GB to the 14 GB of weights. Throughput
    rises only 1.87x for a 4x batch because the cache now outweighs the model.
constraints:
- params > 0 and dtype_bytes > 0
- kv_bytes_per_seq >= 0
- 1 <= batch <= 10^4
- bandwidth > 0 and 0 < efficiency <= 1
- Weight bytes are read once per step, not once per sequence.
- tokens_per_s and ms_per_token rounded to 6 decimal places.
- Standard library only -- no numpy, no torch.
