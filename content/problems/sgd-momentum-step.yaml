code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def sgdStep(self, params, grads, velocity, lr, momentum,\
    \ weight_decay):\n        \"\"\"\n        :type params: List[float]\n        :type grads: List[float]\n\
    \        :type velocity: List[float]\n        :type lr: float\n        :type momentum: float\n   \
    \     :type weight_decay: float\n        :rtype: List[List[float]]  # [new_params, new_velocity]\n\
    \        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    params = json.loads(_in[0]); grads = json.loads(_in[1]); velocity = json.loads(_in[2])

    lr = float(_in[3]); momentum = float(_in[4]); wd = float(_in[5])

    p, v = Solution().sgdStep(params, grads, velocity, lr, momentum, wd)

    print([[round(a, 6) for a in p], [round(b, 6) for b in v]])

    '
source_kind: problem
reference_solution: "class Solution(object):\n    def sgdStep(self, params, grads, velocity, lr, momentum,\
  \ weight_decay):\n        new_v, new_p = [], []\n        for p, g, v in zip(params, grads, velocity):\n\
  \            g = g + weight_decay * p\n            v = momentum * v + g\n            new_v.append(v)\n\
  \            new_p.append(p - lr * v)\n        return [new_p, new_v]\n"
