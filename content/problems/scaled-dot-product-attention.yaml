slug: scaled-dot-product-attention
title: Scaled Dot-Product Attention
difficulty: medium
categories:
- DL
- LLM
concepts:
- attention_scaled_dot
description: 'Implement the operation at the centre of every transformer:


  `Attention(Q, K, V) = softmax(Q @ K.T / sqrt(d_k)) @ V`


  Two details carry most of the marks.


  **The scale.** Dividing by `sqrt(d_k)` is not cosmetic. Dot products grow with dimension, and without
  the scale the softmax saturates -- one weight goes to 1, the rest to 0, and the gradient vanishes.


  **The causal mask.** When `causal` is true, position `i` may only attend to positions `j <= i`. Masked
  positions must be excluded *before* the softmax so they receive exactly zero weight -- not zeroed afterwards,
  which would leave the row un-normalised.


  Return the output matrix, one row per query.'
inferred_concepts: true
review_needed: true
order_index: 5
examples:
- input: Q = [[1,0]], K = [[1,0],[0,1]], V = [[1,2],[3,4]], causal = false
  output: '[[1.660477, 2.660477]]'
  explanation: The query matches K[0] more strongly, so the output leans toward V[0] without ignoring
    V[1].
- input: Q = [[1,0],[0,1]], K = [[1,0],[0,1]], V = [[1,0],[0,1]], causal = true
  output: '[[1.0, 0.0], [0.330238, 0.669762]]'
  explanation: Row 0 can only see position 0, so its weight is exactly 1. Row 1 sees both.
- input: Q = [[0,0]], K = [[1,2],[3,4]], V = [[5,6],[7,8]], causal = false
  output: '[[6.0, 7.0]]'
  explanation: A zero query gives every score 0, so attention is uniform and the output is the mean of
    V.
constraints:
- 1 <= len(Q), len(K) <= 512, and len(K) == len(V)
- Q and K share the same feature dimension d_k.
- When causal is true, position i attends only to j <= i.
- Return values rounded to 6 decimal places.
- Standard library only -- no numpy, no torch.
hints:
- 'Build it in three stages and check each: the score matrix Q @ K.T scaled by sqrt(d_k), then a softmax
  over each row, then the weighted sum of V rows.'
- Reuse the numerically stable softmax from the first problem -- subtract the row max before exponentiating.
  Attention scores are exactly where overflow shows up in practice.
- For the causal mask, skip masked positions entirely when taking the row max and give them an exponential
  of 0. Setting their score to -inf works too; setting the WEIGHT to 0 after the softmax does not, because
  the row no longer sums to 1.
hint_ladder:
  level_0: 'Build it in three stages and check each: the score matrix Q @ K.T scaled by sqrt(d_k), then
    a softmax over each row, then the weighted sum of V rows.'
  level_1: Reuse the numerically stable softmax from the first problem -- subtract the row max before
    exponentiating. Attention scores are exactly where overflow shows up in practice.
  level_2: For the causal mask, skip masked positions entirely when taking the row max and give them an
    exponential of 0. Setting their score to -inf works too; setting the WEIGHT to 0 after the softmax
    does not, because the row no longer sums to 1.
