code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "import math\n\nclass Solution(object):\n    def attention(self, Q, K, V, causal):\n\
    \        \"\"\"\n        :type Q: List[List[float]]\n        :type K: List[List[float]]\n        :type\
    \ V: List[List[float]]\n        :type causal: bool\n        :rtype: List[List[float]]\n        \"\"\
    \"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    Q = json.loads(_in[0]); K = json.loads(_in[1]); V = json.loads(_in[2])

    causal = _in[3].strip().lower() == "true"

    print([[round(v, 6) for v in row] for row in Solution().attention(Q, K, V, causal)])

    '
source_kind: problem
reference_solution: "import math\nclass Solution(object):\n    def attention(self, Q, K, V, causal):\n\
  \        d = len(Q[0])\n        scale = math.sqrt(d)\n        out = []\n        for i, q in enumerate(Q):\n\
  \            scores = []\n            for j, k in enumerate(K):\n                if causal and j > i:\n\
  \                    scores.append(None)\n                else:\n                    scores.append(sum(a\
  \ * b for a, b in zip(q, k)) / scale)\n            valid = [s for s in scores if s is not None]\n  \
  \          m = max(valid)\n            exps = [0.0 if s is None else math.exp(s - m) for s in scores]\n\
  \            total = sum(exps)\n            weights = [e / total for e in exps]\n            out.append([sum(w\
  \ * V[j][c] for j, w in enumerate(weights))\n                        for c in range(len(V[0]))])\n \
  \       return out\n"
