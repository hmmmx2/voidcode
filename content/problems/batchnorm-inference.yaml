slug: batchnorm-inference
title: BatchNorm at Inference
difficulty: medium
categories:
- TensorFlow
- DL
concepts:
- normalization_layers
description: 'Implement BatchNorm in inference mode.


  `y = (x - running_mean) / sqrt(running_var + eps) * gamma + beta`


  **Compare this with LayerNorm, which you have already written.** LayerNorm computes its statistics from
  the sample in front of it, across features. BatchNorm normalises **per feature, across the batch** --
  so at inference, where the batch may be a single example, it cannot compute anything. It uses statistics
  accumulated during training instead.


  That is the whole reason BatchNorm has a train mode and an eval mode, and why forgetting `model.eval()`
  silently changes your predictions.


  `running_mean`, `running_var`, `gamma` and `beta` all hold one entry **per feature** -- one per column
  of `x`, not per row.'
inferred_concepts: true
review_needed: true
order_index: 12
examples:
- input: x = [[1,2],[3,4]], running_mean = [2,3], running_var = [1,1], gamma = [1,1], beta = [0,0], eps
    = 1e-5
  output: '[[-0.999995, -0.999995], [0.999995, 0.999995]]'
  explanation: Each column uses its own statistic. Not exactly 1, because eps sits inside the sqrt.
- input: x = [[5.0]], running_mean = [5.0], running_var = [4.0], gamma = [1.0], beta = [0.0], eps = 1e-5
  output: '[[0.0]]'
  explanation: A batch of one. BatchNorm still works, because at inference it never looks at the batch.
- input: x = [[0,0]], running_mean = [0,0], running_var = [1,1], gamma = [2,3], beta = [1,-1], eps = 1e-5
  output: '[[1.0, -1.0]]'
  explanation: Normalised to zero, so the output is just beta. gamma has nothing to scale.
constraints:
- 1 <= len(x) <= 10^3 rows, 1 <= len(x[0]) <= 10^3 features
- len(running_mean) == len(running_var) == len(gamma) == len(beta) == number of features
- 0 < eps <= 1e-3
- Use the running statistics as given -- do not compute any statistic from x.
- Return values rounded to 6 decimal places.
- Standard library only -- no numpy, no torch.
hints:
- The parameters are indexed by COLUMN, not row. For x[i][j], every statistic you need sits at index j.
- Nothing here is computed from x itself. If you find yourself taking a mean of anything, you have written
  the training-mode path.
- 'For each element: (v - running_mean[j]) / sqrt(running_var[j] + eps), then * gamma[j] + beta[j]. eps
  goes inside the sqrt, exactly as in LayerNorm.'
hint_ladder:
