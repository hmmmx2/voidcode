- language: Python
  judge0_language_id: 71
  template_code: "import math\n\nclass Solution(object):\n    def batchNorm(self, x, running_mean, running_var,\
    \ gamma, beta, eps):\n        \"\"\"\n        :type x: List[List[float]]\n        :type running_mean:\
    \ List[float]\n        :type running_var: List[float]\n        :type gamma: List[float]\n        :type\
    \ beta: List[float]\n        :type eps: float\n        :rtype: List[List[float]]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    x = json.loads(_in[0]); rm = json.loads(_in[1]); rv = json.loads(_in[2])

    gamma = json.loads(_in[3]); beta = json.loads(_in[4]); eps = float(_in[5])

    print([[round(v, 6) for v in row] for row in Solution().batchNorm(x, rm, rv, gamma, beta, eps)])

    '
source_kind: problem
reference_solution: "import math\nclass Solution(object):\n    def batchNorm(self, x, running_mean, running_var,\
  \ gamma, beta, eps):\n        out = []\n        for row in x:\n            new_row = []\n          \
  \  for j, v in enumerate(row):\n                norm = (v - running_mean[j]) / math.sqrt(running_var[j]\
  \ + eps)\n                new_row.append(norm * gamma[j] + beta[j])\n            out.append(new_row)\n\
  \        return out\n"
