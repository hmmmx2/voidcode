description: 'Write `roofline(flops, bytes_moved, peak_flops, peak_bw)` returning the kernel''s arithmetic
  intensity, the fraction of peak arithmetic throughput it can actually reach, and whether it is memory
  or compute bound. The trap is the clamp: the bandwidth roof keeps sloping upward forever, so a kernel
  well above the ridge point must not report four times peak.'
