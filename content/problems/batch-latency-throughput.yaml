slug: batch-latency-throughput
title: Which batch size meets the latency SLO?
difficulty: medium
categories:
- LLM
concepts:
- serving_latency
- continuous_batching
description: 'Given a p99 latency budget and a linear latency model, return the largest batch size that
  still

  meets the SLO.


  Write `best_batch(slo_ms, base_ms, per_item_ms, candidates)` where latency is modelled as

  `base_ms + per_item_ms * batch`. Return the largest candidate meeting the budget, or 0 if none do.


  **Why the largest rather than the fastest.** Throughput rises with batch size and latency rises

  with it too, so there is no batch that optimises both — the question is always "the most

  throughput I can buy without breaking the latency promise". Picking the smallest batch minimises

  latency and wastes the accelerator; picking the largest maximises throughput and breaks the SLO.

  The answer is the boundary, and finding it is the job.


  **Where the linear model stops being true, which is worth knowing before you trust it.** Decode is

  memory-bandwidth-bound, so small batches are nearly free — the weights are read once regardless,

  and adding a sequence costs almost nothing until the batch is large enough to become

  compute-bound. Real curves are therefore flat then steep, and a linear fit over-charges small

  batches and under-charges large ones. Continuous batching complicates it further by letting

  sequences join and leave mid-flight, so the "batch size" is not constant for any request''s

  lifetime.'
