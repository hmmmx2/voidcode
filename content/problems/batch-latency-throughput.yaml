reference_solution: "class Solution(object):\n    def best_batch(self, slo_ms, base_ms, per_item_ms, candidates):\n\
  \        ok = [b for b in candidates if base_ms + per_item_ms * b <= slo_ms]\n        return max(ok)\
  \ if ok else 0\n"
