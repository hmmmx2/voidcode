    '
reference_solution: "class Solution(object):\n    def net(self, tokens):\n        g = int(tokens[0]);\
  \ a = float(tokens[1]); dc = float(tokens[2])\n        if a >= 1:\n            exp = float(g + 1)\n\
  \        elif a <= 0:\n            exp = 1.0\n        else:\n            exp = (1 - a ** (g + 1)) /\
  \ (1 - a)\n        cost = 1 + g * dc\n        net = 0.0 if cost <= 0 else exp / cost\n        return\
  \ ' '.join([str(round(exp, 3)), str(round(cost, 3)),\n                         str(round(net, 2))])\n"
