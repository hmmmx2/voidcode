slug: speculative-net-speedup
title: 'Speculative decoding: net speedup after paying for the draft'
difficulty: hard
categories:
- Systems
- LLM
concepts:
- speculative_decoding
- serving_latency
description: 'Input: `gamma accept_rate draft_cost_ratio`.


  With `gamma` speculated tokens per round and per-token acceptance `a`, the expected accepted tokens
  per round is `(1 - a**(gamma+1)) / (1 - a)` for `a < 1`, and `gamma + 1` when `a == 1`.


  Each round costs one target forward plus `gamma * draft_cost_ratio` target-equivalents. Return `expected_tokens
  cost net_speedup`, rounded to 3, 3 and 2 decimals.


  Net speedup is expected tokens over cost. A draft model that is too slow or too inaccurate makes this
  **less than 1**, and the arithmetic should show that plainly rather than assuming speculation always
  helps.'
order_index: 87
