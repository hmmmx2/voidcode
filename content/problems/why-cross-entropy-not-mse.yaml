description: Write `logit_grad(logits, label, loss)` returning the gradient of the loss with respect to
  the logits for a softmax head scored either by cross-entropy or by squared error. One of them collapses
  to a single subtraction because the log cancels the Jacobian; the other keeps every term of `diag(p)
  - p p^T`, and returning `p - y` for both is the trap.
