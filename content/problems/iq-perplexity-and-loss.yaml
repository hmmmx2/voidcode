source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def eval_metrics(self, logprobs, n_bytes):\n\
  \        total = -sum(logprobs)\n        loss = total / len(logprobs)\n        ppl = math.exp(loss)\n\
  \        bpb = total / (n_bytes * math.log(2.0))\n        return [loss, ppl, bpb]\n"
