slug: iq-perplexity-and-loss
title: Turn log-likelihoods into perplexity and bits-per-byte
difficulty: medium
categories:
- LLM
concepts:
- sampling_decoding
- loss_functions
description: 'A language-model eval reports a loss and a perplexity, and those two numbers are one quantity
  in different clothes. Compute both, plus the version that survives a change of tokeniser.


  `eval_metrics(self, logprobs, n_bytes) -> list`


  `logprobs[i]` is `log p(x_i | x_<i)` in **nats** (natural log, so every entry is `<= 0`). `n_bytes`
  is the number of UTF-8 bytes the same text occupies.


  Return `[loss_nats, perplexity, bits_per_byte]`, each rounded to 6 decimals:


  ```

  total         = -sum(logprobs)                 # total negative log-likelihood, nats

  loss_nats     = total / len(logprobs)          # per TOKEN

  perplexity    = exp(loss_nats)

  bits_per_byte = total / (n_bytes * log(2))     # per BYTE, in bits

  ```


  **Base.** `exp` applies to a loss in nats; `2**L` applies to a loss in bits. `L` nats equals `L / log(2)`
  bits, and the two conventions agree only when the base matches the unit. Applying `2**L` to a loss in
  nats produces a number that looks entirely reasonable and is wrong.


  **Normaliser.** Perplexity is per token; bits-per-byte is per byte. Divide the *total* by `n_bytes`
  -- not the per-token loss, which is already divided by a different denominator. The two differ by exactly
  the tokeniser''s bytes-per-token ratio, and that ratio is the whole reason bits-per-byte exists: a model
  with a larger vocabulary spends fewer tokens on the same text, so each token carries more information
  and perplexity rises with no change in modelling quality, while bits-per-byte is unmoved because the
  byte count is a property of the text, not of the tokeniser.


  **Reading the number.** Perplexity is an effective branching factor -- the model is as uncertain as
  if picking uniformly among that many tokens. A uniform model over a vocabulary of size `V` scores exactly
  `V`, which gives the standard sanity check: an untrained run on a 32k vocabulary should start near `loss
  = log(32000) = 10.37` nats. One hidden case is exactly that check.


  `len(logprobs) >= 1` and `n_bytes >= 1`, so neither denominator is zero.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 25
examples:
- input: logprobs = [-2.5, -2.5], n_bytes = 8
  output: '[2.5, 12.182494, 0.901684]'
  explanation: Loss is 2.5 nats, so perplexity is e^2.5 = 12.18 -- as uncertain as a uniform choice among
    about 12 tokens. The 5 nats of total surprise spread over 8 bytes is 5/(8*ln 2) = 0.9 bits per byte.
- input: logprobs = [-0.6931471805599453], n_bytes = 1
  output: '[0.693147, 2.0, 1.0]'
  explanation: One token at probability 1/2 costs ln 2 nats, which is exactly 1 bit, and it covers exactly
    1 byte -- so perplexity is exactly 2 and bits-per-byte exactly 1.
constraints:
- 1 <= len(logprobs) <= 10^5
- logprobs[i] <= 0 (natural log, nats)
- 1 <= n_bytes <= 10^7
- bits_per_byte normalises the TOTAL by bytes, not the per-token loss.
- Round each returned value to 6 decimal places.
- Standard library only -- no numpy, no torch.
