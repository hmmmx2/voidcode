slug: iq-implement-grad-clip
title: Clip gradients by global norm
difficulty: easy
categories:
- DL
- PyTorch
concepts:
- normalization_layers
- backpropagation
description: 'Given a list of gradient tensors (each a flat list of floats) and a `max_norm`, clip them
  **by global norm** and return the result, each value rounded to 6 decimals.


  The global norm is the L2 norm over *every* element of *every* tensor, as if they were one long vector:


  `total = sqrt(sum(g*g for tensor in grads for g in tensor))`


  If `total <= max_norm`, return the gradients unchanged. Otherwise scale **every** tensor by the same
  factor `max_norm / total`.


  **One scale factor for all of them is the whole point.** Clipping each tensor to its own norm, or clamping
  element-wise, changes the direction of the update — you are no longer descending the gradient, you are
  descending something else that happens to be shorter. Scaling by a single scalar preserves direction
  exactly and only shortens the step.


  Return `[]` for an empty input, and treat a total norm of exactly 0 as nothing to do.'
inferred_concepts: true
review_needed: true
order_index: 3
examples:
- input: grads = [[3.0, 4.0]], max_norm = 5.0
  output: '[[3.0, 4.0]]'
  explanation: The norm is exactly 5.0, which is not above the limit, so nothing changes.
- input: grads = [[3.0, 4.0]], max_norm = 1.0
  output: '[[0.6, 0.8]]'
  explanation: Norm 5.0 scaled by 1/5 — same direction, length 1.
constraints:
- 0 <= number of tensors <= 100
- max_norm > 0
- Scale ALL tensors by one factor, or not at all.
- Round to 6 decimal places.
- Standard library only -- no numpy, no torch.
