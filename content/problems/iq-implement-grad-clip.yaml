    \   \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    grads = json.loads(_in[0])

    max_norm = float(_in[1])

    _r = Solution().clip_grad_norm(grads, max_norm)

    print([[round(x, 6) for x in t] for t in _r])

