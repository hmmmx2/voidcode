source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def clip_grad_norm(self, grads, max_norm):\n\
  \        total = math.sqrt(sum(g * g for t in grads for g in t))\n        if total <= max_norm or total\
  \ == 0.0:\n            return [list(t) for t in grads]\n        scale = max_norm / total\n        return\
  \ [[g * scale for g in t] for t in grads]\n"
