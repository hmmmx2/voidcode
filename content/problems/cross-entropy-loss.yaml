slug: cross-entropy-loss
title: Cross-Entropy Loss
difficulty: easy
categories:
- ML
- DL
concepts:
- loss_functions
description: 'Given a batch of predicted probability distributions and the correct class index for each
  row, return the mean cross-entropy loss.


  For a single example the loss is `-log(p[correct_class])`. Only the probability assigned to the true
  class contributes -- every other entry in the row is ignored.


  A model that is confidently wrong assigns the true class a probability of 0, and `log(0)` is undefined.
  **Clamp the probability to a minimum of 1e-12** before taking the log, which is what every framework
  does internally.


  Return the mean over the batch.'
inferred_concepts: true
review_needed: true
order_index: 2
examples:
- input: probs = [[0.7, 0.2, 0.1], [0.1, 0.8, 0.1]], labels = [0, 1]
  output: '0.289909'
  explanation: -(log(0.7) + log(0.8)) / 2. Only the probability of the labelled class is used.
- input: probs = [[0.25, 0.25, 0.25, 0.25]], labels = [2]
  output: '1.386294'
  explanation: A uniform distribution over 4 classes gives -log(0.25) = log(4).
- input: probs = [[1.0, 0.0], [0.0, 1.0]], labels = [0, 1]
  output: '0.0'
  explanation: Perfectly confident and correct on both examples, so the loss is zero.
constraints:
- 1 <= len(probs) <= 10^3
- 2 <= len(probs[i]) <= 10^3
- 0 <= labels[i] < len(probs[i])
- Each row of probs sums to approximately 1.
- Clamp probabilities to a minimum of 1e-12 before taking the log.
- Standard library only -- no numpy, no torch.
hints:
- You do not need the whole row. For example i, the only value that matters is probs[i][labels[i]].
- Accumulate -log(p) for each example, then divide by the number of examples. Watch what happens when
  p is exactly 0.
- 'Use max(p, 1e-12) before math.log. Without it a confidently wrong prediction raises ValueError: math
  domain error rather than producing a large loss.'
hint_ladder:
  level_0: You do not need the whole row. For example i, the only value that matters is probs[i][labels[i]].
  level_1: Accumulate -log(p) for each example, then divide by the number of examples. Watch what happens
