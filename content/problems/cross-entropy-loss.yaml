  template_code: "import math\n\nclass Solution(object):\n    def crossEntropy(self, probs, labels):\n\
    \        \"\"\"\n        :type probs: List[List[float]]\n        :type labels: List[int]\n       \
    \ :rtype: float\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    probs = json.loads(_in[0]); labels = json.loads(_in[1])

    print(round(Solution().crossEntropy(probs, labels), 6))

    '
source_kind: problem
reference_solution: "import math\nclass Solution(object):\n    def crossEntropy(self, probs, labels):\n\
  \        total = 0.0\n        for row, label in zip(probs, labels):\n            p = max(row[label],\
  \ 1e-12)\n            total += -math.log(p)\n        return total / len(labels)\n"
