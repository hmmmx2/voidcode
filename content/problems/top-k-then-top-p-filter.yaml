slug: top-k-then-top-p-filter
title: Apply top-k and top-p together, in the right order
difficulty: medium
categories:
- LLM
concepts:
- sampling_decoding
description: 'Input: `k p`, then the probabilities of each token (already normalised, in arbitrary order).


  Apply top-k first, then top-p to what survives. Return the number of tokens kept.


  Top-p keeps the smallest set whose cumulative probability, taken in descending order, **first reaches
  or exceeds p** — so the token that crosses the threshold is included. `k = 0` means no k filter.


  Order matters and the two do not commute: k caps the candidate count regardless of confidence, p adapts
  to it. Applying p first and then k can keep a different set.'
order_index: 62
