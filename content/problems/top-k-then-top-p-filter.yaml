    '
reference_solution: "class Solution(object):\n    def filter(self, tokens):\n        k = int(tokens[0]);\
  \ p = float(tokens[1])\n        probs = sorted((float(x) for x in tokens[2:]), reverse=True)\n     \
  \   if not probs:\n            return 0\n        if k > 0:\n            probs = probs[:k]\n        run\
  \ = 0.0\n        for i, v in enumerate(probs):\n            run += v\n            if run >= p:\n   \
  \             return i + 1\n        return len(probs)\n"
