reference_solution: "class Solution(object):\n    def comm_bytes(self, seq_len, d_model, tp_degree, layers,\
  \ dtype_bytes):\n        payload = seq_len * d_model * dtype_bytes\n        return int(2 * layers *\
  \ (2 * (tp_degree - 1) / tp_degree) * payload)\n"
