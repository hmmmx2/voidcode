slug: tensor-parallel-comm-volume
title: How much does tensor parallelism communicate?
difficulty: medium
categories:
- Systems
concepts:
- tensor_parallel
- collective_ops
description: 'Return the bytes moved per forward pass by tensor parallelism.


  Write `comm_bytes(seq_len, d_model, tp_degree, layers, dtype_bytes)`.


  Tensor parallelism shards the attention heads and the FFN hidden dimension across ranks. Each

  transformer layer therefore needs **two all-reduces** in the forward pass — one after the attention

  output projection, one after the FFN down projection — each over an activation of

  `seq_len * d_model * dtype_bytes`.


  A ring all-reduce moves `2*(N-1)/N` times the payload. Return the total as an integer (truncated).


  **Why this is the parallelism that hates a slow interconnect most.** Data parallelism communicates

  gradients *once per optimizer step*, and gradient accumulation amortises it further. Tensor

  parallelism communicates activations **twice per layer, every micro-batch** — for a 28-layer model

  that is 56 collectives per forward where data parallelism has one per step.


  That is why TP is normally kept inside a node with NVLink and DP spans nodes, and why measuring

  your interconnect before choosing is not optional. At the 22.11 GB/s this project measured over

  PCIe, TP across those cards would spend more time communicating than computing.'
