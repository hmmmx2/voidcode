reference_solution: "class Solution(object):\n    def opt(self, tokens):\n        n = float(tokens[0]);\
  \ t = float(tokens[1])\n        if n <= 0:\n            return '0.0 0.0 undertrained'\n        opt =\
  \ 20 * n\n        ratio = round(t / n, 1)\n        if ratio < 16:\n            v = 'undertrained'\n\
  \        elif ratio > 24:\n            v = 'overtrained'\n        else:\n            v = 'optimal'\n\
  \        return str(round(opt, 1)) + ' ' + str(ratio) + ' ' + v\n"
