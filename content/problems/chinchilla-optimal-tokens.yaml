slug: chinchilla-optimal-tokens
title: Compute-optimal tokens for a parameter budget
difficulty: medium
categories:
- LLM
- ML
concepts:
- memory_accounting
description: 'Input: `n_params_billions tokens_billions`.


  The compute-optimal heuristic is about 20 tokens per parameter. Return the optimal token count in billions,
  the ratio you actually have, and a one-word verdict `undertrained`, `optimal` or `overtrained`, as `optimal_b
  ratio verdict`.


  Ratio is rounded to 1 decimal place; `optimal` means the ratio is within 20% of 20.


  The heuristic answers "best loss for a fixed TRAINING budget" and says nothing about inference cost
  — which is why production models are deliberately overtrained: you pay training once and inference forever.'
order_index: 78
