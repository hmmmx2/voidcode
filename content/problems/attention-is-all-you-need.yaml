abstract: The paper that removed recurrence. It proposes the Transformer, an encoder-decoder built entirely
  from attention and feed-forward layers, and shows it beats recurrent and convolutional models on translation
  while training in a fraction of the time. Nearly every language model since is a descendant of the decoder
  half.
