slug: iq-coalescing-transaction-count
title: Count the sectors a warp actually fetches
difficulty: medium
categories:
- CUDA
concepts:
- memory_coalescing
- warp_divergence
description: "Implement:\n\n```python\nclass Solution(object):\n    def memory_traffic(self, addresses,\
  \ elem_bytes, sector_bytes):\n        ...\n```\n\n`addresses[i]` is the **starting byte address** read\
  \ by lane `i`, and every lane reads `elem_bytes` contiguous bytes from there. Memory is served in aligned\
  \ blocks of `sector_bytes` anchored at address 0: sector `k` covers bytes `[k * sector_bytes, (k + 1)\
  \ * sector_bytes)`. A sector is fetched in full if any lane touches even one byte of it.\n\nReturn `[num_sectors,\
  \ bytes_fetched, efficiency]`:\n\n- `num_sectors` -- the number of distinct sectors the whole warp touches.\
  \ Lane `i` touches every sector from `addresses[i] // sector_bytes` through `(addresses[i] + elem_bytes\
  \ - 1) // sector_bytes`, inclusive.\n- `bytes_fetched = num_sectors * sector_bytes`.\n- `efficiency\
  \ = requested / bytes_fetched`, where `requested` is the number of **distinct** bytes some lane asked\
  \ for. If two lanes read the same byte it counts once. Round to 6 decimal places.\n\n`num_sectors` and\
  \ `bytes_fetched` are exact integers.\n\nEdge cases: `addresses` may be empty, in which case return\
  \ `[0, 0, 0.0]`. Addresses may repeat, may arrive unsorted, and are not guaranteed to be aligned to\
  \ `elem_bytes` or to `sector_bytes`.\n\n**One sector per lane is the wrong model.** A lane can straddle\
  \ a boundary and pay for two sectors, and thirty-two lanes at the same address share one. The whole\
  \ point of the exercise is that `bytes_fetched` is set by the address pattern, not by how many bytes\
  \ the code asked for -- which is why a strided access collapses effective bandwidth even though the\
  \ requested volume never changes.\n\nStandard library only -- no numpy, no torch."
inferred_concepts: true
review_needed: true
order_index: 31
examples:
- input: addresses = [0, 4, 8, ..., 124] (32 lanes), elem_bytes = 4, sector_bytes = 32
  output: '[4, 128, 1.0]'
  explanation: The warp covers bytes 0..127 with no gaps, which is exactly four 32-byte sectors. 128 bytes
    fetched, 128 requested, nothing wasted.
- input: addresses = [0, 4096, 8192, ..., 126976], elem_bytes = 4, sector_bytes = 32
  output: '[32, 1024, 0.125]'
  explanation: 'Each lane''s four bytes land in a sector of its own, so 32 sectors move to deliver 128
    useful bytes: 128/1024 = 0.125, an eightfold waste.'
constraints:
- 0 <= len(addresses) <= 1024
- addresses[i] >= 0; entries may repeat and may be unsorted
- 1 <= elem_bytes <= 16
- sector_bytes is a power of two, 8 <= sector_bytes <= 128
- A lane's bytes may straddle a sector boundary and then cost two sectors.
- requested counts distinct bytes only.
- Return [0, 0, 0.0] for an empty address list.
- Round efficiency to 6 decimal places.
- Standard library only -- no numpy, no torch.
