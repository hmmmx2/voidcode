    addresses = json.loads(_in[0])

    elem_bytes = int(_in[1])

    sector_bytes = int(_in[2])

    _r = Solution().memory_traffic(addresses, elem_bytes, sector_bytes)

    print(json.dumps([_r[0], _r[1], round(_r[2], 6)]))

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def memory_traffic(self, addresses, elem_bytes, sector_bytes):\n\
  \        sectors = set()\n        touched = set()\n        for a in addresses:\n            for b in\
  \ range(a, a + elem_bytes):\n                touched.add(b)\n            first = a // sector_bytes\n\
  \            last = (a + elem_bytes - 1) // sector_bytes\n            for s in range(first, last + 1):\n\
  \                sectors.add(s)\n        n = len(sectors)\n        fetched = n * sector_bytes\n    \
  \    eff = 0.0 if fetched == 0 else float(len(touched)) / float(fetched)\n        return [n, fetched,\
  \ eff]\n"
