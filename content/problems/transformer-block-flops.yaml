reference_solution: "class Solution(object):\n    def block_flops(self, seq_len, d_model, d_ff):\n   \
  \     T, d = seq_len, d_model\n        proj = 4 * 2 * T * d * d\n        score = 2 * 2 * T * T * d\n\
  \        ffn = 2 * 2 * T * d * d_ff\n        total = proj + score + ffn\n        return '%d %s' % (total,\
  \ round(score / total, 4))\n"
