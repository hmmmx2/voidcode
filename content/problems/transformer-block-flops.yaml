slug: transformer-block-flops
title: Where do a block's FLOPs actually go?
difficulty: medium
categories:
- LLM
concepts:
- transformer_block
- multi_head_attention
description: "Return the forward FLOPs of one transformer block and the fraction spent on the attention\n\
  score-and-apply matmuls.\n\nWrite `block_flops(seq_len, d_model, d_ff)` returning `\"<total> <fraction>\"\
  `, the fraction rounded\nto 4 decimal places.\n\nCount a matmul of (m x k) by (k x n) as `2*m*k*n`.\
  \ Three components:\n\n  projections   Q, K, V and O, each `2 * T * d * d`\n  scores        `QK^T` and\
  \ `PV`, each `2 * T * T * d`\n  feed-forward  up and down, each `2 * T * d * d_ff`\n\nIgnore norms,\
  \ softmax and biases — they are O(T*d) and vanish against these.\n\n**Why the fraction, not just the\
  \ total.** Attention is the only term quadratic in `T`; everything\nelse is linear. At short context\
  \ the block is dominated by the FFN and attention is a rounding\nerror, so \"attention is expensive\"\
  \ is simply false there. The crossover is what matters, and it\narrives later than people expect — with\
  \ `d_model` 3584 and `d_ff` 18944, attention does not reach\nhalf the FLOPs until several thousand tokens.\n\
  \nThat is also why FlashAttention is an IO win rather than a FLOP win: it does not reduce this\ncount\
  \ at all. It avoids materialising the `T x T` score matrix in HBM, which is a memory-traffic\nargument,\
  \ and conflating the two is the most common way this gets explained wrongly."
