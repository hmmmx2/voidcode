  template_code: "class Solution(object):\n    def einsum_flops(self, spec, sizes):\n        \"\"\"\n\
    \        :type spec: str    # e.g. \"bij,bjk->bik\"\n        :type sizes: dict  # letter -> dimension\n\
    \        :rtype: int\n        \"\"\"\n"
  driver_code: 'import sys

    _line = sys.stdin.read().strip()

    _spec, _rest = _line.split(None, 1)

    _sizes = {k.strip(): int(v) for k, v in (p.split(''='') for p in _rest.split('',''))}

    print(Solution().einsum_flops(_spec, _sizes))

    '
reference_solution: "class Solution(object):\n    def einsum_flops(self, spec, sizes):\n        lhs, rhs\
  \ = spec.split('->')\n        all_idx = set(''.join(lhs.split(',')))\n        out_idx = set(rhs)\n \
  \       total = 1\n        for i in sorted(all_idx):\n            total *= sizes[i]\n        return\
  \ total * 2 if all_idx - out_idx else total\n"
