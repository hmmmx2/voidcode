slug: einsum-flop-count
title: How many FLOPs is this einsum?
difficulty: medium
categories:
- DL
concepts:
- einsum_notation
- vectorization
description: 'Return the FLOP count of an einsum expression.


  Write `einsum_flops(spec, sizes)` where `spec` is like `"bij,bjk->bik"` and `sizes` maps each index

  letter to its dimension.


  The cost is the size of the **full index space** — the product of every index appearing anywhere —

  times 2 for the multiply-accumulate, when any index is summed over. When no index is summed (the

  output keeps them all, as in an outer product or a pure permutation) there is no accumulation, so

  count 1 per element rather than 2.


  **Why the full index space and not the output size.** The summed indices are the work. `bij,bjk->bik`

  has an output of `b*i*k` but does `b*i*j*k` multiply-adds, because `j` is contracted away. Reading

  cost off the output shape is the most common way an einsum''s expense gets underestimated — the

  expensive part is exactly the part that does not appear in the answer.


  **Which is also why index order matters for real performance, though not for this count.** A

  contraction expressed as one einsum may be executed as a single enormous intermediate, where the

  same computation split into two contractions is dramatically cheaper. `opt_einsum` exists for that

  reason, and the FLOP count here is the *lower bound* a good path achieves, not what a naive one

  costs.'
