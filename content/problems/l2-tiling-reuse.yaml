slug: l2-tiling-reuse
title: How much does tiling reduce memory traffic?
difficulty: hard
categories:
- CUDA
concepts:
- memory_hierarchy
- tiled_matmul
description: 'Input: `n tile`, for an `n x n` by `n x n` matmul.


  Untiled, each output element reads a full row and a full column: `2 * n^3` element reads. Tiled with
  `t x t` blocks, each tile of the output reads `n/t` pairs of tiles, so the traffic is `2 * n^3 / t`
  element reads.


  Return `untiled tiled reduction_factor`, the first two as integers and the factor rounded to 1 decimal
  place.


  The reduction factor IS the tile size, which is the cleanest statement of why tiling works: every element
  loaded into shared memory is reused `t` times before it is evicted. Return `-1 -1 -1.0` when `tile`
  does not divide `n`.'
order_index: 76
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def reuse(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().reuse(_p))

    '
reference_solution: "class Solution(object):\n    def reuse(self, tokens):\n        n = int(tokens[0]);\
  \ t = int(tokens[1])\n        if n <= 0 or t <= 0 or n % t != 0:\n            return '-1 -1 -1.0'\n\
  \        un = 2 * n ** 3\n        ti = 2 * n ** 3 // t\n        return str(un) + ' ' + str(ti) + ' '\
  \ + str(round(un / ti, 1))\n"
