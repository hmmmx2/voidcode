slug: sequence-packing-waste
title: How much padding does a batch waste?
difficulty: medium
categories:
- Systems
concepts:
- dataloading
- memory_accounting
description: 'Training batches are padded to their longest sequence, and every padded token is compute
  spent on nothing.


  Input: `batch_size`, then the token length of each sequence in arrival order. Group them into consecutive
  batches of `batch_size` (the final batch may be short), pad each to its own longest member, and return
  `total_padding_tokens padded_total` separated by a space.


  This is why length-grouped batching exists: the same sequences in sorted order waste far less, and the
  arithmetic here shows how much.'
order_index: 47
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def waste(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().waste(_p))

    '
reference_solution: "class Solution(object):\n    def waste(self, tokens):\n        bs = int(tokens[0])\n\
  \        lens = [int(x) for x in tokens[1:]]\n        pad = 0; total = 0\n        for i in range(0,\
  \ len(lens), bs):\n            chunk = lens[i:i + bs]\n            m = max(chunk)\n            total\
  \ += m * len(chunk)\n            pad += m * len(chunk) - sum(chunk)\n        return str(pad) + ' ' +\
  \ str(total)\n"
