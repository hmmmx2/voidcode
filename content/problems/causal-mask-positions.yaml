slug: causal-mask-positions
title: Which positions can token i attend to?
difficulty: medium
categories:
- LLM
concepts:
- attention_masking
- attention_scaled_dot
description: 'Return how many positions token `i` may attend to under a causal mask with an optional sliding

  window.


  Write `visible_positions(i, seq_len, window)`.


  Causal masking lets position `i` see positions `0..i` inclusive — itself and everything before.

  A `window` of `w > 0` further restricts it to the most recent `w` positions, i.e. `i-w+1..i`

  clamped at 0. A window of 0 or less means no window.


  Return 0 if `i` is outside the sequence.


  **The off-by-one here is the whole question, and it is load-bearing.** A mask that excludes

  position `i` itself stops a token attending to its own value, and the model still trains — it just

  trains worse, with no error anywhere. A mask off by one in the other direction leaks one token of

  future, which is worse: validation loss improves, the model looks better than it is, and the leak

  is invisible until generation, where there is no future to leak.'
