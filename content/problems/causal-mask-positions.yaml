reference_solution: "class Solution(object):\n    def visible_positions(self, i, seq_len, window):\n \
  \       if i >= seq_len or i < 0:\n            return 0\n        lo = 0 if window <= 0 else max(0, i\
  \ - window + 1)\n        return i - lo + 1\n"
