slug: grad-accum-equivalent-batch
title: How many micro-steps for this effective batch?
difficulty: medium
categories:
- Systems
concepts:
- gradient_accumulation
- data_parallel
description: 'Given a target effective batch size, a per-GPU micro-batch, and a GPU count, return the
  number

  of accumulation steps needed — or `None` if the target is not reachable exactly.


  Write `steps_needed(effective_batch, micro_batch, gpus)`.


  Effective batch is `micro_batch * gpus * accumulation_steps`. Return the integer accumulation

  steps, or `None` when `effective_batch` is not divisible by `micro_batch * gpus`.


  **Why refuse rather than round.** An effective batch that silently differs from the one in your

  config makes the run incomparable to every other run at that "batch size", including the published

  baseline you are trying to match. Rounding to the nearest reachable value is how two experiments

  end up looking like a hyperparameter difference when they are actually a batch-size difference.


  **And why `no_sync` matters here.** Under data parallelism, wrapping the micro-steps in `no_sync`

  gives one all-reduce per optimizer step rather than one per micro-batch. At 32 accumulation steps

  that is the difference between 1 collective and 32, which on a slow interconnect decides whether

  the second GPU helps at all.'
