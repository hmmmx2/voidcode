reference_solution: "class Solution(object):\n    def steps_needed(self, effective_batch, micro_batch,\
  \ gpus):\n        per_step = micro_batch * gpus\n        if per_step == 0 or effective_batch % per_step:\n\
  \            return None\n        return effective_batch // per_step\n"
