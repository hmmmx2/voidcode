slug: iq-bias-variance-decomposition
title: Split test error into bias, variance and noise
difficulty: hard
categories:
- ML
concepts:
- tensors_and_shapes
description: 'Implement `decompose(preds, f_true, sigma2, k)`.


  - `preds` -- `M x N`; `preds[i][j]` is model `i`''s prediction at test point `j`. The M models were
  fit on M independent resamples of the training set.

  - `f_true` -- length N, the noise-free target `f(x_j)`.

  - `sigma2` -- the irreducible noise variance, from `y = f(x) + eps` with `Var(eps) = sigma2`.

  - `k` -- an ensemble size.


  For each test point `j`, let `f_bar[j]` be the mean prediction over the M models. Averaged over the
  N test points:


  ```

  bias2    = mean_j ( f_true[j] - f_bar[j] )^2

  variance = mean_j ( (1/M) * sum_i ( preds[i][j] - f_bar[j] )^2 )

  noise    = sigma2

  total    = bias2 + variance + noise

  total_k  = bias2 + variance / k + noise

  ```


  Return `[bias2, variance, noise, total, total_k]`, each rounded to 6 decimal places.


  **Three ways to get this wrong.**


  1. `bias2` squares the *difference of the means*. Averaging `(f_true[j] - preds[i][j])^2` over both
  `i` and `j` instead gives `bias2 + variance` -- the two quantities you were asked to separate, added
  back together.

  2. Divide by `M`, not `M - 1`. This is a decomposition of an expectation, not a sample estimate from
  a survey, and `M = 1` must give a variance of `0.0` rather than raising.

  3. `f_bar` is per test point. A single mean over the whole matrix is a different number entirely.


  `total_k` is the payoff: averaging `k` independent models leaves `f_bar`, and therefore `bias2`, untouched
  while dividing the variance by `k`. Ensembling buys the variance term and nothing else -- and since
  the members are never truly independent, decorrelating them matters more than adding more of them. `noise`
  is a floor no model of any kind gets under.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 8
examples:
- input: preds = [[1.0, 2.0], [3.0, 4.0]], f_true = [2.0, 2.0], sigma2 = 0.5, k = 2
  output: '[0.5, 1.0, 0.5, 2.0, 1.5]'
  explanation: f_bar = [2.0, 3.0], so bias2 = mean(0, 1) = 0.5. At each point the two predictions sit
    one unit either side of their mean, so variance = 1.0. Total is 0.5 + 1.0 + 0.5 = 2.0, and averaging
    2 models halves the variance term to give 1.5.
- input: preds = [[0.0], [4.0]], f_true = [2.0], sigma2 = 0.0, k = 4
  output: '[0.0, 4.0, 0.0, 4.0, 1.0]'
  explanation: The two models straddle the target, so the mean prediction is exactly right and bias2 is
    0 -- every bit of the error is variance. Averaging 4 such models cuts 4.0 down to 1.0, which no amount
    of ensembling could do to a biased model.
constraints:
- 1 <= M <= 200, 1 <= N <= 10^3
- len(preds[i]) == len(f_true) == N for every i
- sigma2 >= 0 and k >= 1
- Variance divides by M, not M - 1; M = 1 gives 0.0 and must not raise.
- Round each of the five values to 6 decimal places.
- Standard library only -- no numpy, no torch.
