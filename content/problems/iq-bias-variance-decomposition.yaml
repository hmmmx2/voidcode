source_kind: interview_problem
reference_solution: "class Solution(object):\n    def decompose(self, preds, f_true, sigma2, k):\n   \
  \     m = len(preds)\n        n = len(f_true)\n        bias2 = 0.0\n        variance = 0.0\n       \
  \ for j in range(n):\n            f_bar = sum(preds[i][j] for i in range(m)) / float(m)\n          \
  \  bias2 += (f_true[j] - f_bar) ** 2\n            variance += sum((preds[i][j] - f_bar) ** 2 for i in\
  \ range(m)) / float(m)\n        bias2 /= float(n)\n        variance /= float(n)\n        total = bias2\
  \ + variance + sigma2\n        total_k = bias2 + variance / float(k) + sigma2\n        return [bias2,\
  \ variance, sigma2, total, total_k]\n"
