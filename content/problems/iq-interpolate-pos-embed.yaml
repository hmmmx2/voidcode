slug: iq-interpolate-pos-embed
title: Resize a ViT's position embeddings
difficulty: hard
categories:
- VLM
- DL
concepts:
- embeddings
- vision_transformer
- image_preprocessing
description: 'Given `pe` of shape `(1 + old*old, D)` -- **row 0 is the CLS token**, the rest is an `old
  x old` grid in row-major order -- resize it to `(1 + new*new, D)`. Round to 6 decimals.


  **The CLS row is copied, never interpolated.** It encodes no position, so blending it into the grid
  contaminates every patch with a vector that means something else. Nothing crashes if you get this wrong;
  the model just gets quietly worse.


  **Bilinear sampling, half-pixel aligned.** For output cell `(r, c)`, the source coordinate is


  ```

  src = (dst + 0.5) * (old / new) - 0.5

  ```


  clamped to `[0, old-1]`, then bilinearly interpolated between the two surrounding integer rows and columns.
  The `+0.5 ... -0.5` maps cell *centres* rather than corners; using `dst * (old/new)` instead biases
  the whole grid by half a cell.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 37
examples:
- input: pe = [[9.0], [0.0], [1.0], [2.0], [3.0]], old = 2, new = 2
  output: '[[9.0], [0.0], [1.0], [2.0], [3.0]]'
  explanation: Same size in and out, so every value is unchanged and CLS is carried through.
constraints:
- 1 <= old, new <= 32
- 1 <= D <= 64
- len(pe) == 1 + old*old
- Row 0 (CLS) is copied verbatim.
- Clamp source coordinates to [0, old-1].
- Round to 6 decimal places.
- Standard library only -- no numpy, no torch.
