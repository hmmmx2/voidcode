- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def resize_pos_embed(self, pe, old, new):\n        \"\"\
    \"\n        :type pe: List[List[float]]  -- (1 + old*old, D), row 0 is CLS\n        :type old: int\n\
    \        :type new: int\n        :rtype: List[List[float]]    -- (1 + new*new, D)\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    pe = json.loads(_in[0])

    old = int(_in[1])

    new = int(_in[2])

    _r = Solution().resize_pos_embed(pe, old, new)

    print([[round(v, 6) for v in row] for row in _r])

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def resize_pos_embed(self, pe, old, new):\n        cls\
  \ = pe[0]\n        grid = pe[1:]\n        d = len(cls)\n        scale = float(old) / float(new)\n  \
  \      out = [list(cls)]\n        for r in range(new):\n            sr = (r + 0.5) * scale - 0.5\n \
  \           if sr < 0.0:\n                sr = 0.0\n            if sr > old - 1:\n                sr\
  \ = float(old - 1)\n            r0 = int(sr)\n            r1 = min(r0 + 1, old - 1)\n            wr\
  \ = sr - r0\n            for c in range(new):\n                sc = (c + 0.5) * scale - 0.5\n      \
  \          if sc < 0.0:\n                    sc = 0.0\n                if sc > old - 1:\n          \
  \          sc = float(old - 1)\n                c0 = int(sc)\n                c1 = min(c0 + 1, old -\
  \ 1)\n                wc = sc - c0\n                row = []\n                for k in range(d):\n \
  \                   a = grid[r0 * old + c0][k]\n                    b = grid[r0 * old + c1][k]\n   \
  \                 c_ = grid[r1 * old + c0][k]\n                    e = grid[r1 * old + c1][k]\n    \
  \                top = a + (b - a) * wc\n                    bot = c_ + (e - c_) * wc\n            \
  \        row.append(top + (bot - top) * wr)\n                out.append(row)\n        return out\n"
