source_kind: interview_problem
reference_solution: "class Solution(object):\n    def warp_reduce(self, vals):\n        width = len(vals)\n\
  \        cur = list(vals)\n        offset = width // 2\n        while offset >= 1:\n            # Snapshot:\
  \ every lane reads the pre-step state.\n            prev = list(cur)\n            for lane in range(width):\n\
  \                src = lane + offset\n                if src < width:\n                    cur[lane]\
  \ = prev[lane] + prev[src]\n            offset //= 2\n        return cur\n"
