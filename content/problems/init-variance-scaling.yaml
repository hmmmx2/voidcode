reference_solution: "class Solution(object):\n    def init_std(self, fan_in, fan_out, scheme):\n     \
  \   import math\n        if scheme == 'xavier':\n            return round(math.sqrt(2.0 / (fan_in +\
  \ fan_out)), 6)\n        if scheme == 'he':\n            return round(math.sqrt(2.0 / fan_in), 6)\n\
  \        return round(math.sqrt(1.0 / fan_in), 6)\n"
