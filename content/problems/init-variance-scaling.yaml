slug: init-variance-scaling
title: What standard deviation should this layer initialise to?
difficulty: medium
categories:
- DL
concepts:
- initialization
- activations
description: "Return the standard deviation a layer should be initialised with.\n\nWrite `init_std(fan_in,\
  \ fan_out, scheme)` for `\"xavier\"`, `\"he\"` or `\"lecun\"`:\n\n    xavier  sqrt(2 / (fan_in + fan_out))\n\
  \    he      sqrt(2 / fan_in)\n    lecun   sqrt(1 / fan_in)\n\nRound to 6 decimal places.\n\n**Why the\
  \ schemes differ by a factor of 2, which is the whole idea.** Initialisation exists to keep\nactivation\
  \ variance roughly constant as signal passes through layers — too small and it vanishes by\nthe output,\
  \ too large and it explodes. Xavier assumes a symmetric activation like tanh that passes\nroughly all\
  \ its input variance through. He assumes ReLU, which zeroes half its inputs and therefore\nhalves the\
  \ variance, so the initial weights must be larger by exactly that factor to compensate.\n\n**Which is\
  \ why the pairing matters more than the formula.** He init with tanh over-amplifies; Xavier\nwith ReLU\
  \ under-amplifies and deep networks train slowly or not at all. The scheme is a claim about\nthe activation\
  \ function that follows it, not a free choice.\n\nXavier is the only one using `fan_out`, because it\
  \ balances the forward and backward passes at\nonce — the backward pass sees the transposed matrix,\
  \ where fan_in and fan_out swap."
