description: Write `dropout_moments(a, p, mode)` returning the constant applied to surviving units, the
  expected value of the layer's summed output, and the variance of that sum. The trap is that the constant
  is chosen to preserve the mean and nothing else — the variance it injects is what does the regularising
  — and in eval mode there is no mask and no scaling at all.
