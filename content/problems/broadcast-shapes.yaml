source_kind: problem
reference_solution: "class Solution(object):\n    def broadcast(self, a, b):\n        ra, rb = list(reversed(a)),\
  \ list(reversed(b))\n        out = []\n        for i in range(max(len(ra), len(rb))):\n            da\
  \ = ra[i] if i < len(ra) else 1\n            db = rb[i] if i < len(rb) else 1\n            if da ==\
  \ db or da == 1 or db == 1:\n                out.append(max(da, db))\n            else:\n          \
  \      return []\n        return list(reversed(out))\n"
