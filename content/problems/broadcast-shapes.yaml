slug: broadcast-shapes
title: Broadcasting Shapes
difficulty: medium
categories:
- TensorFlow
- PyTorch
- ML
concepts:
- tensors_and_shapes
description: 'Given two tensor shapes, return the shape they broadcast to.


  Broadcasting is the rule that lets `(256, 256, 3)` and `(3,)` be added together, and it is identical
  in NumPy, PyTorch and TensorFlow. Align the shapes from the **right**, then compare each pair of dimensions:


  * equal -- keep it

  * one of them is `1` -- it stretches to the other

  * a missing dimension counts as `1`

  * anything else -- the shapes are incompatible


  Return the resulting shape, or an **empty list** if they cannot broadcast.


  A scalar has shape `[]` and broadcasts against anything.'
inferred_concepts: true
review_needed: true
order_index: 11
examples:
- input: a = [3, 1, 5], b = [1, 4, 5]
  output: '[3, 4, 5]'
  explanation: Each pair either matches or has a 1 that stretches. Both operands stretch here, in different
    axes.
- input: a = [256, 256, 3], b = [3]
  output: '[256, 256, 3]'
  explanation: An image and a per-channel constant. b right-aligns to the last axis; its missing dimensions
    count as 1.
- input: a = [2, 3], b = [4, 5]
  output: '[]'
  explanation: 2 against 4, with neither equal to 1. Incompatible, so the result is empty.
constraints:
- 0 <= len(shape) <= 8 for both inputs
- 1 <= dimension <= 10^6
- Align from the right; a missing leading dimension counts as 1.
- Return [] when the shapes cannot broadcast.
- Standard library only -- no numpy, no torch.
hints:
- Align from the RIGHT, not the left. Reversing both shapes first turns the alignment into a plain index-by-index
  walk.
- Iterate to the length of the LONGER shape. Whenever one shape has run out, substitute 1 -- that is exactly
  what a missing leading dimension means.
- 'For each pair: if they are equal, or either is 1, the result is max(da, db). Otherwise return [] immediately.
  Remember to reverse the accumulated result before returning it.'
hint_ladder:
  level_0: Align from the RIGHT, not the left. Reversing both shapes first turns the alignment into a
