    '
reference_solution: "import math\n\nclass Solution(object):\n    def ndcg(self, tokens):\n        k =\
  \ int(tokens[0])\n        rel = [float(x) for x in tokens[1:]]\n        def dcg(xs):\n            return\
  \ sum(r / math.log2(i + 2) for i, r in enumerate(xs[:k]))\n        ideal = dcg(sorted(rel, reverse=True))\n\
  \        if ideal == 0:\n            return 0.0\n        return round(dcg(rel) / ideal, 4)\n"
