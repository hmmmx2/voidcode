slug: ndcg-at-k
title: Compute NDCG@k from a ranked relevance list
difficulty: medium
categories:
- ML
concepts:
- classification_metrics
description: 'Ranking quality is reported as NDCG@k throughout this project, and it is worth being able
  to compute it by hand.


  Input: `k`, then the graded relevance of each item **in the order your ranker returned them**.


  DCG@k sums `rel_i / log2(i + 2)` over the first k positions (i counted from 0). IDCG@k is the same sum
  over the relevances sorted descending — the best any ranker could do on this set. NDCG is their ratio,
  rounded to 4 decimal places.


  Return `0.0` when IDCG is 0, which happens when nothing relevant exists: a ranker cannot be penalised
  for failing to surface what is not there.'
order_index: 42
