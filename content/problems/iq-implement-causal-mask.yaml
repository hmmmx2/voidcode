slug: iq-implement-causal-mask
title: Softmax over a row that is entirely masked
difficulty: medium
categories:
- DL
- LLM
concepts:
- numerical_stability
description: 'Given `scores` (a list of floats) and `mask` (a list of 0/1 of the same length, 1 meaning
  *attend to this position*), return the softmax over the unmasked positions. Masked positions get exactly
  `0.0`. Round to 6 decimals.


  **The row where every mask entry is 0 is the question.** Setting masked scores to `-inf` and running
  softmax gives `exp(-inf) = 0` for every term, so you compute `0 / 0` -- NaN. And NaN is not local: one
  such row propagates through the next matmul and turns the whole batch into NaN, which is why this shows
  up as ''my loss became NaN at step 400'' rather than as an obviously masked-out row.


  **Return a row of all zeros in that case.** It is the only value that does not corrupt anything downstream.


  Subtract the row maximum over the *unmasked* positions before exponentiating, or a score of 800 overflows.


  Standard library only -- no numpy, no torch.'
inferred_concepts: true
review_needed: true
order_index: 36
examples:
- input: scores = [1.0, 2.0, 3.0], mask = [1, 1, 0]
  output: '[0.268941, 0.731059, 0.0]'
  explanation: Only the first two compete. softmax([1,2]) = [0.268941, 0.731059], and the masked third
    is exactly 0.0.
- input: scores = [1.0, 2.0], mask = [0, 0]
  output: '[0.0, 0.0]'
  explanation: Nothing to attend to. Zeros, not NaN.
constraints:
- 1 <= len(scores) == len(mask) <= 10^4
- mask[i] is 0 or 1
- An all-zero mask returns all zeros, never NaN.
- '|scores[i]| may reach 1000 -- do not overflow.'
- Round to 6 decimal places.
- Standard library only -- no numpy, no torch.
