source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def masked_softmax(self, scores, mask):\n\
  \        live = [i for i, m in enumerate(mask) if m]\n        if not live:\n            return [0.0]\
  \ * len(scores)\n        top = max(scores[i] for i in live)\n        exps = {i: math.exp(scores[i] -\
  \ top) for i in live}\n        total = sum(exps.values())\n        return [exps[i] / total if i in exps\
  \ else 0.0\n                for i in range(len(scores))]\n"
