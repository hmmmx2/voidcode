slug: layer-norm
title: Layer Normalisation
difficulty: medium
categories:
- DL
- PyTorch
concepts:
- normalization_layers
description: 'Implement LayerNorm for a single feature vector.


  `y_i = (x_i - mean) / sqrt(var + eps) * gamma_i + beta_i`


  The mean and variance are computed **across the features of this one vector** -- not across a batch.
  That is the entire difference between LayerNorm and BatchNorm, and it is why LayerNorm works with a
  batch size of 1 and needs no running statistics at inference.


  Use the **biased** variance: divide by n, not n-1.


  Note where `eps` sits -- inside the square root, added to the variance. Putting it outside changes the
  result.'
inferred_concepts: true
review_needed: true
order_index: 3
examples:
- input: x = [1.0, 2.0, 3.0, 4.0], gamma = [1,1,1,1], beta = [0,0,0,0], eps = 1e-5
  output: '[-1.341635, -0.447212, 0.447212, 1.341635]'
  explanation: mean = 2.5, biased var = 1.25. The output is symmetric and has ~zero mean.
- input: x = [2.0, 2.0, 2.0], gamma = [1,1,1], beta = [0,0,0], eps = 1e-5
  output: '[0.0, 0.0, 0.0]'
  explanation: Zero variance. eps is what stops this being a division by zero.
- input: x = [1.0, -1.0], gamma = [2.0, 2.0], beta = [0.5, -0.5], eps = 1e-5
  output: '[2.49999, -2.49999]'
  explanation: Not exactly 2.5 -- eps inside the sqrt shifts the result slightly, which is the correct
    behaviour.
constraints:
- 1 <= len(x) <= 10^4
- len(gamma) == len(beta) == len(x)
- 0 < eps <= 1e-3
- 'Use the biased variance: divide the squared deviations by n.'
- Standard library only -- no numpy, no torch.
hints:
- Compute the mean and variance over x itself. There is no batch dimension here -- every statistic comes
  from this one vector.
- Biased variance means sum((v - mean) ** 2) / n. Using n - 1 gives a subtly different answer that only
  shows up on short vectors.
- 'The order is: normalise with (v - mean) / sqrt(var + eps), then scale by gamma and shift by beta. eps
  goes inside the sqrt, with the variance.'
