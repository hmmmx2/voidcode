code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "import math\n\nclass Solution(object):\n    def layerNorm(self, x, gamma, beta, eps):\n\
    \        \"\"\"\n        :type x: List[float]\n        :type gamma: List[float]\n        :type beta:\
    \ List[float]\n        :type eps: float\n        :rtype: List[float]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    x = json.loads(_in[0]); gamma = json.loads(_in[1])

    beta = json.loads(_in[2]); eps = float(_in[3])

    print([round(v, 6) for v in Solution().layerNorm(x, gamma, beta, eps)])

    '
source_kind: problem
reference_solution: "import math\nclass Solution(object):\n    def layerNorm(self, x, gamma, beta, eps):\n\
  \        n = len(x)\n        mean = sum(x) / n\n        var = sum((v - mean) ** 2 for v in x) / n\n\
  \        denom = math.sqrt(var + eps)\n        return [((v - mean) / denom) * g + b for v, g, b in zip(x,\
  \ gamma, beta)]\n"
