reference_solution: "class Solution(object):\n    def segments(self, tokens):\n        n = int(tokens[0])\n\
  \        if n <= 0:\n            return '0 0'\n        best_s = 1; best_c = None\n        for s in range(1,\
  \ n + 1):\n            c = s + -(-n // s)\n            if best_c is None or c < best_c:\n          \
  \      best_c = c; best_s = s\n        return str(best_s) + ' ' + str(best_c)\n"
