slug: gradient-checkpoint-segments
title: How many segments minimise checkpointed memory?
difficulty: hard
categories:
- Systems
- DL
concepts:
- gradient_checkpointing
- memory_accounting
description: 'Input: `n_layers`.


  Gradient checkpointing stores activations at segment boundaries and recomputes the rest during the backward
  pass. With `n` layers split into `s` equal segments, peak activation memory is proportional to `s +
  n/s` — the boundaries you keep, plus the deepest segment you must recompute.


  Return the integer `s` in `[1, n]` that minimises `s + ceil(n/s)`. On a tie return the SMALLER s. Also
  return the resulting cost, as `s cost`.


  The continuous optimum is sqrt(n), which is where the familiar "sqrt(n) memory" result comes from —
  but the integer answer is not always round(sqrt(n)), and that is the point of computing it rather than
  quoting it.'
