  explanation: 'Bias correction divides v_1 = (1-b2)*g_1^2 by (1-b2), giving exactly g_1^2. Unbiased,
    and estimated from a single sample: the relative spread is sqrt(2) = 141%, and the update divides
    by the square root of that.'
- input: b2 = 0.999, t = 1000000000
  output: '[1999.0, 0.001, 0.031631]'
  explanation: 'Fully converged: ess hits its ceiling (1 + b2)/(1 - b2) = 1.999/0.001 = 1999, and the
    relative spread has fallen to about 3%. This is the regime the per-parameter step bound assumes.'
constraints:
- 0.0 < b2 < 1.0
- 1 <= t <= 10^9
- Derive the closed form; a loop over t terms will time out.
- Assume Var[g^2] / E[g^2]^2 = 2 (zero-mean Gaussian gradients).
- Round all three values to 6 decimal places.
- Standard library only -- no numpy, no torch.
