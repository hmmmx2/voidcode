source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def moment_stats(self, b2, t):\n    \
  \    x = b2 ** t\n        # sum w_i^2 = ((1-b2)/(1-x))^2 * (1-x^2)/(1-b2^2), and 1-b2^2 = (1-b2)(1+b2),\n\
  \        # so 1/sum w_i^2 collapses to:\n        ess = ((1.0 + b2) / (1.0 - b2)) * ((1.0 - x) / (1.0\
  \ + x))\n        w_last = (1.0 - b2) / (1.0 - x)\n        rel_std = math.sqrt(2.0 / ess)\n        return\
  \ [ess, w_last, rel_std]\n"
