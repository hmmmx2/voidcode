slug: iq-warmup-adam-variance
title: Compute the effective sample count behind Adam's second moment
difficulty: hard
categories:
- DL
- LLM
concepts:
- optimizers_adaptive
- lr_scheduling
description: "Adam's second moment is `v_t = b2 * v_{t-1} + (1 - b2) * g_t^2` with `v_0 = 0`, and bias\
  \ correction divides by `1 - b2^t`. Unrolled, that makes the corrected estimate a weighted average of\
  \ past squared gradients:\n\n```\nv_hat_t = sum_{i=1..t} w_i * g_i^2 ,   w_i = (1 - b2) * b2^(t-i) /\
  \ (1 - b2^t)\n```\n\nThe weights sum to exactly 1, which is what bias correction buys you: `E[v_hat_t]\
  \ = E[g^2]`, unbiased from step one. Write\n\n```\nimport math\n\nclass Solution(object):\n    def moment_stats(self,\
  \ b2, t):\n        # -> [ess, w_last, rel_std]\n```\n\n**1. `ess`** — the Kish effective sample size\
  \ of that weighted average:\n\n```\ness = (sum_i w_i)^2 / sum_i w_i^2 = 1 / sum_i w_i^2\n```\n\nBoth\
  \ sums are geometric, so this collapses to a closed form in `b2` and `b2**t`. Derive it — `t` reaches\
  \ 10^9 in the tests and a loop over `t` terms will time out.\n\n**2. `w_last`** — the weight on the\
  \ newest gradient, `w_t = (1 - b2) / (1 - b2^t)`.\n\n**3. `rel_std`** — the relative standard deviation\
  \ of `v_hat_t`. Assume the `g_i` are i.i.d. Gaussian with mean 0, so `Var[g^2] / E[g^2]^2 = 2` exactly,\
  \ and averaging with these weights divides that by `ess`:\n\n```\nrel_std = sqrt(2 / ess)\n```\n\n**What\
  \ you should see.** At `t = 1` the answer is `ess = 1`, `w_last = 1`, `rel_std = sqrt(2)` — the estimate\
  \ is one sample, and the update divides by its square root. As `t` grows, `ess` saturates at `(1 + b2)\
  \ / (1 - b2)`, roughly twice the familiar `1 / (1 - b2)` decay time, since the Kish count and the decay\
  \ time are different quantities. Warmup exists to keep the learning rate small over exactly the stretch\
  \ where `ess` climbs from 1 toward that ceiling.\n\nThe driver rounds all three values to 6 decimal\
  \ places.\n\nStandard library only -- no numpy, no torch."
