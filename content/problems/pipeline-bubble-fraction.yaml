description: 'Write `pipeline(stages, microbatches, chunks, target)` returning the fraction of the pass
  wasted while the pipeline fills and drains, plus the smallest micro-batch count that would hold that
  fraction at or below `target`. The trap is `chunks`: an interleaved schedule handing each device several
  non-contiguous stages shrinks the idle time by that factor, and ignoring it makes the second number
  several times too large.'
