description: 'Write `decode_throughput(params, dtype_bytes, kv_bytes_per_seq, batch, bandwidth, efficiency)`
  returning `[bytes_per_step, tokens_per_s, ms_per_token]`, treating an autoregressive decode step as
  purely bandwidth bound. The trap is which term scales with `batch`: the weights stream once per step
  no matter how many sequences ride along, while the KV cache is per sequence -- multiply the wrong one
  and either batching stops helping entirely or it helps forever.'
