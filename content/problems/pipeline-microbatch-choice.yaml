slug: pipeline-microbatch-choice
title: Choose the micro-batch count to hit a bubble target
difficulty: medium
categories:
- Systems
concepts:
- pipeline_parallel
description: 'Input: `stages target_bubble_pct`.


  The GPipe bubble fraction is `(p - 1) / (m + p - 1)` for `p` stages and `m` micro-batches. Return the
  smallest integer `m >= 1` whose bubble is at or below the target, and the bubble it achieves as a percentage
  rounded to 1 decimal place, as `m bubble_pct`.


  Return `-1 -1.0` when the target is 0 or negative — the bubble approaches zero but never reaches it,
  so demanding exactly zero is unsatisfiable and should say so rather than looping forever.'
order_index: 69
code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def micro(self, tokens):\n        \"\"\"\n        :rtype:\
    \ see the description\n        \"\"\"\n"
  driver_code: 'import sys

    _p = sys.stdin.read().split()

    print(Solution().micro(_p))

    '
reference_solution: "class Solution(object):\n    def micro(self, tokens):\n        p = int(tokens[0]);\
  \ t = float(tokens[1]) / 100.0\n        if t <= 0:\n            return '-1 -1.0'\n        m = 1\n  \
  \      while m <= 100000:\n            b = (p - 1) / (m + p - 1) if (m + p - 1) else 0.0\n         \
  \   if b <= t:\n                return str(m) + ' ' + str(round(b * 100, 1))\n            m += 1\n \
  \       return '-1 -1.0'\n"
