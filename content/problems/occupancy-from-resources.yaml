description: Write `occupancy(...)` returning the resident blocks per SM, the resident warps, and the
  occupancy fraction, given a kernel's per-block cost and an SM's limits. The trap is that four independent
  ceilings apply -- registers, shared memory, threads and a hard block cap -- and the answer is the smallest
  of them, floored, which can be zero.
