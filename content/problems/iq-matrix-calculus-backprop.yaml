code_templates:
- language: Python
  judge0_language_id: 71
  template_code: "class Solution(object):\n    def linear_backward(self, X, W, dY):\n        \"\"\"\n\
    \        :type X: List[List[float]]   -- (N, D)\n        :type W: List[List[float]]   -- (D, M)\n\
    \        :type dY: List[List[float]]  -- (N, M)\n        :rtype: List  -- [dX (N,D), dW (D,M), db\
    \ (M,)]\n        \"\"\"\n"
  driver_code: 'import sys, json

    _in = sys.stdin.read().split("\n")

    X = json.loads(_in[0])

    W = json.loads(_in[1])

    dY = json.loads(_in[2])

    dX, dW, db = Solution().linear_backward(X, W, dY)

    print([[round(float(v), 6) + 0.0 for v in row] for row in dX])

    print([[round(float(v), 6) + 0.0 for v in row] for row in dW])

    print([round(float(v), 6) + 0.0 for v in db])

    '
source_kind: interview_problem
reference_solution: "class Solution(object):\n    def linear_backward(self, X, W, dY):\n        N = len(X)\n\
  \        D = len(W)\n        M = len(W[0])\n        dX = [[sum(dY[n][m] * W[d][m] for m in range(M))\
  \ for d in range(D)]\n              for n in range(N)]\n        dW = [[sum(X[n][d] * dY[n][m] for n\
  \ in range(N)) for m in range(M)]\n              for d in range(D)]\n        db = [sum(dY[n][m] for\
  \ n in range(N)) for m in range(M)]\n        return [dX, dW, db]\n"
