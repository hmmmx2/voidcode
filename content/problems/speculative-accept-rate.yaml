slug: speculative-accept-rate
title: When does speculative decoding pay off?
difficulty: medium
categories:
- LLM
concepts:
- speculative_decoding
- sampling_decoding
description: "Return the expected speedup from speculative decoding.\n\nWrite `expected_speedup(k, accept_rate,\
  \ draft_cost)`.\n\nA draft model proposes `k` tokens; the target verifies them in one forward pass and\
  \ accepts a\nprefix. With independent per-token acceptance probability `alpha`, the expected number\
  \ of accepted\ntokens per round — including the one free token the target always produces — is\n\n \
  \   (1 - alpha**(k+1)) / (1 - alpha)\n\nThe round costs one target forward plus `k` draft forwards,\
  \ and `draft_cost` is the draft's cost\nas a fraction of the target's. So the speedup is `expected_tokens\
  \ / (1 + k * draft_cost)`.\n\nRound to 4 decimal places.\n\n**Why a bigger k is not always better, which\
  \ is the point of the question.** Accepted tokens grow\nsublinearly in `k` — each extra draft token\
  \ needs *all* the previous ones accepted — while the\ndraft cost grows linearly. Past a point every\
  \ additional speculation is paid for and thrown away.\nThe optimum is usually small, 3 to 5 for typical\
  \ acceptance rates.\n\n**And why the whole technique can lose.** If `draft_cost` is high or `alpha`\
  \ is low, the speedup\nfalls below 1.0 and you have made generation slower while adding a second model\
  \ to serve. A draft\nthat is 30% of the target's cost with 60% acceptance is not obviously worth it,\
  \ and the arithmetic\nhere says which side it lands on.\n\nSpeculative decoding is also **exact**: the\
  \ verification step preserves the target's output\ndistribution, so this is pure throughput and not\
  \ a quality trade."
