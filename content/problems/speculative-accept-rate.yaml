reference_solution: "class Solution(object):\n    def expected_speedup(self, k, accept_rate, draft_cost):\n\
  \        a = accept_rate\n        if a == 1.0:\n            expected = k + 1\n        else:\n      \
  \      expected = (1 - a ** (k + 1)) / (1 - a)\n        return round(expected / (1 + k * draft_cost),\
  \ 4)\n"
