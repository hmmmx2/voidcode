source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def simulate(self, w, u, steps, mantissa_bits,\
  \ min_exp):\n        def spacing(x):\n            if x == 0.0:\n                return math.ldexp(1.0,\
  \ min_exp - mantissa_bits)\n            _m, k = math.frexp(abs(x))\n            e = k - 1          \
  \       # abs(x) lies in [2**e, 2**(e+1))\n            if e < min_exp:           # subnormal: one fixed\
  \ spacing\n                e = min_exp\n            return math.ldexp(1.0, e - mantissa_bits)\n\n  \
  \      def quantize(x):\n            s = spacing(x)\n            return round(x / s) * s   # round()\
  \ breaks ties to even\n\n        ulps = u / spacing(w)\n        cur = w\n        for _ in range(steps):\n\
  \            cur = quantize(cur + u)\n        return [ulps, cur]\n"
