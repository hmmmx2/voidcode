source_kind: interview_problem
reference_solution: "class Solution(object):\n    def param_count(self, d_model, n_layers, d_ff, vocab,\n\
  \                    n_heads, n_kv_heads, tied, gated):\n        head_dim = d_model // n_heads\n   \
  \     kv_dim = n_kv_heads * head_dim\n        # Q and O are always full width; only K and V follow the\
  \ KV-head count.\n        attn = 2 * d_model * d_model + 2 * d_model * kv_dim\n        ffn = (3 if gated\
  \ else 2) * d_model * d_ff\n        embedding = vocab * d_model if tied else 2 * vocab * d_model\n \
  \       total = n_layers * (attn + ffn) + embedding\n        return [attn, ffn, embedding, total]\n"
