source_kind: interview_problem
reference_solution: "import math\n\nclass Solution(object):\n    def layernorm_backward(self, x, dy, gamma,\
  \ eps):\n        H = len(x)\n        mu = sum(x) / float(H)\n        var = sum((xi - mu) ** 2 for xi\
  \ in x) / float(H)\n        sigma = math.sqrt(var + eps)\n        xhat = [(xi - mu) / sigma for xi in\
  \ x]\n        dgamma = [dy[i] * xhat[i] for i in range(H)]\n        dbeta = [float(v) for v in dy]\n\
  \        g = [dy[i] * gamma[i] for i in range(H)]\n        mean_g = sum(g) / float(H)\n        mean_gx\
  \ = sum(g[i] * xhat[i] for i in range(H)) / float(H)\n        dx = [(g[i] - mean_g - xhat[i] * mean_gx)\
  \ / sigma for i in range(H)]\n        return [dx, dgamma, dbeta]\n"
