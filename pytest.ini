[pytest]
# testpaths is deliberately narrow. The repo root contains
# llm/scripts/test_hybrid_model.py, which pytest's default discovery would collect
# because of its name — it is an interactive CLI that loads torch and a LoRA
# adapter at run time, not a test. Restricting discovery to tests/ avoids that.
testpaths = tests apps/api/tests
python_files = test_*.py
# apps/api on the path so the routers import as `src.*`, matching how uvicorn
# runs them. The API tests deliberately do NOT import `main`, which would drag
# in torch and transformers — see apps/api/tests/conftest.py.
pythonpath = apps/api
asyncio_mode = strict
addopts = -q --strict-markers
markers =
    requires_warehouse: needs a built $VC_DATA/warehouse (run `make features` first)
    requires_train_warehouse: needs $VC_DATA/warehouse_train (run `make features-train`)
    requires_r: needs the micromamba R env (run `bash setup_wsl_env.sh --with-r`)
    requires_postgres: needs a reachable Postgres (`docker compose up -d postgres`)
    slow: takes more than a few seconds
filterwarnings =
    ignore::DeprecationWarning:pyspark.*
