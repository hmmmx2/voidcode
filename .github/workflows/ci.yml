# CI for VoidCode AI.
#
# There was none before this. That mattered more than usual: the API tests added
# alongside this workflow guard a grading path that was, until recently, letting
# a client supply its own expected outputs. Tests that nothing runs do not
# protect anything past the next refactor.
#
# WHAT THIS DELIBERATELY DOES NOT DO
#
# It does not install torch, transformers, vLLM or SGLang, and it does not run
# the Spark pipeline. Those need CUDA, tens of gigabytes of wheels, or a built
# warehouse — none available to a hosted runner, and none needed to check the
# things that break silently. The suites here are the ones whose failure is
# invisible until a user hits it.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  # Callable from containers.yml, so a tag cannot publish an image from a commit whose
  # tests never ran. Without this trigger, `uses: ./.github/workflows/ci.yml` fails at
  # runtime with "workflow is not reusable" — the release workflow parses fine and
  # breaks only when it is first tagged.
  workflow_call:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    services:
      # The API models use `postgresql.UUID` and JSON columns, which SQLite
      # cannot compile. Shimming them would mean testing different column types
      # than production ships — exactly the class of difference that lets a bug
      # through. So: a real Postgres. Without it the DB-backed tests skip rather
      # than fail, which is why the guard below asserts they actually ran.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alwin
          POSTGRES_PASSWORD: alwin_dev
          POSTGRES_DB: alwin_tutor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U alwin -d alwin_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1, NOT localhost, and `conftest.py` spells out why at length: on a dual-stack host
      # `localhost` resolves to both 127.0.0.1 and ::1, Docker publishes an IPv4 listener only, and
      # the reachability probe requires EVERY resolved address to answer. With `REQUIRE_POSTGRES`
      # below that is not a skip — it is a collection-time failure for a database that is running.
      # This file was not following the advice its own test suite gives.
      TEST_DATABASE_URL: postgresql+asyncpg://alwin:alwin_dev@127.0.0.1:5433/alwin_tutor
      DATABASE_URL: postgresql+asyncpg://alwin:alwin_dev@127.0.0.1:5433/alwin_tutor
      # ALEMBIC READS THIS ONE AND NOTHING ELSE. `alembic/env.py` overrides `alembic.ini` from
      # `DATABASE_URL_SYNC` — not from `DATABASE_URL` — so without this line the "Run migrations"
      # step below silently used `alembic.ini`'s hardcoded
      # `postgresql://alwin:alwin_dev@localhost:5433/alwin_tutor`. That happened to be this job's
      # own service, so it worked, which is worse than failing: the job was one port number away
      # from migrating something else and nothing would have said so. It is not hypothetical —
      # running these same steps by hand with only `DATABASE_URL` set pointed `alembic upgrade
      # head` at a developer's live database and applied a DROP TABLE to it. Sync driver, because
      # alembic runs synchronously; the asyncpg URLs above are for the app and the test session.
      DATABASE_URL_SYNC: postgresql://alwin:alwin_dev@127.0.0.1:5433/alwin_tutor
      # A skip is the right answer on a laptop with no Docker. It is the wrong answer HERE, where
      # Postgres is a declared service: "not reachable" is a broken job, not an absent dependency.
      # `conftest.py` raises at collection when this is set and nothing answers, so the run fails
      # once at the top with the address it tried instead of reporting green over thirty skips.
      REQUIRE_POSTGRES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          # Not requirements.txt: it pins torch, which is ~2.5 GB and is not
          # needed by any router the tests exercise. The API test suite builds
          # its app from the routers directly and never imports `main`.
          # `prometheus-client` IS REQUIRED AND WAS MISSING, and the suite already said so in
          # writing. `tests/test_requirements_cover_the_api.py`'s docstring names this exact hole —
          # "`/metrics` needs `prometheus-client` — and nothing noticed, because CI installs a
          # hand-picked list rather than any of the three files" — and then guarded the three
          # requirements files while the hand-picked list stayed hand-picked. Without it,
          # `metrics.REGISTRY` is None and `test_backend_registry.py` and
          # `test_monitoring_dashboard.py` refuse to run vacuously: they ERROR with "install it
          # rather than skipping", which is the right behaviour and is what turned this job red.
          # `test_the_workflows_install_what_the_api_needs` now derives this list's contents from
          # the same table, so the two cannot drift again.
          pip install \
            "fastapi>=0.109.0" "uvicorn[standard]" "pydantic>=2.5.0" \
            "sqlalchemy[asyncio]>=2.0.0" asyncpg alembic psycopg2-binary \
            redis httpx python-dotenv \
            argon2-cffi email-validator prometheus-client
          pip install -r apps/api/requirements-dev.txt

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      # TEED AND SUMMARISED, because the annotation for this step is "Process completed with exit
      # code 1" and job logs need admin rights to download through the API. Three failures in a row
      # here were diagnosed by rebuilding the job's exact environment locally and guessing at which
      # difference mattered; twice the guess was wrong. The failing test names cost nothing to put
      # somewhere readable. `desktop.yml` does the same for its smoke and its account harness.
      - name: Run API tests
        run: set -o pipefail; pytest apps/api/tests -v 2>&1 | tee api-tests.log

      - name: What the API tests said
        if: always()
        run: |
          [ -f api-tests.log ] || { echo "no log — the step above did not start"; exit 0; }
          {
            echo "### apps/api/tests"
            echo ""
            echo '```'
            grep -E "^(FAILED|ERROR)" api-tests.log || echo "(no FAILED/ERROR lines)"
            echo ""
            tail -25 api-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ALSO AS ::error:: LINES, and that is the part that matters. A step summary is only
          # visible in the browser; annotations come back from the check-runs API, which is all
          # an outside reader has when job logs need admin rights. Three failures here were
          # diagnosed by rebuilding the environment locally because the annotation said nothing
          # but "exit code 1".
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < <(grep -E "^(FAILED|ERROR)" api-tests.log | head -20)

      # A step named "Assert the Postgres-backed tests actually ran" stood here and is replaced by
      # `REQUIRE_POSTGRES` above, because it was wrong in both directions.
      #
      # It ran the WHOLE SUITE A SECOND TIME and grepped the summary for "N skipped" — so it
      # doubled the job's runtime, and it failed on ANY skip from any cause, not just a missing
      # database. Several suites skip legitimately (a live tutor, a GPU), so the guard's own
      # correctness depended on no other test ever being skipped, which is not a property anyone
      # can maintain. `REQUIRE_POSTGRES` asks the precise question instead, once, before collection.

  ml-tree:
    name: ML tree tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        # numpy and PyYAML only. `tests/` covers the memory guard, the packing
        # helper and the taxonomy loader — none of which needs Spark or torch.
        #
        # RUFF IS PINNED, AND IT IS THE ONLY PIN HERE. It was unpinned, and `select = ["RUF"]` in
        # ruff.toml takes the whole rule family — so a ruff release adds rules to this job without
        # a commit touching the repository. That is exactly how this step first went red: 0.16
        # promoted RUF036 out of preview, a developer machine had 0.15.20 and answered "All checks
        # passed!", and the two were not running the same linter. `requirements-dev.txt` carries the
        # same pin so a local run asks CI's question. Raise both together, deliberately, and fix
        # what the new version finds in that commit.
        #
        # `pandas`, `sqlalchemy`, `asyncpg` and `pydantic` ARE REQUIRED AND WERE MISSING, and the
        # symptom was not a skip. `tests/test_fairness.py` and `test_recalibrate.py` reach
        # `analysis/calibration` (pandas), `test_knowledge_corpus.py` needs sqlalchemy AND asyncpg —
        # its second dependency only surfaced once the first was installed, which is the usual shape
        # of this — and `test_vision_content.py` needs pydantic. All module-scope imports, so pytest
        # reported "Interrupted: 5 errors during collection" and ran NOTHING.
        #
        # The fifth was `test_ppo.py`, which is the opposite case and
        # is fixed in the test rather than here: torch stays out of this job, so that module now
        # uses `pytest.importorskip` like every other torch test beside it.
        #
        # The line between the two: install it if the job is meant to exercise it, guard the import
        # if the job is meant to skip it. Either way a collection error is never the right answer,
        # because it takes the whole suite down and reads as exit code 2 with no test named.
        run: |
          pip install pytest pytest-asyncio pytest-cov "ruff==0.16.8" numpy pyyaml \
            lightgbm scikit-learn pandas "sqlalchemy>=2.0" asyncpg "pydantic>=2.5.0"

      - name: Validate the concept taxonomy
        # Its own CLI: acyclicity, referential integrity, cardinality bounds and
        # tag-rule ordering. Cheap, and it fails loudly on a malformed edit.
        run: python -m features.taxonomy

      - name: Lint
        # ruff.toml has existed for a while and CI never ran it, so 37 findings had
        # accumulated — including a test file that was not valid UTF-8 and two `zip()`
        # calls with no `strict=`, one of them in cosine_similarity where a silent
        # truncation would return a plausible similarity for incomparable vectors.
        #
        # Placed BEFORE the tests: a lint failure is a two-second answer and there is no
        # reason to spend a minute on tests to discover it.
        run: ruff check .

      - name: The shipped catalogue loads
        # `tests/` exercises every loader rule against tmp_path fixtures, and two tests call
        # load_raw() on the real tree — but nothing asserted that the 200 shipped items pass
        # the contract. A malformed item would surface as an unrelated test failing, or not
        # at all. One second.
        run: python -c "from features.content import load_items; print(len(load_items()), 'items')"

      - name: Every reference solution reproduces its expected outputs
        # THESE TWO SCRIPTS ALREADY PASSED AND GUARDED NOTHING. Both existed, both exit
        # non-zero on failure, and neither was invoked by any CI job or Makefile target —
        # they were named only in docs/METRICS.md. 125 items, 699 cases, ~33s.
        #
        # A wrong expected_output is worse than a missing problem: it tells a learner their
        # correct answer is wrong, with a green tick next to the reference. That is the one
        # content defect that cannot be caught by review, because reviewing it means running it.
        #
        # Local interpreter, not Judge0 — the sandbox needs a live service. That gap is why
        # the BANNED_IMPORTS check matters: numpy passes here and dies in Judge0's image.
        run: cd apps/api && python -m scripts.verify_problems && python -m scripts.verify_interview_problems

      - name: Run tests with coverage
        # THE FLOOR IS THE MEASURED VALUE, NOT AN ASPIRATION. 41% on the day it was
        # added, so the gate was set at 40 and ratchets upward as modules land. A floor
        # set to 80 here would fail immediately, get lowered or commented out within a
        # week, and then stop protecting anything.
        #
        # The blended figure is dominated by code CI cannot run: the Spark jobs, the IRT
        # fit and ranking/split all need $VC_DATA and sit at 0%. What CI can reach is at
        # 93-100% (ranking 93, recommend 96, retrieval 97, mastery 100). Raising the
        # floor much above 41 therefore requires a warehouse in CI, not more tests.
        #
        # 40 IS NOW 33, AND THAT IS A DROP RATHER THAN A RATCHET — recorded as such rather than
        # quietly edited. Measured in this job's exact environment: 911 of 2688 statements, 33.89%.
        # The fall from 41% is the consolidation, not a regression in testing: it brought in
        # `ranking/eval.py`, `ranking/split.py`, `features/segment.py`, `features/mine.py` and the
        # IRT modules, together ~600 statements that all need the warehouse and all sit at 0%. The
        # numerator barely moved; the denominator grew.
        #
        # This step had NEVER RUN before today — `Lint` failed ahead of it on every previous
        # attempt — so 40 was never measured against this tree at all.
        #
        # 33 RATHER THAN 34, DELIBERATELY, and not for headroom. The two tools disagree on exactly
        # that number: `coverage report --fail-under=34` PASSES at 33.89% because coverage.py rounds
        # to the configured precision before comparing, while pytest-cov compares the float it gets
        # back from `coverage.report()` and fails. Verified both ways. A gate whose verdict depends
        # on which tool evaluates it is not a gate, so it sits one clear point below.
        #
        # The better fix, left as a decision rather than taken here: measure only what this job can
        # execute, by omitting the warehouse-dependent modules. The number would then mean something
        # and could ratchet, instead of tracking how much unreachable code the tree contains.
        #
        # Teed and summarised for the same reason as the API job's step: this one exited 2 —
        # "Interrupted: N errors during collection", not a test failure at all — and the annotation
        # said only "exit code 2". An exit code cannot distinguish "a test is wrong" from "a module
        # will not import in this environment", and those have opposite fixes.
        run: |
          set -o pipefail
          pytest tests -v --cov=features --cov=ranking --cov-report=term --cov-fail-under=33 2>&1 \
            | tee ml-tests.log

      - name: What the ML tree tests said
        if: always()
        run: |
          [ -f ml-tests.log ] || { echo "no log — the step above did not start"; exit 0; }
          {
            echo "### tests/ (ML tree)"
            echo ""
            echo '```'
            grep -E "^(FAILED|ERROR)|errors during collection|Required test coverage" ml-tests.log \
              || echo "(no failure lines)"
            echo ""
            tail -25 ml-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < <(grep -E "^(FAILED|ERROR)|errors during collection|Required test coverage" ml-tests.log | head -20)

  # A `web` JOB STOOD HERE: pnpm install, typecheck, build. The website is its own repository,
  # `voidcode-web`, with its own CI — and that CI checks strictly more than this job did: the two
  # legal documents against their committed digests, the pricing page against the API's exported
  # pack contract, the demo snippet against the catalogue, the env template against what the site
  # actually reads, and every internal link.
  #
  # Nothing replaces it here, because there is nothing here to check. `desktop/tests/entry-docs`
  # asserts the entry documents stop enumerating a tree this repository does not contain.
