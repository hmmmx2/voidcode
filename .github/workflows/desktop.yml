name: desktop

# Phase 1 exit criterion (docs/desktop-app-spec.md §Part 3): reproducible
# installers on all three platforms from a clean public checkout, with the licence
# gate passing and a Study window provably unable to call `fs:*`.

on:
  push:
    # Both names, because this repository has no remote yet and therefore no settled default
    # branch. A workflow that only watches the wrong one of the two never runs, and the symptom is
    # silence rather than an error.
    branches: [main, master]
    paths: ["desktop/**", ".github/workflows/desktop.yml", ".github/allowed-licenses.txt"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", ".github/allowed-licenses.txt"]
  # Callable, so `release.yml` runs *this* gate rather than its own copy of it.
  #
  # This is the cheap half of the refactor the release phase was going to do. The original CI bug was
  # two jobs each independently remembering to install the renderer, and one forgetting; duplicating
  # all three jobs into a release workflow would have been the same mistake at workflow scale. One
  # `workflow_call:` key means there is exactly one definition of what "green" means, and a release
  # cannot be built by a laxer gate than a pull request.
  #
  # Artifacts cross the boundary because a called workflow runs inside the caller's run, so the
  # installers and source maps uploaded below are what `release.yml` downloads.
  workflow_call:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  # Separate from `build` so a licence violation fails fast and unambiguously,
  # rather than surfacing as one red cross among three platform builds.
  licences:
    name: licence gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Both trees, now that both are installed in this job. Keying on one
          # lockfile would leave the renderer's install uncached and, worse, would
          # not invalidate when only the renderer's dependencies changed.
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/renderer/package-lock.json
      - run: npm ci

      # The gate that stops a future contributor quietly re-adding PyMuPDF (AGPL)
      # or a package with CC-BY-NC model weights. Spec §4.2 and §4.3.
      - name: Fail on any dependency outside the allowlist
        run: |
          ALLOWED=$(tr '\n' ';' < ../.github/allowed-licenses.txt)
          npx license-checker-rseidelsohn \
            --production \
            --onlyAllow "$ALLOWED" \
            --excludePrivatePackages

      # The renderer is a separate npm package with its own tree, and it was not
      # gated at all — which mattered, because it is the half a UI dependency
      # actually lands in. Everything the app renders comes from here.
      - name: Install renderer dependencies
        run: npm ci
        working-directory: desktop/renderer

      # Two exclusions, both build-time toolchain rather than shipped code, and
      # named individually rather than by loosening the allowlist — a named
      # exception is reviewable, whereas permitting a licence globally silently
      # admits every future dependency that happens to carry it.
      #
      #   @img/sharp-*   Apache-2.0 AND LGPL-3.0-or-later. An optional transitive
      #                  dependency of Next for image optimisation, which
      #                  `output: "export"` never invokes.
      #   caniuse-lite   CC-BY-4.0. The browser-support data browserslist reads
      #                  while compiling.
      #
      # Neither is distributed: `electron-builder.yml` ships `out/**` and
      # `package.json` only, so `renderer/node_modules` is not in the installer.
      # If that `files:` list ever grows to include it, these exclusions stop
      # being true and this comment is the thing to re-read.
      - name: Fail on any renderer dependency outside the allowlist
        run: |
          ALLOWED=$(tr '\n' ';' < ../../.github/allowed-licenses.txt)
          npx license-checker-rseidelsohn \
            --production \
            --onlyAllow "$ALLOWED" \
            --excludePrivatePackages \
            --excludePackagesStartingWith "@img/sharp;caniuse-lite"
        working-directory: desktop/renderer

      # Two files, because there are two dependency trees. One SBOM covering only
      # `desktop/` would describe half the application and read as if it described
      # all of it — the same blind spot the licence gate had.
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --omit dev --output-file ../sbom-main.json
      - name: Generate renderer SBOM
        run: npx @cyclonedx/cyclonedx-npm --omit dev --output-file ../../sbom-renderer.json
        working-directory: desktop/renderer
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-main.json
            sbom-renderer.json

  verify:
    name: typecheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, because the containment tests behave differently per platform:
        # Windows needs Developer Mode for symlinks (the escape cases skip there and
        # say so), and only POSIX exercises setrlimit later in Phase 2.
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # Both lockfiles. The renderer keeps its own install, so a cache keyed on one
          # of them goes stale whenever the other moves.
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/renderer/package-lock.json
      - run: npm ci

      # THIS STEP WAS MISSING, AND IT FAILED THREE OF THE STEPS BELOW.
      #
      # `desktop/` and `desktop/renderer/` are separate installs — no workspaces, no
      # postinstall. Without this, `npm run typecheck` fails (the tests import renderer
      # components through the `@` alias, so main's tsc reaches renderer sources),
      # `npm --prefix renderer run typecheck` fails outright, and `npm run smoke` fails
      # inside `build:renderer` with "'next' is not recognized".
      #
      # It went unnoticed because there is no git remote, so this workflow had never run.
      # `tests/packaging.test.ts` now asserts the property — every job installs what its
      # steps read — derived over all jobs rather than checking these two by name.
      - name: Install renderer dependencies
        run: npm ci
        working-directory: desktop/renderer

      # Downloads the Pyodide wheels. Must precede the tests: they execute real
      # numpy, and without this Pyodide reaches for a CDN.
      - run: npm run vendor:pyodide

      - run: npm run typecheck

      # The renderer is a separate TypeScript project with its own tsconfig, and `npm run
      # typecheck` above only covers main and the tests. It was not unchecked — `next build`
      # runs tsc over it inside `npm run smoke` further down — but a renderer type error then
      # failed a step named "Study window privilege boundary", four minutes and an Electron
      # launch later. Thirty seconds and an honest name.
      - run: npm --prefix renderer run typecheck

      - run: npm test

      - name: Build all three bundles
        run: npm run build

      # The runtime half of the exit criterion. Needs a display on Linux, hence
      # xvfb; the assertion is that a live Study window exposes no fs/pty/lsp
      # namespace and that mode:get agrees with argv.
      # THE OUTPUT IS TEED AND SUMMARISED, and that is not decoration. Job logs need admin
      # rights to download through the API, so when this step failed on the Linux runner the
      # only thing readable from outside was the step's name and "exit code 1" — no `[smoke]`
      # line, no FAIL reason, nothing to fix. The smoke prints every check it ran and a final
      # `FAIL — <reasons>`; putting that in the step summary is what makes the next failure
      # diagnosable without the log. `verify-accounts` already does this for the same reason.
      #
      # `tee` also matters because the smoke's own exit code is not trustworthy on its own:
      # the single-instance lock quits a concurrent run before any check executes, and it
      # exits 0 having tested nothing. The `[smoke]` lines are the evidence; the code is not.
      #
      # `shell: bash` ON ALL THREE, which is a change on Windows and macOS where these steps
      # previously took the runner default. It is deliberate: in PowerShell, redirecting a
      # native command's stderr with `2>&1` wraps each line in an ErrorRecord and can report
      # failure for a process that exited 0, so the same line would mean different things on
      # different runners. bash is present on every GitHub-hosted runner.
      # `--password-store=basic` ON LINUX ONLY, and the vault's own error message is what asks for
      # it: "On Linux that usually means no keyring is running — install gnome-keyring or kwallet,
      # or run with --password-store to pick one." A headless runner has no keyring, so
      # `safeStorage.isEncryptionAvailable()` is false, `setSecret` throws
      # `EncryptionUnavailableError`, and the smoke failed with `build/threw: ...`. Not a durability
      # problem — that one was already guarded off Linux — but no credential store AT ALL.
      #
      # `basic_text` is a backend `vault.ts` handles deliberately: `backendIsDurable()` names it as
      # one it can "vouch against", so the secret is kept for the launch only and `storedDurably`
      # comes back false, which is exactly what the smoke already tolerates here. So this selects
      # the state the code was written for rather than working around it.
      #
      # `npm run smoke -- <flag>` appends to the end of the script's `&&` chain, which is the
      # `electron out/main/index.js` invocation.
      - name: Smoke — Study window privilege boundary
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run --auto-servernum npm run smoke -- --password-store=basic 2>&1 | tee smoke.log
      - name: Smoke — Study window privilege boundary
        if: runner.os != 'Linux'
        shell: bash
        run: npm run smoke 2>&1 | tee smoke.log

      - name: What the smoke said
        # `always()`, because the interesting case is the one where the step above failed.
        if: always()
        shell: bash
        run: |
          if [ ! -f smoke.log ]; then
            echo "no smoke.log — the step above did not get as far as running it"
            exit 0
          fi
          {
            echo "### smoke (${{ matrix.os }})"
            echo ""
            echo '```'
            grep "\[smoke\]" smoke.log || echo "(the smoke printed no [smoke] line at all — it did not reach its first check)"
            echo ""
            echo "--- last 60 lines ---"
            tail -60 smoke.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The FAIL line as an ::error::, so it reaches the check-run annotations the API
          # serves. The step summary above is browser-only, and the Linux smoke failure that
          # prompted all of this could not be read from outside at all.
          grep "\[smoke\]" smoke.log || true
          # FROM THE HEADER TO THE END, not just the header. `[smoke] FAILED` is printed on its
          # own line and every reason follows it as `  - <reason>` — so the first version of this
          # emitted one annotation reading exactly "[smoke] FAILED", which is a verdict with the
          # reason cut off. Same mistake as the step summary, one layer in.
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < <(sed -n '/^\[smoke\] FAILED/,$p' smoke.log | head -25)

  verify-accounts:
    # Registration, sign-in and reset-by-code against the REAL API and a real Postgres, driven
    # through the real app. `verify` above cannot ask this: it is npm-only on three operating
    # systems with no Python and no database.
    #
    # ONE OS, DELIBERATELY. Nothing in the account flow is platform-specific except `safeStorage`'s
    # durability, and the script already asserts `durable` only off Linux — on headless Linux there
    # is no keyring, so the session is kept for the launch only while `isEncryptionAvailable()`
    # stays true and signing in still works. Running this three times would buy a second copy of
    # the same assertions and one platform-specific one that has to be skipped anyway.
    name: accounts end to end
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alwin
          POSTGRES_PASSWORD: alwin_dev
          POSTGRES_DB: alwin_tutor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U alwin -d alwin_tutor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 127.0.0.1, not localhost. On a dual-stack host `localhost` can resolve to a listener that
      # completes the handshake and never serves, and the driver then blocks with no refusal to fall
      # back from — the reason `conftest.py` spells out its own address at length.
      VOIDCODE_E2E_DATABASE_URL: postgresql://alwin:alwin_dev@127.0.0.1:5433/alwin_tutor
      DATABASE_URL_SYNC: postgresql://alwin:alwin_dev@127.0.0.1:5433/alwin_tutor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the API's dependencies
        # Not `requirements.txt`: it pins torch, ~2.5 GB, and `USE_SGLANG=true` means no model is
        # loaded in this process.
        #
        # `openai` IS REQUIRED HERE AND NOT IN `ci.yml`'s API job, and copying that job's list
        # without it is what made this job fail the first time it ran. That suite never imports
        # `main` — deliberately, because importing it pulls torch — so it never reaches the
        # lifespan. THIS job spawns `uvicorn src.main:app`, and the lifespan's SGLang branch does
        # `import openai as _openai` to build the backend client. Without it the app raises during
        # startup, never becomes ready, and the harness reports that it never answered — which reads
        # like a broken harness rather than a missing dependency.
        run: |
          python -m pip install --upgrade pip
          pip install             "fastapi>=0.109.0" "uvicorn[standard]" "pydantic>=2.5.0"             "sqlalchemy[asyncio]>=2.0.0" asyncpg alembic psycopg2-binary             redis httpx python-dotenv openai             argon2-cffi email-validator prometheus-client

      - name: Run migrations
        working-directory: apps/api
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/renderer/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop/renderer

      - name: Accounts end to end
        # xvfb because this launches a real Electron window. `tee` because the script exits 0 on a
        # SKIP and the step below has to read what it said.
        #
        # `set -o pipefail` AND `|| true`, which look contradictory and are not. Without pipefail
        # this step's exit code was `tee`'s, so it reported SUCCESS whatever the harness did — and
        # it did report success while the harness was failing, which is why the only evidence was
        # the guard step below saying "did not report PASS" with no reason attached. With pipefail
        # the harness's own code reaches `$?`; `|| true` then keeps this step green on purpose, so
        # the run reaches the guard that can read the log and say something useful. The exit code is
        # recorded rather than acted on here.
        #
        # The comment above said `tee` was there so the step below could read the output. That was
        # true and incomplete: `tee` also swallowed every failure this step was supposed to surface.
        shell: bash
        run: |
          set -o pipefail
          # `|| code=$?` AND NOT `|| true` FOLLOWED BY PIPESTATUS. The first version of this read
          # `${PIPESTATUS[0]}` after `|| true`, and `true` is itself a pipeline, so PIPESTATUS had
          # already been reset to (0): it would have reported success for every failure, which is
          # the exact bug this step was being changed to fix. Measured, not assumed --
          # `(exit 7) | tee /dev/null || true` gives PIPESTATUS[0]=0, while `|| code=$?` gives 7,
          # because an assignment does not run a pipeline before `$?` is read.
          code=0
          xvfb-run --auto-servernum npm run smoke:account 2>&1 | tee smoke-account.log || code=$?
          echo "harness exit: $code" | tee -a smoke-account.log
        working-directory: desktop

      - name: A skip is a failure here
        # THE POINT OF THIS JOB. The script skips cleanly and exits 0 when its dependencies are
        # absent, which is right on a developer's machine and wrong in a job that declares them:
        # a green run that tested nothing is worse than a red one, because nobody looks at it.
        # Every dependency is installed above, so "skipped" means this job is broken.
        run: |
          # EVERY `[account]` LINE AS AN ANNOTATION, not just the one-line verdict. The step
          # summary below is browser-only and served by no API, so "did not report PASS" was the
          # entire readable output of two failed runs — a verdict with no reason attached. Check-run
          # annotations ARE served, so the harness's own trace goes there too. Capped at 20 because
          # GitHub keeps the first N per check run and the useful lines come first.
          emit_account_lines() {
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < <(grep "\[account\]" smoke-account.log | head -20)
            # AND THE TAIL, because the interesting failure had no `[account]` prefix at all. The
            # harness reported "api: up" and then nothing: it had thrown, Node printed a bare
            # stack, and a grep for the prefix could not see it. Two annotations that say the API
            # started and one that says it did not pass is a report with the cause cut out.
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::log: $line"
            done < <(tail -12 smoke-account.log)
          }
          if grep -q "\[account\] SKIP" smoke-account.log; then
            echo "::error::smoke:account skipped in a job that provides every dependency it needs."
            emit_account_lines
            grep "\[account\]" smoke-account.log
            exit 1
          fi
          if ! grep -q "\[account\] PASS" smoke-account.log; then
            echo "::error::smoke:account did not report PASS."
            emit_account_lines
            # ALSO INTO THE STEP SUMMARY, because job logs need admin rights to download through the
            # API. The first time this job failed, all that could be read from outside was this
            # step's one-line annotation; the reason was in a log nobody could fetch.
            {
              echo "### smoke:account did not report PASS"
              echo ""
              echo '```'
              grep "\[account\]" smoke-account.log || echo "(the harness printed nothing)"
              echo ""
              echo "--- last 60 lines ---"
              tail -60 smoke-account.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -60 smoke-account.log
            exit 1
          fi
          grep "\[account\]" smoke-account.log
        working-directory: desktop

  package:
    name: installer (${{ matrix.os }})
    needs: [licences, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/renderer/package-lock.json
      - run: npm ci

      # Same omission as `verify` had: `npm run package` runs `build:renderer`, which
      # needs the renderer's own install.
      - name: Install renderer dependencies
        run: npm ci
        working-directory: desktop/renderer

      # `npm run package` vendors Pyodide itself now, so this is belt-and-braces for the
      # cache rather than a requirement. It stays because a warm wheel cache makes the
      # packaging step's own vendor call a no-op instead of a download.
      - run: npm run vendor:pyodide

      # No identity signing. Certificates cost money and this is an OSS project (spec §4.3). The
      # README's "Installing a build" section documents the SmartScreen and Gatekeeper prompts rather
      # than letting users discover them, and the download page walks through both. SignPath is the
      # follow-up for signing itself. macOS builds are still AD-HOC signed by
      # `desktop/build/ad-hoc-sign.cjs`, because arm64 refuses to run an unsigned binary outright —
      # that is not a warning a user can click through.
      #
      # ── WHERE THE APP'S ADDRESSES COME FROM ────────────────────────────────────────────────────
      #
      # `electron.vite.config.ts` bakes these into `__VOIDCODE_BUILD__` at build time, and a
      # PACKAGED build ignores the matching runtime environment variables (`platform/config.ts`
      # only honours them when the app is unpackaged). So a wrong value here ships inside the
      # binary and cannot be corrected by the person running it.
      #
      # Repository VARIABLES, not secrets: an API origin, a website origin and two OAuth client IDs
      # are public identifiers that the installer hands to every user anyway. The only secret in
      # that flow is Google's client secret, and it stays in the API's environment because the API
      # redeems the authorization code, never the app.
      #
      # EMPTY IS A VALID VALUE, and it is what a fork's pull request gets — `vars` are not exposed
      # to forks. `apiBase()` then returns null, the app reports "VoidCode isn't set up in this
      # build" instead of calling somebody else's server, and the provider buttons are hidden. A
      # fork therefore builds a working offline editor, which is the correct outcome.
      #
      # VOIDCODE_BUILD_ALLOW_OVERRIDE is deliberately NOT set: leaving it off is what makes a
      # packaged build ignore `VOIDCODE_API_URL` from the environment it happens to run in.
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VOIDCODE_BUILD_API_URL: ${{ vars.VOIDCODE_BUILD_API_URL }}

      # The signature the hook made, checked by something other than the hook. `codesign --verify`
      # walks the nested helpers with `--deep --strict`, so a bundle whose outer app is signed and
      # whose Electron framework is not fails here rather than on a user's machine.
      #
      # NOT `spctl --assess`: that asks Gatekeeper whether the app would be ALLOWED, and the honest
      # answer for an unnotarised build is no. Asserting it would mean asserting something this
      # project does not claim.
      - name: The macOS app is ad-hoc signed
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "no .app was packed, so there is nothing to verify" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # Prints "Signature=adhoc" for a signature with no identity. Asserted, because an
            # identity appearing here would mean a certificate leaked into a public build.
            codesign --display --verbose=2 "$app" 2>&1 | tee /tmp/codesign.txt
            grep -q "Signature=adhoc" /tmp/codesign.txt
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

      # ── THE SOURCE MAPS, WITH THEIR CHUNKS ──────────────────────────────────────────────────────
      #
      # `electron-builder.yml` filters `.map` out of the packaged renderer, so an installed app has
      # chunks and no mappings and a stack from it resolves to nothing. This archive is the other side
      # of that decision: the maps do not ship, but they are kept.
      #
      # **Both the `.js` and the `.js.map` files, in their original layout.** Not a maps-only tarball,
      # which would look perfectly reasonable and resolve nothing: Next hashes each map's filename
      # independently of the chunk's, so `03b639d8.js` is described by `f881e26f.js.map`, and the only
      # link between them is the `sourceMappingURL` comment at the end of the chunk.
      # `scripts/resolve-log.mjs` reads that comment rather than deriving a name, precisely because a
      # derived name matches about one chunk in thirty-six.
      #
      # Per-OS rather than one shared archive. The chunk hashes are content-derived and *should* be
      # identical across the three runners — but resolve-log's own warning is that a hash which
      # collides across builds produces a confident wrong answer rather than an error, which is worse
      # than no answer. Three 11MB archives is a cheap price for never having to trust "should".
      #
      # `BUILD-COMMIT.txt` is in the archive because resolving a stack needs two things and the archive
      # can only carry one of them. A map resolves a chunk coordinate to `MenuBar.tsx:223`, and line 223
      # means nothing without the version of `MenuBar.tsx` that was compiled. Rehearsing this locally
      # cost real time: the archived map resolved to a line that was a different function entirely in
      # the working tree, and the map was right — `renderer/out` was simply older than `renderer/src`.
      # Without the commit there is no way to tell that from a bug in the tooling.
      - name: Archive the source maps with their chunks
        shell: bash
        run: |
          echo "${{ github.sha }}" > renderer/out/_next/static/BUILD-COMMIT.txt
          tar -czf "voidcode-sourcemaps-${{ matrix.os }}.tar.gz" \
            -C renderer/out/_next/static BUILD-COMMIT.txt chunks
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ matrix.os }}
          path: desktop/voidcode-sourcemaps-${{ matrix.os }}.tar.gz
          if-no-files-found: error
          # Short, because on an ordinary push these exist only so a stack from a CI build is
          # resolvable for a few days. A release does not depend on this number: `release.yml`
          # downloads them inside the same run and attaches them to the tag, which is what makes a
          # released stack resolvable for the life of the release rather than for 90 days.
          retention-days: 5
