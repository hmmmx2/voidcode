name: release

# ── ONE REPOSITORY, ONE RELEASE ───────────────────────────────────────────────────────────────────
#
# This workflow runs the whole gate on a `v*` tag and publishes a single draft release on THIS
# repository, carrying every installer — Linux, macOS and Windows — plus SBOMs, source maps and one
# checksums file over all of it. The macOS and Windows installers are ALSO copied to version-less
# names that `voidcode-web` links directly, so the download page needs no API call at view time.
#
# IT USED TO COPY THE INSTALLERS INTO TWO OTHER REPOSITORIES (`voidcode-mac`, `voidcode-windows`) in a
# `distribute` job, which needed a fine-grained cross-repo PAT (`DIST_RELEASE_TOKEN`). That token was
# the single point of failure for the first release: `github.token` cannot write to another
# repository at all, so the whole release turned on one secret being present and correctly scoped —
# and it was not, so nothing ever reached the download page. Collapsing to one repository removes that
# dependency entirely. The download page reads this repository's PUBLIC releases, and there is nothing
# left to authorize. The two installer repositories are now unused.
#
# Separate from `desktop.yml` for two concrete reasons rather than tidiness:
#
#   - `desktop.yml` is path-filtered to `desktop/**`. A tag push touches no paths, so a job added
#     there would silently never run on the one event that matters.
#   - `contents: write` lives only in this file. The gate that runs on every pull request has no
#     permission to publish anything, which is the point of the split.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release from, e.g. v0.1.0"
        required: true
        type: string

# Never cancel a release in flight. `desktop.yml` cancels superseded pull-request runs because the
# newer commit is what matters; here a half-finished run may already have created a draft, and the
# recovery is worse than waiting.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The whole gate — licences, typecheck, tests, smoke, and the installers on all three platforms.
  # Called rather than copied: see the `workflow_call:` comment in desktop.yml.
  gate:
    uses: ./.github/workflows/desktop.yml

  release:
    name: draft release
    needs: gate
    runs-on: ubuntu-22.04
    # Scoped to this job, not the workflow. The gate above inherits none of it.
    permissions:
      contents: write
      # Both required by attest-build-provenance: the OIDC token it signs with, and the store it
      # writes the attestation to.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # `merge-multiple` flattens installer-*, sourcemaps-* and sbom into one directory, which is what
      # a single checksum file over the whole release wants.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Refuse a tag that is not a version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A dispatch can name any ref. Without this, `gh release create` would happily create a
          # release *and a tag* from a branch name, which is a mess to undo on a public repository.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ── A NAME THAT DOES NOT MOVE BETWEEN RELEASES ───────────────────────────────────────────────
      #
      # `artifactName` in electron-builder.yml carries the version, so every release renames every
      # file. That is right for an archive and wrong for a download page: `voidcode-web` links
      # `https://github.com/<repo>/releases/latest/download/<name>`, a redirect subject to no API
      # limit — but it needs a name that will be the same next release. So each macOS and Windows
      # installer is COPIED to a fixed name and both are published: the versioned one for anyone
      # archiving a specific build, the fixed one for the page to link. `cp`, not `mv`, because losing
      # the versioned name would make two downloaded releases indistinguishable.
      #
      # THE NAMES ARE A CONTRACT with `voidcode-web`'s `DownloadSection.tsx` (`stableName`) and its
      # `scripts/resolve-release.mjs` (`STABLE`), which must match these exactly. A typo on any side is
      # a download button that 404s, and nothing here would notice until a person clicked it.
      #
      # This runs BEFORE the checksums step below on purpose, so `SHA256SUMS.txt` covers the fixed
      # names a visitor actually downloads, not only the versioned ones. It also refuses rather than
      # publishing a stable name with no file behind it — the exact failure that is otherwise found by
      # a visitor clicking a 404.
      - name: Copy each installer to a version-less name
        working-directory: assets
        run: |
          set -euo pipefail
          copy() {
            pattern="$1"
            stable="$2"
            count=$(ls -1 $pattern 2>/dev/null | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::no file matched $pattern, so $stable cannot be published. The download"
              echo "::error::page links that name directly and would 404."
              exit 1
            fi
            if [ "$count" -ne 1 ]; then
              echo "::error::$pattern matched $count files; one stable name cannot stand for several."
              exit 1
            fi
            cp "$(ls -1 $pattern)" "$stable"
            echo "  $(ls -1 $pattern) -> $stable"
          }
          copy '*-mac-arm64.dmg' 'VoidCode-macOS-AppleSilicon.dmg'
          copy '*-mac-x64.dmg'   'VoidCode-macOS-Intel.dmg'
          copy '*-win-x64.exe'   'VoidCode-Windows-x64-Setup.exe'
          copy '*-win-arm64.exe' 'VoidCode-Windows-ARM64-Setup.exe'
          ls -l

      # ── ONE CHECKSUM FILE, OVER EVERYTHING ATTACHED ──────────────────────────────────────────────
      #
      # The substitute for a code signature, and the only thing a user can currently check a download
      # against — the installers are unsigned on all three platforms and the README says so.
      #
      # One file rather than one per artifact, so verifying the set is a single command and a missing
      # line is visible. Sorted, so two builds of the same commit produce byte-identical output, which
      # is the same reason `artifactName` in electron-builder.yml carries no timestamp.
      - name: Checksums
        working-directory: assets
        run: |
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # Real SLSA provenance: a signed statement of which workflow, at which commit, produced these
      # bytes. `subject-checksums` reads the file above, so one call covers every asset in the release
      # and the attestation cannot drift from the checksums a user verifies against.
      #
      # Unverified like everything else here, and with one known precondition: this requires a public
      # repository (or GitHub Advanced Security). If it fails on the first real release, delete the step
      # and say so in docs/RELEASE.md rather than leaving a claim to provenance nobody can check.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: assets/SHA256SUMS.txt

      # ── THE DRAFT ────────────────────────────────────────────────────────────────────────────────
      #
      # `gh` rather than a third-party release action: it is preinstalled on every runner, so there is
      # no third-party code in the one job that holds `contents: write`, and nothing to pin.
      #
      # `--draft` is the load-bearing flag. A human writes the notes and can delete a bad build before
      # anyone can download it. Packaging already runs under `--publish never`, so building and
      # publishing stay separable at both ends. The download page reads `releases/latest`, which
      # excludes drafts, so a human clicking Publish is what makes a build visible to anyone.
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'BODY'
          ## Install

          Read **Installing a build** in the README first. These installers are **not code-signed** on
          any platform: Windows will show a SmartScreen prompt whose "Run anyway" is hidden behind
          "More info", and macOS will refuse the app until you allow it in System Settings → Privacy &
          Security.

          Verify what you downloaded against `SHA256SUMS.txt`:

          ```
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ```

          ## What the other assets are

          - `sbom-main.json`, `sbom-renderer.json` — CycloneDX SBOMs for the two dependency trees. Two
            files because the app has two; one would describe half of it and read as if it described
            all of it.
          - `voidcode-sourcemaps-*.tar.gz` — the renderer's build output for this release: the
            JavaScript chunks **and** their `.js.map` files. This is not application source and it is
            not a leak; it is what `scripts/resolve-log.mjs` needs to turn a stack trace from an
            installed build back into file names and line numbers, and it is attached to the tag so a
            released stack stays resolvable for the life of the release. Both halves are required —
            Next hashes each map's name independently of its chunk, so a maps-only archive resolves
            nothing. `BUILD-COMMIT.txt` inside the archive names the commit that produced it, because
            a position only means something against the source it was compiled from. Note that the
            build runs the React Compiler and the maps resolve to *its* output rather than to the
            original file, so the filename and function in a resolved frame are exact and the line
            number is approximate — `scripts/resolve-log.mjs` explains this at length.
          BODY
          # IDEMPOTENT, because re-cutting the same tag must not fail on "release already exists". An
          # existing draft is refreshed in place — its assets replaced with this run's — rather than
          # deleted, so a release a human has already started editing keeps its notes and its state.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refreshing its assets"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" \
              --draft \
              --title "VoidCode $TAG" \
              --notes-file notes.md \
              assets/*
          fi
