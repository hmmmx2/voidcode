name: release

# ── NOTHING IN THIS FILE HAS EVER RUN ─────────────────────────────────────────────────────────────
#
# There is no git remote on this repository, so no workflow here has executed once — which is exactly
# how the original CI bug survived review. That is stated at the top rather than buried, because it
# changes how this should be read: the YAML is checked by `tests/packaging.test.ts` and the *substance*
# of every step was rehearsed locally by hand (checksums computed, the archive extracted elsewhere, a
# real stack from the packaged app resolved against it), but the orchestration is unproven.
#
# Separate from `desktop.yml` for two concrete reasons rather than tidiness:
#
#   - `desktop.yml` is path-filtered to `desktop/**`. A tag push touches no paths, so a job added
#     there would silently never run on the one event that matters.
#   - `contents: write` lives only in this file. The gate that runs on every pull request has no
#     permission to publish anything, which is the point of the split.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release from, e.g. v0.1.0"
        required: true
        type: string

# Never cancel a release in flight. `desktop.yml` cancels superseded pull-request runs because the
# newer commit is what matters; here a half-finished run may already have created a draft, and the
# recovery is worse than waiting.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The whole gate — licences, typecheck, tests, smoke, and the installers on all three platforms.
  # Called rather than copied: see the `workflow_call:` comment in desktop.yml.
  gate:
    uses: ./.github/workflows/desktop.yml

  release:
    name: draft release
    needs: gate
    runs-on: ubuntu-22.04
    # Scoped to this job, not the workflow. The gate above inherits none of it.
    permissions:
      contents: write
      # Both required by attest-build-provenance: the OIDC token it signs with, and the store it
      # writes the attestation to.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      # `merge-multiple` flattens installer-*, sourcemaps-* and sbom into one directory, which is what
      # a single checksum file over the whole release wants.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Refuse a tag that is not a version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A dispatch can name any ref. Without this, `gh release create` would happily create a
          # release *and a tag* from a branch name, which is a mess to undo on a public repository.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # ── ONE CHECKSUM FILE, OVER EVERYTHING ATTACHED ──────────────────────────────────────────────
      #
      # The substitute for a code signature, and the only thing a user can currently check a download
      # against — the installers are unsigned on all three platforms and the README says so.
      #
      # One file rather than one per artifact, so verifying the set is a single command and a missing
      # line is visible. Sorted, so two builds of the same commit produce byte-identical output, which
      # is the same reason `artifactName` in electron-builder.yml carries no timestamp.
      - name: Checksums
        working-directory: assets
        run: |
          find . -maxdepth 1 -type f -printf '%f\0' | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      # UPLOADED AS AN ARTIFACT, NOT ONLY ATTACHED TO THE RELEASE, and `distribute` is the reason.
      # It used to fetch the release's assets with `gh release download`, holding `contents: read` —
      # and GitHub shows draft releases only to tokens with PUSH access, so that download would have
      # 404'd on the first real tag with "release not found", which reads as "the release was never
      # created" rather than "this token cannot see drafts". The alternatives were to give that job
      # `contents: write` on this repository — the one thing its comment says it must not have, since
      # it writes to two OTHERS — or to stop depending on the draft being readable. This is the
      # second. Every installer is already an artifact of this run; the checksums were the only file
      # that was not.
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: assets/SHA256SUMS.txt
          if-no-files-found: error

      # Real SLSA provenance: a signed statement of which workflow, at which commit, produced these
      # bytes. `subject-checksums` reads the file above, so one call covers every asset in the release
      # and the attestation cannot drift from the checksums a user verifies against.
      #
      # Unverified like everything else here, and with one known precondition: this requires a public
      # repository (or GitHub Advanced Security). If it fails on the first real release, delete the step
      # and say so in docs/RELEASE.md rather than leaving a claim to provenance nobody can check.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: assets/SHA256SUMS.txt

      # ── THE DRAFT ────────────────────────────────────────────────────────────────────────────────
      #
      # `gh` rather than a third-party release action: it is preinstalled on every runner, so there is
      # no third-party code in the one job that holds `contents: write`, and nothing to pin.
      #
      # `--draft` is the load-bearing flag. A human writes the notes and can delete a bad build before
      # anyone can download it. Packaging already runs under `--publish never`, so building and
      # publishing stay separable at both ends.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'BODY'
          ## Install

          Read **Installing a build** in the README first. These installers are **not code-signed** on
          any platform: Windows will show a SmartScreen prompt whose "Run anyway" is hidden behind
          "More info", and macOS will refuse the app until you allow it in System Settings → Privacy &
          Security.

          Verify what you downloaded against `SHA256SUMS.txt`:

          ```
          sha256sum --check --ignore-missing SHA256SUMS.txt
          ```

          ## What the other assets are

          - `sbom-main.json`, `sbom-renderer.json` — CycloneDX SBOMs for the two dependency trees. Two
            files because the app has two; one would describe half of it and read as if it described
            all of it.
          - `voidcode-sourcemaps-*.tar.gz` — the renderer's build output for this release: the
            JavaScript chunks **and** their `.js.map` files. This is not application source and it is
            not a leak; it is what `scripts/resolve-log.mjs` needs to turn a stack trace from an
            installed build back into file names and line numbers, and it is attached to the tag so a
            released stack stays resolvable for the life of the release. Both halves are required —
            Next hashes each map's name independently of its chunk, so a maps-only archive resolves
            nothing. `BUILD-COMMIT.txt` inside the archive names the commit that produced it, because
            a position only means something against the source it was compiled from. Note that the
            build runs the React Compiler and the maps resolve to *its* output rather than to the
            original file, so the filename and function in a resolved frame are exact and the line
            number is approximate — `scripts/resolve-log.mjs` explains this at length.
          BODY
          gh release create "$TAG" \
            --draft \
            --title "VoidCode $TAG" \
            --notes-file notes.md \
            assets/*

  # ── THE TWO DISTRIBUTION REPOSITORIES ──────────────────────────────────────────────────────────
  #
  # The installers a person downloads live in `voidcode-mac` and `voidcode-windows`, which hold no
  # source and no history of this project — just a README saying which file to take and what the
  # platform's own security prompt will say. The main release above keeps everything: Linux builds,
  # SBOMs, source maps, and the checksums over all of it.
  #
  # IN THIS WORKFLOW RATHER THAN A NEW ONE, and that is a constraint rather than a preference.
  # `release-config.test.ts` asserts that `release.yml` is the ONLY workflow triggered by a `v*` tag
  # (containers are on `api-v*`). A second `v*` workflow would fail that test on day one, which is
  # the test working: two workflows racing on one tag is how a release ends up half-published.
  #
  # `needs: release` is load-bearing. `SHA256SUMS.txt` is produced there, over every asset, and the
  # distribution repositories' own `verify-release.yml` checks the installers against it. Running
  # these in parallel would publish installers alongside a checksums file that had not been written
  # yet — or worse, an earlier one.
  distribute:
    name: copy the installers to their own repositories
    needs: release
    runs-on: ubuntu-22.04
    # NO `contents: write`. This job writes to OTHER repositories, which `github.token` cannot do at
    # all; it needs no permission on this one beyond reading the release it just made.
    permissions:
      contents: read
    steps:
      - name: Refuse to run without the scoped token
        env:
          DIST_RELEASE_TOKEN: ${{ secrets.DIST_RELEASE_TOKEN }}
        run: |
          if [ -z "$DIST_RELEASE_TOKEN" ]; then
            echo "::error::DIST_RELEASE_TOKEN is not set, so the installers cannot be copied to"
            echo "::error::voidcode-mac and voidcode-windows. It must be a FINE-GRAINED token with"
            echo "::error::Contents: Read and write, scoped to exactly those two repositories — not a"
            echo "::error::classic PAT with 'repo', which grants write to every repository the account"
            echo "::error::can reach, from a job that needs two."
            exit 1
          fi

      # The tag, resolved the same way the release job resolves it: a dispatch can name any ref.
      - name: Resolve the tag
        run: echo "TAG=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      # FROM THE RUN'S ARTIFACTS, NOT FROM THE RELEASE. `gh release download "$TAG"` stood here and
      # could not have worked: the release above is a DRAFT, GitHub shows drafts only to tokens with
      # push access, and this job holds `contents: read` on purpose. It would have failed the first
      # real tag with "release not found".
      #
      # The same bytes either way — `release` attaches these very artifacts plus the checksums file
      # it computes over them, and this job cannot start unless that succeeded. What is given up is
      # small and worth naming: this no longer proves the assets are IN the release, only that the
      # job which attached them exited 0.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: What came down
        working-directory: assets
        run: ls -l

      # ── COUNT BEFORE COPYING ──────────────────────────────────────────────────────────────────
      #
      # `gh release create <tag> *.dmg` with no matching file creates an EMPTY RELEASE and exits 0.
      # The distribution repository would then publish a release page with nothing on it, and the
      # only symptom is a visitor finding no download — discovered by them, not by us.
      #
      # The expected counts are two per platform because `electron-builder.yml` builds x64 and arm64
      # for both. `tests/release-config.test.ts` holds these numbers to that file, so adding a third
      # architecture fails there rather than silently shipping one fewer installer than was built.
      - name: Check the installers are actually here
        working-directory: assets
        run: |
          for pair in "dmg:2" "exe:2"; do
            ext="${pair%%:*}"; want="${pair##*:}"
            got=$(ls -1 *."$ext" 2>/dev/null | wc -l)
            echo "$ext: $got present, $want expected"
            if [ "$got" -ne "$want" ]; then
              echo "::error::expected $want .$ext installer(s) in $TAG and found $got."
              echo "::error::Copying them now would publish a release page with nothing on it."
              exit 1
            fi
          done
          test -f SHA256SUMS.txt || { echo "::error::no SHA256SUMS.txt to copy"; exit 1; }

      # ── THE COPY ──────────────────────────────────────────────────────────────────────────────
      #
      # `--draft` on both, for the same reason the main release is a draft: the download page reads
      # `releases/latest`, which excludes drafts, so a human publishing is what makes a build visible
      # to anyone. A bad build can be deleted before it is ever handed out.
      #
      # `SHA256SUMS.txt` goes with each. It lists every asset of the main release, including files
      # not copied here — which is why each repository's `verify-release.yml` filters to its own
      # extension rather than running a plain `--check`.
      - name: macOS
        env:
          GH_TOKEN: ${{ secrets.DIST_RELEASE_TOKEN }}
          REPO: ${{ vars.VOIDCODE_RELEASES_REPO_MAC }}
        working-directory: assets
        run: |
          test -n "$REPO" || { echo "::error::VOIDCODE_RELEASES_REPO_MAC is not set"; exit 1; }
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "VoidCode $TAG" \
            --notes "macOS installers for VoidCode $TAG. Verify against SHA256SUMS.txt — see the README." \
            *.dmg SHA256SUMS.txt

      - name: Windows
        env:
          GH_TOKEN: ${{ secrets.DIST_RELEASE_TOKEN }}
          REPO: ${{ vars.VOIDCODE_RELEASES_REPO_WIN }}
        working-directory: assets
        run: |
          test -n "$REPO" || { echo "::error::VOIDCODE_RELEASES_REPO_WIN is not set"; exit 1; }
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "VoidCode $TAG" \
            --notes "Windows installers for VoidCode $TAG. Verify against SHA256SUMS.txt — see the README." \
            *.exe SHA256SUMS.txt
