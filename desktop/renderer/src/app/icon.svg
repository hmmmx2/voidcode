<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 27 27">
  <!--
    Favicon. Same aperture ring as components/brand/Mark.tsx, at a tighter
    framing: viewBox 27 instead of 32, so the ring carries ~1 unit of padding
    instead of 3.5. At 16px that is an outer diameter of 14.8px rather than
    12.5px, which is a real legibility difference in a tab strip.

    Geometry is otherwise identical — r=10, stroke-width 5, butt caps, 52° gap
    bisected by 270°. Endpoints are (13.5 + 10·cos θ, 13.5 + 10·sin θ) for
    θ = 296° and 244°. This is duplicated geometry with Mark.tsx: change one,
    change the other.

    DO NOT use currentColor here. A favicon is rendered as its own document with
    no parent to inherit from, so currentColor resolves to black and the mark
    disappears against dark browser chrome. The media query is honoured by
    Chrome, Safari and Firefox inside favicon SVGs.
  -->
  <style>
    path { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #ffffff; }
    }
  </style>
  <path
    d="M17.884 4.512A10 10 0 1 1 9.116 4.512"
    fill="none"
    stroke-width="5"
    stroke-linecap="butt"
  />
</svg>
