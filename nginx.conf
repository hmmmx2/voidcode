# nginx.conf
# ──────────────────────────────────────────────────────────────────────────────
# VoidCode AI — Nginx Reverse Proxy / Load Balancer
#
# Purpose: distribute requests across vLLM API replicas (docker-compose.prod.yml)
# Algorithm: least_conn — route each new request to the replica with the fewest
#   active connections; critical for long-lived SSE streams (some replicas may
#   be busy generating 8 192-token responses while others are idle).
#
# SSE compatibility: proxy buffering MUST be disabled for Server-Sent Events.
#   Without `proxy_buffering off`, Nginx buffers the entire response before
#   forwarding, making streaming invisible until the response finishes.
#
# Timeouts:
#   proxy_read_timeout 300s — longest expected generation (8 192 tokens at
#   ~30 tok/s ≈ 273 s). Set higher than the backend's own timeout (180 s).
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ── Upstream pool ──────────────────────────────────────────────────────────
    upstream vllm_backends {
        least_conn;                         # Shortest-queue routing (best for SSE)
        server vllm-api-1:8000;
        server vllm-api-2:8000;
        server vllm-api-3:8000;

        # Mark a backend as "down" after 3 failures; probe every 10 s.
        # Nginx OSS does not support active health checks — passive only.
    }

    # ── Server block ──────────────────────────────────────────────────────────
    server {
        listen 8000;
        server_name _;                      # Accept any hostname

        # ── SSE + general proxy ───────────────────────────────────────────────
        location / {
            proxy_pass http://vllm_backends;

            # HTTP/1.1 + persistent connections to backend
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward original request metadata
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ── CRITICAL: disable buffering for SSE ───────────────────────────
            # Without these settings, Nginx buffers the entire response before
            # sending, breaking streaming. Students would see a blank screen
            # until the full response is generated.
            proxy_buffering         off;
            proxy_cache             off;
            proxy_request_buffering off;

            # Tell proxies downstream (CDN, reverse proxies) not to buffer either
            add_header X-Accel-Buffering no;

            # Enable chunked transfer (required for SSE)
            chunked_transfer_encoding on;

            # ── Timeouts ──────────────────────────────────────────────────────
            # Connect: how long to wait for a backend to accept the connection
            proxy_connect_timeout  10s;
            # Send: how long to wait for the backend to receive the full request
            proxy_send_timeout     60s;
            # Read: how long to wait for a response chunk from the backend.
            # Must be > the longest possible generation (8 192 tokens @ ~30 tok/s ≈ 273 s).
            proxy_read_timeout     300s;
        }

        # ── Health check endpoint ─────────────────────────────────────────────
        # Nginx's own health endpoint so load balancers / monitoring can probe
        # the proxy layer without going to a backend.
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
