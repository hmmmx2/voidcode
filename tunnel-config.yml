# Cloudflare Tunnel Configuration — the API, and only the API
#
# Used by `cloudflared tunnel run` for a NAMED tunnel (a hostname that survives a
# restart). See docs/specs/TUNNEL_SETUP.md for the whole procedure.
#
# THE FRONTEND INGRESS RULE IS GONE. This file used to route a main domain to a
# Next.js app on :3000 and an `api` subdomain to the API. The logged-in UI is the
# desktop application now — installed, not visited — so there is no front end to
# route to, and the website that remains is a separate repository deployed on
# Vercel rather than tunnelled from a laptop or served from this cluster.
#
# What is left mirrors the real deployment on purpose: deploy/base/ingress.yaml
# publishes `api.<domain>` and nothing else, so a tunnel that does the same is a
# stand-in for the ingress rather than a second architecture to reason about.
#
# Replace <TUNNEL_ID> with your tunnel's id after `cloudflared tunnel create`.

tunnel: <TUNNEL_ID>
credentials-file: ~/.cloudflared/<TUNNEL_ID>.json

ingress:
  # The API. Port 8020 is what the desktop app defaults to and what
  # apps/api/tests/conftest.py expects; the GPU container publishes 8000 instead,
  # so change this line rather than the app if that is what you are running.
  #
  # No path restriction here, unlike the production ingress, which routes only
  # `/v1`. cloudflared does not do path matching — so a tunnel exposes /metrics,
  # /health and /docs as well, and that is the reason this is a development tool
  # and not a way to publish anything.
  - hostname: api.your-domain.com
    service: http://localhost:8020
    originRequest:
      noTLSVerify: true

  # Catch-all (required by cloudflared)
  - service: http_status:404
